# PARKED at tools/learn.workflow.yml: this file belongs at .github/workflows/learn.yml. The session that wrote it pushed
# through a GitHub connection without the `workflow` scope, which GitHub refuses for anything under .github/workflows/.
# One `git mv tools/learn.workflow.yml .github/workflows/learn.yml` from any session or laptop turns it on; until then
# Void still learns at miss time (lib/learn.js inside /api/miss) and `node tools/learn.mjs` runs the sweep by hand.
#
# Void learns by itself (Void's own want, domains/void.will.md #1; frontier item 2). Every day at 2:39 PM New York time,
# half an hour after Void's voice, the misses people typed in the last week are ranked (tools/learn.mjs) and the top
# ones are queued for the builders at /api/queue as `miss:<slug>` jobs, at most 3 open at once. Builders claim them with
# `python tools/void_queue.py claim` like any other job; the builder webhook (BUILDER_WEBHOOK_URL) is woken by the queue.
# When the repo secret OPENROUTER_API_KEY is set, Hermes Agent (Nous Research, MIT; Void's want #2: use an existing
# system that learns from use instead of inventing the loop) drafts each new job into drafts/learned/<slug>.md on main:
# what was asked, which skill should learn it, the probe phrasings for the bench, and the smallest first piece. Without
# the key the jobs are still queued and the builder drafts by hand. Two crons because GitHub's are UTC: 18:39 is 2:39 PM
# in summer time, 19:39 in winter; the gate keeps the right one. Needs VOID_OWNER_TOKEN (the Pages READ_TOKEN).
name: Void learns

on:
  schedule:
    - cron: '39 18 * * *'
    - cron: '39 19 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: show what would be queued, queue nothing
        type: boolean
        default: false

concurrency:
  group: void-learn
  cancel-in-progress: false

permissions:
  contents: write # the drafts on main

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_KEY: ${{ secrets.OPENROUTER_API_KEY }} # empty = no Hermes drafts, jobs are still queued
    steps:
      - name: 2 PM in New York, or a manual run
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$((10#$hour))" = 14 ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "not 2 PM in New York (hour $hour): the other cron is today's"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Checks
        if: steps.gate.outputs.run == 'true'
        run: node --test tools/learn.test.mjs

      - name: Misses become jobs
        id: learn
        if: steps.gate.outputs.run == 'true'
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: |
          if [ -z "$VOID_OWNER_TOKEN" ]; then
            echo "::warning title=Void did not learn::Repo secret VOID_OWNER_TOKEN (the Pages READ_TOKEN) is not set."
            echo "queued=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if node tools/learn.mjs --json $DRY > learn.json; then
            node -e "
              const r = require('./learn.json');
              console.log('miss jobs open before this run: ' + r.open);
              for (const q of r.queued) console.log((q.dry ? 'would queue' : q.skipped ? 'already open' : 'queued ' + q.id) + ': ' + q.ask + '  [' + q.target + ']  ' + q.note);
              for (const a of r.later) console.log('later: ' + a);
              if (!r.queued.length && !r.later.length) console.log('nothing new to learn');
            " | tee -a "$GITHUB_STEP_SUMMARY"
            echo "queued=$(node -p "require('./learn.json').queued.filter((q) => q.id && !q.skipped).length")" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=The board was not read::the site was unreachable or the token was refused; it runs again tomorrow"
            echo "queued=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.learn.outputs.queued != '' && steps.learn.outputs.queued != '0' && env.HERMES_KEY != ''
        with:
          python-version: '3.12'

      - name: Hermes Agent drafts each new job
        if: steps.learn.outputs.queued != '' && steps.learn.outputs.queued != '0' && env.HERMES_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ env.HERMES_KEY }}
          HERMES_INFERENCE_MODEL: ${{ vars.HERMES_MODEL || 'openrouter/auto' }}
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          set -u
          python -m pip install --quiet hermes-agent || { echo "::warning title=Hermes not installed::pip could not install hermes-agent; the jobs are queued without drafts"; exit 0; }
          mkdir -p drafts/learned
          node -e "const r=require('./learn.json'); for (const q of r.queued) if (q.id && !q.skipped) console.log(q.id + '\t' + q.target.slice(5) + '\t' + q.ask.replace(/^learn to handle /, '') + '\t' + q.note)" > jobs.tsv
          while IFS=$'\t' read -r id slug ask note; do
            out="drafts/learned/$slug.md"
            [ -s "$out" ] && { echo "$out already drafted"; continue; }
            prompt="You are drafting a skill for Void, the blank website at a-to-mind.com that does anything anyone asks (read STANDING.md, section 'What A-to-Mind is', and list void-live-deploy/skills/ to see the skills it has). A visitor asked Void $ask and Void could not answer ($note). Write a build draft in plain markdown for the builder who takes this job: 1. What the visitor wants, in one paragraph. 2. Which existing skill file in void-live-deploy/skills/ should learn it, or the name of a new one. 3. Ten ways people would type this ask, as a JSON array in the shape of the entries in tools/bench.json. 4. What the card shows and does. 5. Tests to add (file and cases). 6. The smallest first piece that is visible on the site. No code. Output only the markdown, starting with a level-one heading that repeats the ask."
            if timeout 600 hermes -z "$prompt" > "$out.tmp" 2> "$out.err" && [ -s "$out.tmp" ]; then
              { echo "<!-- drafted by Hermes Agent ($HERMES_INFERENCE_MODEL) for queue job $id, $(date -u +%Y-%m-%dT%H:%MZ) -->"; cat "$out.tmp"; } > "$out"
              rm -f "$out.tmp" "$out.err"
              echo "drafted $out" | tee -a "$GITHUB_STEP_SUMMARY"
              node -e "
                fetch('https://a-to-mind.com/api/queue', { method: 'PATCH', headers: { authorization: 'Bearer ' + process.env.VOID_OWNER_TOKEN, 'content-type': 'application/json', 'user-agent': 'a2m-learn/1.0' },
                  body: JSON.stringify({ id: process.argv[1], note: process.argv[2].slice(0, 230) + '; draft: drafts/learned/' + process.argv[3] + '.md' }) }).then((r) => console.log('note updated: ' + r.status)).catch((e) => console.log('note not updated: ' + e.message))
              " "$id" "$note" "$slug"
            else
              echo "::warning title=Hermes could not draft $slug::$(head -c 300 "$out.err" 2>/dev/null)"; rm -f "$out.tmp" "$out.err"
            fi
          done < jobs.tsv
          git add drafts/learned
          git diff --cached --quiet && { echo "no drafts to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Void learns: Hermes drafts for the misses queued today"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
