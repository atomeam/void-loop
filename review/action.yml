# Void's code review for any GitHub repository: a walkthrough of what the pull request changes, the bugs and risks in
# the lines it adds (the same checks a-to-mind.com runs when someone asks Void to review code), and each one as an
# inline comment on its line with a one-click suggested fix where a safe one exists. No account, no credits.
#
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     review:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: atomeam/void-loop/review@main
#           with:
#             gate: 'true'                                 # optional: fail the check on bugs and risks (a merge gate)
#             void-key: ${{ secrets.VOID_REVIEW_KEY }}     # optional: Code Review Pro, the AI closer read on every PR
# Free: the instant checks (a whole PR in about a second). Void Code Review Pro (on its own, or in paid Void) adds the closer read:
# https://a-to-mind.com/code-review/
name: Void code review
description: Walkthrough, bugs and risks in the added lines, and inline comments with one-click fixes, on every pull request.
branding: { icon: eye, color: gray-dark }
inputs:
  github-token:
    description: Token that can comment on the pull request (pull-requests write)
    default: ${{ github.token }}
  inline:
    description: Also post each bug or risk as an inline comment on its line ("true" or "false")
    default: 'true'
  gate:
    description: 'Fail this step when the added lines carry a bug or a risk ("true" or "false"); a line marked "void-review: ok" is left out' 
    default: 'false'
  void-key:
    description: A Void Code Review Pro license key, or a key from paid Void (https://a-to-mind.com/code-review/#pro), for the AI closer read; leave empty for the free checks
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Void reviews the lines this pull request adds
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLS: ${{ github.action_path }}/../tools
        VOID_REVIEW_KEY: ${{ inputs.void-key }}
      run: |
        git fetch --no-tags origin "$BASE" >/dev/null 2>&1 || true
        deep=(); [ -n "$VOID_REVIEW_KEY" ] && deep=(--deep https://a-to-mind.com/api/review)
        node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" "${deep[@]}" > void-review.md || true
        cat void-review.md >> "$GITHUB_STEP_SUMMARY"
        body=$(jq -Rs '{body: .}' < void-review.md)
        id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- void-review -->"))][0].id // empty' | head -n1)
        if [ -n "$id" ]; then echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null
        else echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null; fi
        if [ "${{ inputs.inline }}" = "true" ]; then
          node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" --inline > void-inline.json
          node "$TOOLS/review-post.mjs" void-inline.json --repo "$REPO" --pr "$PR" --sha "$HEAD_SHA"
        fi
    - name: Gate on bugs and risks
      if: inputs.gate == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLS: ${{ github.action_path }}/../tools
      run: |
        node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" --gate > /dev/null || { echo "::error title=Void review::bugs or risks in the added lines (see Void's review comment)"; exit 1; }
