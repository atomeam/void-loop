# Verse's code review for any GitHub repository: a walkthrough of what the pull request changes, the bugs and risks in
# the lines it adds (the same checks a-to-mind.com runs when someone asks Verse to review code), and each one as an
# inline comment on its line with a one-click suggested fix where a safe one exists. No account, no credits.
#
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     review:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: atomeam/void-loop/review@main
#           with:
#             gate: 'true'                                 # optional: fail the check on bugs and risks (a merge gate)
#             void-key: ${{ secrets.VOID_REVIEW_KEY }}     # optional: Code Review Pro, the AI closer read on every PR
#             # or pay per review instead, no account: 0.05 USDC on Base per closer read over x402 (https://docs.x402.org),
#             # signed on this runner by a wallet you fund for it (keep only a little USDC in it); the key never leaves the runner
#             # x402-wallet-key: ${{ secrets.VERSE_X402_WALLET_KEY }}
#             # x402-max-usdc: '0.05'                         # the most one review may cost; a higher price is refused, unsigned
# Free: the instant checks (a whole PR in about a second). Verse Code Review Pro (on its own, or in paid Verse), or 0.05 USDC a review over
# x402 with no account, adds the closer read:
# https://a-to-mind.com/code-review/
name: Verse code review
description: Walkthrough, bugs and risks in the added lines, and inline comments with one-click fixes, on every pull request.
branding: { icon: eye, color: gray-dark }
inputs:
  github-token:
    description: Token that can comment on the pull request (pull-requests write)
    default: ${{ github.token }}
  inline:
    description: Also post each bug or risk as an inline comment on its line ("true" or "false")
    default: 'true'
  gate:
    description: 'Fail this step when the added lines carry a bug or a risk ("true" or "false"); a line marked "void-review: ok" is left out' 
    default: 'false'
  void-key:
    description: A Verse Code Review Pro license key, or a key from paid Verse (https://a-to-mind.com/code-review/#pro), for the AI closer read; leave empty for the free checks
    default: ''
  x402-wallet-key:
    description: 'Pay per review instead of a key: the private key of a Base wallet you fund with a little USDC (from your repository secrets). Each closer read costs 0.05 USDC over x402, signed on this runner; the key goes nowhere else. Leave empty for the free checks.'
    default: ''
  x402-max-usdc:
    description: The most one review may cost in USDC over x402; a higher price is refused and nothing is signed
    default: '0.05'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: The x402 payer, for pay-per-review only
      if: inputs.x402-wallet-key != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        TOOLS: ${{ github.action_path }}/../tools
      run: |
        mkdir -p "$RUNNER_TEMP/verse-x402" && cp "$TOOLS/x402-pay.mjs" "$RUNNER_TEMP/verse-x402/"
        cd "$RUNNER_TEMP/verse-x402" && npm init -y >/dev/null && npm i --no-audit --no-fund --silent viem@2.57.7
        echo "VOID_X402_PAY=$RUNNER_TEMP/verse-x402/x402-pay.mjs" >> "$GITHUB_ENV"
    - name: Verse reviews the lines this pull request adds
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLS: ${{ github.action_path }}/../tools
        VOID_REVIEW_KEY: ${{ inputs.void-key }}
        VOID_X402_KEY: ${{ inputs.x402-wallet-key }}
        VOID_X402_MAX: ${{ inputs.x402-max-usdc }}
      run: |
        git fetch --no-tags origin "$BASE" >/dev/null 2>&1 || true
        deep=(); [ -n "$VOID_REVIEW_KEY" ] && deep=(--deep https://a-to-mind.com/api/review)
        if [ -n "$VOID_X402_KEY" ] && [ -n "${VOID_X402_PAY:-}" ]; then echo "::add-mask::$VOID_X402_KEY"; deep=(--deep https://a-to-mind.com/api/x402/review); fi
        node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" "${deep[@]}" > void-review.md || true
        cat void-review.md >> "$GITHUB_STEP_SUMMARY"
        body=$(jq -Rs '{body: .}' < void-review.md)
        id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- void-review -->"))][0].id // empty' | head -n1)
        if [ -n "$id" ]; then echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null
        else echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null; fi
        if [ "${{ inputs.inline }}" = "true" ]; then
          VOID_X402_KEY= node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" --inline > void-inline.json
          node "$TOOLS/review-post.mjs" void-inline.json --repo "$REPO" --pr "$PR" --sha "$HEAD_SHA"
        fi
    - name: Gate on bugs and risks
      if: inputs.gate == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOLS: ${{ github.action_path }}/../tools
      run: |
        node "$TOOLS/review-pr.mjs" --base "origin/$BASE" --head "$HEAD_SHA" --gate > /dev/null || { echo "::error title=Verse review::bugs or risks in the added lines (see Verse's review comment)"; exit 1; }
