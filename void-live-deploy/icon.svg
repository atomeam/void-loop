<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- V01D's mark: the 0, a ring of light (the same ring the startup intro draws) -->
  <defs>
    <radialGradient id="g" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#16122e"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <ellipse cx="256" cy="256" rx="118" ry="156" fill="none" stroke="url(#r)" stroke-opacity=".75" stroke-width="22" filter="url(#b)"/>
  <ellipse cx="256" cy="256" rx="118" ry="156" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="7"/>
</svg>
