<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VAT and tax calculator · Verse</title>
  <meta name="description" content="VAT calculator, gross/net calculator, and tax estimates on this device. Nothing is sent anywhere.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Verse">
  <meta property="og:title" content="VAT and tax calculator · Verse">
  <meta property="og:description" content="Local VAT and tax math with Russian and English UI. Nothing leaves your device.">
  <meta property="og:url" content="https://a-to-mind.com/vat/">
  <meta property="og:image" content="https://a-to-mind.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: dark; --bg: #0b0a10; --ink: #ecebf5; --soft: #a3a0b3; --line: #2c2938; --accent: #a58bff; --bad: #ff8a7e; --ok: #64d19f; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 22px 16px 40px; }
    h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    label { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
    input, select, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px; box-sizing: border-box; }
    button { cursor: pointer; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .result { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: rgba(255,255,255,0.02); }
    .lang { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
    .note { color: var(--soft); font-size: 13px; }
    .rate-grid { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 6px; }
    .rate-grid button { min-width: 52px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  </style>
  <script src="/visit.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Калькулятор НДС и налогов</h1>

    <div class="lang">
      <button type="button" data-lang="ru" class="lang-btn">Русский</button>
      <button type="button" data-lang="en" class="lang-btn">English</button>
    </div>

    <div class="row">
      <div>
        <label id="amountLabel" for="amount">Сумма</label>
        <input id="amount" type="number" step="0.01" inputmode="decimal" value="1000" />
      </div>
      <div>
        <label id="rateLabel" for="rate">Ставка НДС</label>
        <input id="rate" type="number" step="0.01" inputmode="decimal" value="22" />
      </div>
    </div>

    <div class="row">
      <div>
        <label id="modeLabel" for="mode">Режим</label>
        <select id="mode">
          <option value="extract">Выделить НДС</option>
          <option value="add">Начислить НДС</option>
        </select>
      </div>
      <div>
        <label id="sumLabel" for="sumMode">Тип суммы</label>
        <select id="sumMode">
          <option value="gross">Сумма с НДС</option>
          <option value="net">Сумма без НДС</option>
        </select>
      </div>
    </div>

    <div class="rate-grid" id="rates"></div>

    <div class="result">
      <p id="summary" class="note">Рассчитано локально на этом устройстве.</p>
      <p id="vatValue">НДС: 0,00</p>
      <p id="baseValue">Основа: 0,00</p>
      <p id="grossValue">Итог: 0,00</p>
    </div>

    <p style="margin-top: 14px">
      <button class="primary" type="button" id="copyLink">Скопировать ссылку</button>
    </p>

    <nav id="related" aria-label="Related tools"><!-- related --></nav>
    <footer>На этом устройстве только. Никаких сетевых запросов, загрузок и серверной обработки.</footer>
  </main>

  <script type="module" src="/vat/app.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });</script>
</body>
</html>
