<title>Schedules · Verse</title>
<meta name="description" content="Turn a five-field schedule line into a sentence, and see the next times it would run. Named shortcuts such as @daily work too. It runs on this device.">
<link rel="stylesheet" href="/verse.css">

<meta property="og:image" content="https://a-to-mind.com/og.png">

<body>
<main>
  <h1>Schedules</h1>
  <p>Five fields: minute, hour, day of the month, month, day of the week. The page says that line in a sentence and lists the next three times it would run, in this device's clock. <code>@daily</code> and the other named shortcuts work too.</p>
  <form>
    <label for="line">Line</label>
    <input id="line" name="line" type="text" value="0 9 * * 1-5" spellcheck="false" autocomplete="off">
  </form>
  <p id="say" aria-live="polite"></p>
  <ul id="next"></ul>
  <p id="err" role="status"></p>
  <p>More: <a href="/patterns/">patterns</a>, <a href="/base64/">Base64</a>, <a href="/convert/">unit converter</a>.</p>
</main>
<script type="module" src="/schedules/app.js"></script>

</body>
