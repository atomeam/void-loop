<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared calendar · Verse</title>
<style>
  /* the embedded calendar (calendar/embed/embed.js): a read-only list of a calendar shared by its view link, made to sit in another site's page */
  :root { color-scheme: dark; --bg: #fff; --ink: #15131c; --soft: #5d5a6b; --line: #d9d6e4; --accent: #6d4aff; }
  :root { color-scheme: dark; --bg: #14121c; --ink: #ecebf5; --soft: #aaa7ba; --line: #2c2938; --accent: #a58bff; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { padding: 12px 14px 14px; }
  h1 { font-size: 17px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; } h1 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
  .sub { font-size: 12px; color: var(--soft); margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--soft); margin: 12px 0 2px; }
  ul { list-style: none; margin: 0; padding: 0; } li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); } li:first-child { border-top: 0; }
  .t { flex: none; min-width: 5.2em; color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; } .n { min-width: 0; overflow-wrap: anywhere; } .l { color: var(--soft); font-size: 12px; display: block; }
  .empty, .err { color: var(--soft); font-size: 14px; }
  footer { margin-top: 12px; font-size: 12px; } footer a { color: var(--accent); display: inline-block; padding: 4px 0; min-height: 24px; }
</style>
</head>
<body>
<main>
  <h1 id="title"><i></i><span id="name">Calendar</span></h1>
  <p class="sub" id="sub"></p>
  <div id="list" aria-live="polite"></div>
  <footer><a id="open" href="/calendar/" target="_blank" rel="noopener">Open in Verse</a></footer>
</main>
<script type="module" src="/calendar/embed/embed.js"></script>
</body>
</html>
