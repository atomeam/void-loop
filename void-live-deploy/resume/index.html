<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume, Cover Letter &amp; Email Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #0284c7;
      --paper: #ffffff;
      --ink: #0f172a;
      --ink-muted: #475569;
      --ink-border: #cbd5e1;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header.topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #082f49;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--accent-2);
      color: #ffffff;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s ease;
    }
    .btn:hover { border-color: var(--accent); color: #ffffff; }
    .btn-primary {
      background: var(--accent-2);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger {
      background: transparent;
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 5px 9px;
      font-size: 0.78rem;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); }
    .hidden { display: none !important; }

    main.workspace {
      display: grid;
      grid-template-columns: minmax(340px, 460px) 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1520px;
      margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 980px) {
      main.workspace { grid-template-columns: 1fr; }
    }
    .editor-pane {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      max-height: calc(100vh - 104px);
      overflow-y: auto;
    }
    @media (max-width: 980px) {
      .editor-pane { max-height: none; }
    }
    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title:first-child { margin-top: 0; }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px) {
      .field-grid { grid-template-columns: 1fr; }
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.88rem;
    }
    .field textarea {
      min-height: 76px;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .card-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
    }

    .preview-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .paper {
      width: 100%;
      max-width: 820px;
      min-height: 1040px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      padding: 48px 54px;
      font-family: "Georgia", "Times New Roman", serif;
    }
    .paper.sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    .r-header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .r-name {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 2px;
      letter-spacing: -0.02em;
    }
    .r-role {
      font-size: 1.05rem;
      color: var(--ink-muted);
      margin: 0 0 8px;
      font-weight: 500;
    }
    .r-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 0.88rem;
      color: var(--ink-muted);
    }
    .r-sec { margin-bottom: 18px; }
    .r-sec h2 {
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink);
      border-bottom: 1px solid var(--ink-border);
      padding-bottom: 4px;
      margin: 0 0 10px;
    }
    .r-item { margin-bottom: 12px; }
    .r-item-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-weight: 700;
      font-size: 0.98rem;
    }
    .r-item-sub {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--ink-muted);
      font-style: italic;
      margin-bottom: 4px;
    }
    .r-bullets {
      margin: 4px 0 0 18px;
      padding: 0;
      font-size: 0.93rem;
    }
    .r-bullets li { margin-bottom: 3px; }
    .r-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .r-skill-tag {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.84rem;
    }
    .letter-meta { margin-bottom: 22px; font-size: 0.95rem; }
    .letter-body p { margin: 0 0 14px; font-size: 0.98rem; line-height: 1.65; }
    .email-headers {
      background: #f8fafc;
      border: 1px solid var(--ink-border);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 22px;
      font-size: 0.9rem;
    }
    .email-headers div { margin-bottom: 4px; }
    .email-headers strong { display: inline-block; width: 74px; color: var(--ink-muted); }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #052e16;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.2s ease;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media print {
      body { background: #ffffff; color: #000000; }
      header.topbar, .editor-pane, .toast { display: none !important; }
      main.workspace { display: block; padding: 0; max-width: none; }
      .paper {
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        max-width: none;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">Studio</span>
      <span>Resume, Cover Letter &amp; Email</span>
    </div>
    <nav class="tabs" aria-label="Document Type">
      <button class="tab-btn active" data-tab="resume" type="button">Resume</button>
      <button class="tab-btn" data-tab="cover" type="button">Cover Letter</button>
      <button class="tab-btn" data-tab="email" type="button">Professional Email</button>
    </nav>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copy Text</button>
      <button class="btn" id="txtBtn" type="button">Download .txt</button>
      <button class="btn hidden" id="emlBtn" type="button">Download .eml</button>
      <button class="btn btn-primary" id="printBtn" type="button">Print / Save PDF</button>
      <button class="btn" id="resetBtn" type="button" title="Restore sample content">Reset</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor-pane" aria-label="Document Editor">
      <div id="panel-resume" class="tab-panel">
        <div class="section-title">
          <span>Contact &amp; Header</span>
          <select id="r-font" aria-label="Typography style" style="width:auto;padding:4px 8px;font-size:0.78rem;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:6px;">
            <option value="sans">Modern Sans</option>
            <option value="serif">Classic Serif</option>
          </select>
        </div>
        <div class="field-grid">
          <div class="field"><label for="r-name">Full Name</label><input id="r-name" type="text" placeholder="e.g. Jordan Taylor"></div>
          <div class="field"><label for="r-role">Target Title</label><input id="r-role" type="text" placeholder="e.g. Senior Product Engineer"></div>
          <div class="field"><label for="r-email">Email</label><input id="r-email" type="email" placeholder="e.g. jordan@example.com"></div>
          <div class="field"><label for="r-phone">Phone</label><input id="r-phone" type="text" placeholder="e.g. (415) 555-0192"></div>
          <div class="field"><label for="r-location">Location</label><input id="r-location" type="text" placeholder="e.g. San Francisco, CA"></div>
          <div class="field"><label for="r-link">Portfolio / LinkedIn</label><input id="r-link" type="text" placeholder="e.g. linkedin.com/in/jordantaylor"></div>
        </div>
        <div class="field">
          <label for="r-summary">Professional Summary</label>
          <textarea id="r-summary" placeholder="Concise overview of impact and core strengths"></textarea>
        </div>

        <div class="section-title">
          <span>Experience</span>
          <button class="btn" id="add-exp" type="button" style="padding:4px 9px;font-size:0.78rem;">+ Add Role</button>
        </div>
        <div id="exp-list"></div>

        <div class="section-title">
          <span>Education</span>
          <button class="btn" id="add-edu" type="button" style="padding:4px 9px;font-size:0.78rem;">+ Add Education</button>
        </div>
        <div id="edu-list"></div>

        <div class="section-title"><span>Skills</span></div>
        <div class="field">
          <label for="r-skills">Comma-separated skills</label>
          <textarea id="r-skills" placeholder="e.g. TypeScript, React, Node.js, PostgreSQL, System Design"></textarea>
        </div>
      </div>

      <div id="panel-cover" class="tab-panel hidden">
        <div class="section-title"><span>Sender &amp; Date</span></div>
        <div class="field-grid">
          <div class="field"><label for="c-name">Your Name</label><input id="c-name" type="text"></div>
          <div class="field"><label for="c-role">Your Title</label><input id="c-role" type="text"></div>
          <div class="field"><label for="c-email">Email</label><input id="c-email" type="email"></div>
          <div class="field"><label for="c-phone">Phone</label><input id="c-phone" type="text"></div>
          <div class="field"><label for="c-location">Location</label><input id="c-location" type="text"></div>
          <div class="field"><label for="c-date">Date</label><input id="c-date" type="text"></div>
        </div>
        <div class="section-title"><span>Recipient &amp; Role</span></div>
        <div class="field-grid">
          <div class="field"><label for="c-rec-name">Hiring Manager</label><input id="c-rec-name" type="text"></div>
          <div class="field"><label for="c-rec-title">Manager Title</label><input id="c-rec-title" type="text"></div>
          <div class="field"><label for="c-company">Company</label><input id="c-company" type="text"></div>
          <div class="field"><label for="c-target-role">Target Position</label><input id="c-target-role" type="text"></div>
        </div>
        <div class="section-title"><span>Letter Content</span></div>
        <div class="field"><label for="c-salutation">Salutation</label><input id="c-salutation" type="text"></div>
        <div class="field"><label for="c-opening">Opening Paragraph</label><textarea id="c-opening"></textarea></div>
        <div class="field"><label for="c-body">Body Paragraph</label><textarea id="c-body" style="min-height:110px;"></textarea></div>
        <div class="field"><label for="c-closing">Closing Paragraph</label><textarea id="c-closing"></textarea></div>
        <div class="field"><label for="c-signoff">Sign-off</label><input id="c-signoff" type="text"></div>
      </div>

      <div id="panel-email" class="tab-panel hidden">
        <div class="section-title"><span>Email Preset</span></div>
        <div class="field">
          <label for="e-preset">Quick Template</label>
          <select id="e-preset">
            <option value="followup">Application Follow-Up</option>
            <option value="thankyou">Post-Interview Thank You</option>
            <option value="outreach">Direct Hiring Outreach</option>
            <option value="accept">Offer Acceptance</option>
          </select>
        </div>
        <div class="section-title"><span>Headers</span></div>
        <div class="field-grid">
          <div class="field"><label for="e-from-name">From Name</label><input id="e-from-name" type="text"></div>
          <div class="field"><label for="e-from-email">From Email</label><input id="e-from-email" type="email"></div>
          <div class="field"><label for="e-to-name">To Name</label><input id="e-to-name" type="text"></div>
          <div class="field"><label for="e-to-email">To Email</label><input id="e-to-email" type="email"></div>
        </div>
        <div class="field"><label for="e-subject">Subject</label><input id="e-subject" type="text"></div>
        <div class="section-title"><span>Message Body</span></div>
        <div class="field"><label for="e-greeting">Greeting</label><input id="e-greeting" type="text"></div>
        <div class="field"><label for="e-body">Body</label><textarea id="e-body" style="min-height:160px;"></textarea></div>
        <div class="field-grid">
          <div class="field"><label for="e-signoff">Sign-off</label><input id="e-signoff" type="text"></div>
          <div class="field"><label for="e-sig-phone">Signature Phone / Link</label><input id="e-sig-phone" type="text"></div>
        </div>
      </div>
    </section>

    <section class="preview-pane" aria-label="Live Document Preview">
      <article id="preview" class="paper sans"></article>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const STORAGE_KEY = "void_resume_studio_v1";
      const VALID_TABS = ["resume", "cover", "email"];

      const DEFAULT_STATE = {
        font: "sans",
        resume: {
          name: "Jordan Taylor",
          role: "Senior Product Engineer",
          email: "jordan.taylor@example.com",
          phone: "(415) 555-0192",
          location: "San Francisco, CA",
          link: "linkedin.com/in/jordantaylor",
          summary: "Full-stack product engineer with 8+ years of experience shipping high-reliability web applications, design systems, and data-intensive workflows. Focused on clean architecture, measurable latency reductions, and cross-functional execution.",
          experience: [
            {
              company: "Northstar Cloud",
              title: "Senior Software Engineer",
              dates: "2022 - Present",
              location: "San Francisco, CA",
              bullets: "Led frontend platform migration to TypeScript and modular web components, cutting bundle size by 38%.\nDesigned real-time deployment telemetry pipeline handling 45,000 events per minute with sub-200ms p95 latency.\nMentored 5 engineers through biweekly architecture reviews and pairing sessions."
            },
            {
              company: "Harbor Labs",
              title: "Software Engineer",
              dates: "2019 - 2022",
              location: "Seattle, WA",
              bullets: "Built self-serve billing and usage analytics dashboard used by 12,000+ B2B customers.\nAutomated end-to-end release checks, reducing production regressions by 42% year-over-year."
            }
          ],
          education: [
            {
              school: "University of Washington",
              degree: "B.S. in Computer Science",
              dates: "2015 - 2019",
              location: "Seattle, WA"
            }
          ],
          skills: "TypeScript, JavaScript, React, Node.js, PostgreSQL, GraphQL, CSS Grid, Accessibility, CI/CD, System Design"
        },
        cover: {
          name: "Jordan Taylor",
          role: "Senior Product Engineer",
          email: "jordan.taylor@example.com",
          phone: "(415) 555-0192",
          location: "San Francisco, CA",
          date: "November 20, 2026",
          recName: "Alex Rivera",
          recTitle: "VP of Engineering",
          company: "Meridian Systems",
          targetRole: "Staff Product Engineer",
          salutation: "Dear Alex Rivera,",
          opening: "I am writing to express my strong interest in the Staff Product Engineer role at Meridian Systems. Over the past eight years building developer-facing platforms and high-throughput web applications, I have admired Meridian's commitment to fast, resilient tooling.",
          body: "In my current role at Northstar Cloud, I led the migration of our core console to a modular TypeScript architecture, reducing bundle size by 38% while improving Core Web Vitals across enterprise accounts. Previously at Harbor Labs, I partnered closely with product and design to launch usage-based billing and analytics workflows serving more than 12,000 teams.",
          closing: "I would welcome the opportunity to discuss how my background in frontend architecture, reliability engineering, and technical mentorship can support Meridian Systems' roadmap. Thank you for your time and consideration.",
          signoff: "Sincerely,"
        },
        email: {
          preset: "followup",
          fromName: "Jordan Taylor",
          fromEmail: "jordan.taylor@example.com",
          toName: "Alex Rivera",
          toEmail: "alex.rivera@meridiansystems.example",
          subject: "Following Up: Staff Product Engineer Application - Jordan Taylor",
          greeting: "Hi Alex,",
          body: "I hope your week is going well. I recently submitted my application for the Staff Product Engineer position at Meridian Systems and wanted to share a brief note reiterating my enthusiasm for the team.\n\nAt Northstar Cloud, I recently led a platform modernization effort that reduced bundle size by 38% and scaled real-time telemetry to 45,000 events per minute. I would be thrilled to bring that same focus on speed and craft to Meridian.\n\nPlease let me know if there is any additional information I can provide.",
          signoff: "Best regards,",
          sigPhone: "(415) 555-0192 | linkedin.com/in/jordantaylor"
        }
      };

      const EMAIL_PRESETS = {
        followup: {
          subject: "Following Up: Staff Product Engineer Application - Jordan Taylor",
          greeting: "Hi Alex,",
          body: "I hope your week is going well. I recently submitted my application for the Staff Product Engineer position at Meridian Systems and wanted to share a brief note reiterating my enthusiasm for the team.\n\nAt Northstar Cloud, I recently led a platform modernization effort that reduced bundle size by 38% and scaled real-time telemetry to 45,000 events per minute. I would be thrilled to bring that same focus on speed and craft to Meridian.\n\nPlease let me know if there is any additional information I can provide."
        },
        thankyou: {
          subject: "Thank You - Staff Product Engineer Interview",
          greeting: "Hi Alex,",
          body: "Thank you for taking the time to speak with me today about the Staff Product Engineer role at Meridian Systems. I especially enjoyed discussing your upcoming architecture roadmap and how the team balances iteration speed with reliability.\n\nOur conversation reinforced my excitement about contributing to Meridian's core platform. Please feel free to reach out if any follow-up questions come up."
        },
        outreach: {
          subject: "Product Engineer Interested in Meridian Systems",
          greeting: "Hi Alex,",
          body: "I have been following Meridian Systems' recent product releases and wanted to reach out directly. I am a Senior Product Engineer with 8+ years of experience building TypeScript web platforms and real-time developer dashboards.\n\nI would appreciate 15 minutes to learn more about your engineering priorities for the coming quarter and see if my background could be helpful to your team."
        },
        accept: {
          subject: "Offer Acceptance - Staff Product Engineer",
          greeting: "Hi Alex,",
          body: "Thank you for extending the offer to join Meridian Systems as a Staff Product Engineer. I am thrilled to accept the position and look forward to starting on the agreed date.\n\nPlease let me know the next steps for onboarding paperwork. I cannot wait to get started with the team."
        }
      };

      let state = loadState();
      let activeTab = getInitialTab();

      function safeGetStorage(key) { try { return window.localStorage.getItem(key); } catch (err) { console.warn("localStorage.getItem failed:", err); return null; } }
      function safeSetStorage(key, value) { try { window.localStorage.setItem(key, value); } catch (err) { console.warn("localStorage.setItem failed:", err); } }
      function loadState() {
        try {
          const raw = safeGetStorage(STORAGE_KEY);
          if (!raw) return structuredClone(DEFAULT_STATE);
          const parsed = JSON.parse(raw);
          return {
            font: parsed.font || "sans",
            resume: { ...DEFAULT_STATE.resume, ...(parsed.resume || {}) },
            cover: { ...DEFAULT_STATE.cover, ...(parsed.cover || {}) },
            email: { ...DEFAULT_STATE.email, ...(parsed.email || {}) }
          };
        } catch (err) { console.warn("Failed to parse saved state:", err);
          return structuredClone(DEFAULT_STATE);
        }
      }

      function saveState() {
        try { safeSetStorage(STORAGE_KEY, JSON.stringify(state)); } catch (err) { console.warn("Failed to serialize state:", err); }
      }

      function getInitialTab() {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab");
        return VALID_TABS.includes(tab) ? tab : "resume";
      }

      function setTab(tab) {
        if (!VALID_TABS.includes(tab)) tab = "resume";
        activeTab = tab;
        const url = new URL(window.location.href);
        url.searchParams.set("tab", tab);
        history.replaceState(null, "", url.toString());

        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.tab === tab);
        });
        VALID_TABS.forEach((t) => {
          document.getElementById("panel-" + t).classList.toggle("hidden", t !== tab);
        });
        document.getElementById("emlBtn").classList.toggle("hidden", tab !== "email");
        renderPreview();
      }

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderExpList() {
        const list = document.getElementById("exp-list");
        list.innerHTML = "";
        state.resume.experience.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "card-item";
          card.innerHTML = `
            <div class="card-header">
              <span>Role ${idx + 1}</span>
              <button class="btn btn-danger" type="button" data-remove-exp="${idx}">Remove</button>
            </div>
            <div class="field-grid">
              <div class="field"><label>Company</label><input data-exp="${idx}" data-key="company" value="${esc(item.company)}"></div>
              <div class="field"><label>Job Title</label><input data-exp="${idx}" data-key="title" value="${esc(item.title)}"></div>
              <div class="field"><label>Dates</label><input data-exp="${idx}" data-key="dates" value="${esc(item.dates)}"></div>
              <div class="field"><label>Location</label><input data-exp="${idx}" data-key="location" value="${esc(item.location)}"></div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label>Highlights (one per line)</label>
              <textarea data-exp="${idx}" data-key="bullets">${esc(item.bullets)}</textarea>
            </div>
          `;
          list.appendChild(card);
        });
      }

      function renderEduList() {
        const list = document.getElementById("edu-list");
        list.innerHTML = "";
        state.resume.education.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "card-item";
          card.innerHTML = `
            <div class="card-header">
              <span>Education ${idx + 1}</span>
              <button class="btn btn-danger" type="button" data-remove-edu="${idx}">Remove</button>
            </div>
            <div class="field-grid">
              <div class="field"><label>School</label><input data-edu="${idx}" data-key="school" value="${esc(item.school)}"></div>
              <div class="field"><label>Degree</label><input data-edu="${idx}" data-key="degree" value="${esc(item.degree)}"></div>
              <div class="field"><label>Dates</label><input data-edu="${idx}" data-key="dates" value="${esc(item.dates)}"></div>
              <div class="field" style="margin-bottom:0;"><label>Location</label><input data-edu="${idx}" data-key="location" value="${esc(item.location)}"></div>
            </div>
          `;
          list.appendChild(card);
        });
      }

      function bindInputs() {
        const map = {
          "r-name": ["resume", "name"],
          "r-role": ["resume", "role"],
          "r-email": ["resume", "email"],
          "r-phone": ["resume", "phone"],
          "r-location": ["resume", "location"],
          "r-link": ["resume", "link"],
          "r-summary": ["resume", "summary"],
          "r-skills": ["resume", "skills"],
          "c-name": ["cover", "name"],
          "c-role": ["cover", "role"],
          "c-email": ["cover", "email"],
          "c-phone": ["cover", "phone"],
          "c-location": ["cover", "location"],
          "c-date": ["cover", "date"],
          "c-rec-name": ["cover", "recName"],
          "c-rec-title": ["cover", "recTitle"],
          "c-company": ["cover", "company"],
          "c-target-role": ["cover", "targetRole"],
          "c-salutation": ["cover", "salutation"],
          "c-opening": ["cover", "opening"],
          "c-body": ["cover", "body"],
          "c-closing": ["cover", "closing"],
          "c-signoff": ["cover", "signoff"],
          "e-from-name": ["email", "fromName"],
          "e-from-email": ["email", "fromEmail"],
          "e-to-name": ["email", "toName"],
          "e-to-email": ["email", "toEmail"],
          "e-subject": ["email", "subject"],
          "e-greeting": ["email", "greeting"],
          "e-body": ["email", "body"],
          "e-signoff": ["email", "signoff"],
          "e-sig-phone": ["email", "sigPhone"]
        };

        Object.entries(map).forEach(([id, [section, key]]) => {
          const el = document.getElementById(id);
          el.value = state[section][key] || "";
          el.oninput = () => {
            state[section][key] = el.value;
            saveState();
            renderPreview();
          };
        });

        const fontSel = document.getElementById("r-font");
        fontSel.value = state.font;
        fontSel.onchange = () => {
          state.font = fontSel.value;
          saveState();
          renderPreview();
        };

        const presetSel = document.getElementById("e-preset");
        presetSel.value = state.email.preset || "followup";
        presetSel.onchange = () => {
          const p = EMAIL_PRESETS[presetSel.value];
          if (p) {
            state.email.preset = presetSel.value;
            state.email.subject = p.subject;
            state.email.greeting = p.greeting;
            state.email.body = p.body;
            document.getElementById("e-subject").value = p.subject;
            document.getElementById("e-greeting").value = p.greeting;
            document.getElementById("e-body").value = p.body;
            saveState();
            renderPreview();
          }
        };
      }

      function renderPreview() {
        const preview = document.getElementById("preview");
        preview.className = "paper " + (state.font === "serif" ? "" : "sans");

        if (activeTab === "resume") {
          const r = state.resume;
          const contacts = [r.email, r.phone, r.location, r.link].filter(Boolean);
          const skills = (r.skills || "").split(",").map((s) => s.trim()).filter(Boolean);
          preview.innerHTML = `
            <div class="r-header">
              <h1 class="r-name">${esc(r.name)}</h1>
              ${r.role ? `<div class="r-role">${esc(r.role)}</div>` : ""}
              <div class="r-contact">${contacts.map((c) => `<span>${esc(c)}</span>`).join("")}</div>
            </div>
            ${r.summary ? `<div class="r-sec"><h2>Summary</h2><p style="margin:0;font-size:0.95rem;">${esc(r.summary)}</p></div>` : ""}
            ${r.experience.length ? `
              <div class="r-sec">
                <h2>Experience</h2>
                ${r.experience.map((exp) => {
                  const bullets = (exp.bullets || "").split(/\r?\n/).map((b) => b.trim()).filter(Boolean);
                  return `
                    <div class="r-item">
                      <div class="r-item-top"><span>${esc(exp.title)}</span><span>${esc(exp.dates)}</span></div>
                      <div class="r-item-sub"><span>${esc(exp.company)}</span><span>${esc(exp.location)}</span></div>
                      ${bullets.length ? `<ul class="r-bullets">${bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
                    </div>
                  `;
                }).join("")}
              </div>
            ` : ""}
            ${r.education.length ? `
              <div class="r-sec">
                <h2>Education</h2>
                ${r.education.map((edu) => `
                  <div class="r-item">
                    <div class="r-item-top"><span>${esc(edu.school)}</span><span>${esc(edu.dates)}</span></div>
                    <div class="r-item-sub"><span>${esc(edu.degree)}</span><span>${esc(edu.location)}</span></div>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            ${skills.length ? `
              <div class="r-sec">
                <h2>Skills</h2>
                <div class="r-skills">${skills.map((s) => `<span class="r-skill-tag">${esc(s)}</span>`).join("")}</div>
              </div>
            ` : ""}
          `;
        } else if (activeTab === "cover") {
          const c = state.cover;
          const contacts = [c.email, c.phone, c.location].filter(Boolean);
          preview.innerHTML = `
            <div class="r-header">
              <h1 class="r-name">${esc(c.name)}</h1>
              ${c.role ? `<div class="r-role">${esc(c.role)}</div>` : ""}
              <div class="r-contact">${contacts.map((x) => `<span>${esc(x)}</span>`).join("")}</div>
            </div>
            <div class="letter-meta">
              ${c.date ? `<div style="margin-bottom:14px;">${esc(c.date)}</div>` : ""}
              ${c.recName ? `<div><strong>${esc(c.recName)}</strong></div>` : ""}
              ${c.recTitle ? `<div>${esc(c.recTitle)}</div>` : ""}
              ${c.company ? `<div>${esc(c.company)}</div>` : ""}
              ${c.targetRole ? `<div style="margin-top:8px;color:#475569;">Re: ${esc(c.targetRole)}</div>` : ""}
            </div>
            <div class="letter-body">
              ${c.salutation ? `<p>${esc(c.salutation)}</p>` : ""}
              ${c.opening ? `<p>${esc(c.opening)}</p>` : ""}
              ${c.body ? `<p>${esc(c.body)}</p>` : ""}
              ${c.closing ? `<p>${esc(c.closing)}</p>` : ""}
              <p style="margin-top:24px;">${esc(c.signoff)}<br><strong>${esc(c.name)}</strong></p>
            </div>
          `;
        } else {
          const e = state.email;
          const paragraphs = (e.body || "").split(/\r?\n\r?\n/).filter((p) => p.trim());
          preview.innerHTML = `
            <div class="email-headers">
              <div><strong>From:</strong> ${esc(e.fromName)} &lt;${esc(e.fromEmail)}&gt;</div>
              <div><strong>To:</strong> ${esc(e.toName)} &lt;${esc(e.toEmail)}&gt;</div>
              <div><strong>Subject:</strong> ${esc(e.subject)}</div>
            </div>
            <div class="letter-body">
              ${e.greeting ? `<p>${esc(e.greeting)}</p>` : ""}
              ${paragraphs.map((p) => `<p>${esc(p).replace(/\r?\n/g, "<br>")}</p>`).join("")}
              <p style="margin-top:24px;">
                ${esc(e.signoff)}<br>
                <strong>${esc(e.fromName)}</strong><br>
                <span style="color:#475569;font-size:0.9rem;">${esc(e.sigPhone)}</span>
              </p>
            </div>
          `;
        }
      }

      function buildPlainText() {
        if (activeTab === "resume") {
          const r = state.resume;
          const lines = [
            r.name,
            r.role,
            [r.email, r.phone, r.location, r.link].filter(Boolean).join(" | "),
            ""
          ];
          if (r.summary) {
            lines.push("SUMMARY", r.summary, "");
          }
          if (r.experience.length) {
            lines.push("EXPERIENCE");
            r.experience.forEach((exp) => {
              lines.push(`${exp.title} - ${exp.company} (${exp.dates}, ${exp.location})`);
              (exp.bullets || "").split(/\r?\n/).map((b) => b.trim()).filter(Boolean).forEach((b) => {
                lines.push("  - " + b);
              });
              lines.push("");
            });
          }
          if (r.education.length) {
            lines.push("EDUCATION");
            r.education.forEach((edu) => {
              lines.push(`${edu.school} - ${edu.degree} (${edu.dates}, ${edu.location})`);
            });
            lines.push("");
          }
          if (r.skills) {
            lines.push("SKILLS", r.skills);
          }
          return lines.filter((l, i, arr) => l !== "" || arr[i - 1] !== "").join("\n");
        }
        if (activeTab === "cover") {
          const c = state.cover;
          return [
            c.name,
            [c.email, c.phone, c.location].filter(Boolean).join(" | "),
            "",
            c.date,
            "",
            c.recName,
            c.recTitle,
            c.company,
            c.targetRole ? `Re: ${c.targetRole}` : "",
            "",
            c.salutation,
            "",
            c.opening,
            "",
            c.body,
            "",
            c.closing,
            "",
            c.signoff,
            c.name
          ].filter((x) => x !== undefined).join("\n");
        }
        const e = state.email;
        return [
          `From: ${e.fromName} <${e.fromEmail}>`,
          `To: ${e.toName} <${e.toEmail}>`,
          `Subject: ${e.subject}`,
          "",
          e.greeting,
          "",
          e.body,
          "",
          e.signoff,
          e.fromName,
          e.sigPhone
        ].join("\n");
      }

      function buildEml() {
        const e = state.email;
        const bodyText = [
          e.greeting,
          "",
          e.body,
          "",
          e.signoff,
          e.fromName,
          e.sigPhone
        ].join("\r\n");
        return [
          `From: "${e.fromName}" <${e.fromEmail}>`,
          `To: "${e.toName}" <${e.toEmail}>`,
          `Subject: ${e.subject}`,
          `Date: ${new Date().toUTCString()}`,
          "MIME-Version: 1.0",
          "Content-Type: text/plain; charset=UTF-8",
          "Content-Transfer-Encoding: 8bit",
          "",
          bodyText
        ].join("\r\n");
      }

      function downloadFile(filename, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => setTab(btn.dataset.tab));
      });

      document.getElementById("exp-list").addEventListener("input", (ev) => {
        const t = ev.target;
        if (t.dataset.exp !== undefined) {
          state.resume.experience[Number(t.dataset.exp)][t.dataset.key] = t.value;
          saveState();
          renderPreview();
        }
      });

      document.getElementById("exp-list").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-remove-exp]");
        if (!btn) return;
        state.resume.experience.splice(Number(btn.dataset.removeExp), 1);
        saveState();
        renderExpList();
        renderPreview();
      });

      document.getElementById("add-exp").addEventListener("click", () => {
        state.resume.experience.push({
          company: "New Company",
          title: "Software Engineer",
          dates: "2024 - Present",
          location: "Remote",
          bullets: "Delivered key product improvements and measurable performance gains."
        });
        saveState();
        renderExpList();
        renderPreview();
      });

      document.getElementById("edu-list").addEventListener("input", (ev) => {
        const t = ev.target;
        if (t.dataset.edu !== undefined) {
          state.resume.education[Number(t.dataset.edu)][t.dataset.key] = t.value;
          saveState();
          renderPreview();
        }
      });

      document.getElementById("edu-list").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-remove-edu]");
        if (!btn) return;
        state.resume.education.splice(Number(btn.dataset.removeEdu), 1);
        saveState();
        renderEduList();
        renderPreview();
      });

      document.getElementById("add-edu").addEventListener("click", () => {
        state.resume.education.push({
          school: "State University",
          degree: "B.S. in Computer Science",
          dates: "2020 - 2024",
          location: "Boston, MA"
        });
        saveState();
        renderEduList();
        renderPreview();
      });

      document.getElementById("copyBtn").addEventListener("click", async () => {
        const text = buildPlainText();
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        showToast("Copied to clipboard");
      });

      document.getElementById("txtBtn").addEventListener("click", () => {
        const names = { resume: "resume.txt", cover: "cover-letter.txt", email: "email.txt" };
        downloadFile(names[activeTab], buildPlainText(), "text/plain;charset=utf-8");
        showToast("Downloaded " + names[activeTab]);
      });

      document.getElementById("emlBtn").addEventListener("click", () => {
        downloadFile("message.eml", buildEml(), "message/rfc822;charset=utf-8");
        showToast("Downloaded message.eml");
      });

      document.getElementById("printBtn").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        state = structuredClone(DEFAULT_STATE);
        saveState();
        renderExpList();
        renderEduList();
        bindInputs();
        renderPreview();
        showToast("Restored sample content");
      });

      renderExpList();
      renderEduList();
      bindInputs();
      setTab(activeTab);
    })();
  </script>
</body>
</html>
