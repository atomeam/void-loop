<style>
:root { --bg: #0a0614; --fg: #e0d0ff; --accent: #a7f; --hue: 280; }
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: hsl(var(--hue), 30%, 5%);
  color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.portals { position: absolute; inset: 0; pointer-events: none; }
.portal {
  position: absolute; width: 72px; height: 48px;
  background: hsla(var(--hue), 50%, 18%, 0.9);
  border: 1.5px solid hsl(var(--hue), 80%, 60%);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; pointer-events: auto; cursor: pointer;
  transform: translate(-50%, -50%);
  transition: filter 0.15s, opacity 0.2s;
  user-select: none;
}
.portal.active { filter: brightness(1.4) drop-shadow(0 0 8px #a7f); }
.ui { position: absolute; z-index: 20; padding: 10px; }
button, .status {
  background: rgba(10,6,20,0.9); color: var(--fg); border: 1px solid #446;
  border-radius: 6px; padding: 7px 11px; margin: 3px; font-size: 13px;
}
button:hover { border-color: var(--accent); }
.status { font-size: 11px; opacity: 0.85; max-width: 360px; }
</style>
