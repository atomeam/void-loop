  .orb.winner { box-shadow: 0 0 24px gold; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 10; max-width: 320px; }
