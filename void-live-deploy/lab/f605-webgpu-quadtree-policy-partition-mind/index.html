<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root { --depth: 0; --entropy: 0.5; --accent: hsl(200, 70%, 55%); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0c10; color: #e8eef6; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#portals { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.portal {
  position: absolute; pointer-events: auto; border: 1px solid var(--accent);
  background: hsla(200, 40%, 20%, 0.35); backdrop-filter: blur(4px);
  border-radius: 6px; padding: 8px; font-size: 12px; cursor: grab;
  transition: transform 0.15s ease, background 0.3s;
  display: flex; flex-direction: column; justify-content: space-between;
  min-width: 60px; min-height: 40px; overflow: hidden;
}
.portal:active { cursor: grabbing; }
.portal .val { font-weight: 600; color: #fff; }
.portal .meta { opacity: 0.7; font-size: 10px; }
#chrome {
  position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(10,12,16,0.7);
  padding: 12px 16px; border-radius: 10px; border: 1px solid #2a3a4a; backdrop-filter: blur(8px);
  max-width: 280px;
}
#chrome h1 { font-size: 14px; margin-bottom: 6px; }
#chrome button { margin: 4px 4px 0 0; padding: 4px 10px; background: #1a2a3a; color: #cde; border: 1px solid #3a5a7a; border-radius: 4px; cursor: pointer; }
#chrome button:hover { background: #2a3a4a; }
#status { font-size: 11px; opacity: 0.8; margin-top: 6px; }
body { filter: hue-rotate(calc(var(--entropy) * 40deg)); }
</style>
