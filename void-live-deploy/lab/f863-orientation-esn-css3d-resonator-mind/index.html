<style>
:root { --hue: 200; --activity: 0.3; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: hsl(var(--hue), 40%, 8%);
  color: #eee;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  perspective: 800px;
  perspective-origin: 50% 50%;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
}
.resonator {
  position: absolute;
  width: 72px;
  height: 72px;
  border-radius: 18px;
  background: hsla(var(--h), 70%, 55%, 0.75);
  border: 2px solid hsla(var(--h), 90%, 70%, 0.9);
  box-shadow: 0 0 20px hsla(var(--h), 80%, 60%, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transform-style: preserve-3d;
  transition: background 0.2s, box-shadow 0.2s;
  will-change: transform;
}
.resonator:hover { filter: brightness(1.2); }
#ui {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 100;
  background: rgba(0,0,0,0.6);
  padding: 10px 14px;
  border-radius: 12px;
  backdrop-filter: blur(8px);
  font-size: 13px;
  max-width: 280px;
}
button {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  padding: 6px 12px;
  border-radius: 8px;
  margin: 4px 4px 0 0;
  cursor: pointer;
}
button:hover { background: #444; }
#status { margin-top: 6px; opacity: 0.8; font-size: 12px; }
</style>
