<style>
  :root { --hue: 210; --sat: 50%; --lit: 8%; --glow: 0; }
  body { margin: 0; background: hsl(var(--hue), var(--sat), var(--lit)); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #ui { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.6); padding: 10px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; backdrop-filter: blur(4px); }
  .orb { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: hsla(var(--oh), 80%, 55%, .7); border: 2px solid rgba(255,255,255,.4); cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; user-select: none; transform: translate(-50%, -50%); box-shadow: 0 0 12px hsla(var(--oh), 80%, 60%, calc(var(--glow) * 0.6)); transition: box-shadow .15s; }
  .orb:active { cursor: grabbing; }
  #seal { position: absolute; bottom: 12px; right: 12px; padding: 8px 16px; background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #seal:hover { background: #333; }
</style>
