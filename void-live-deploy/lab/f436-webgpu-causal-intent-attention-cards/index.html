<style>
:root {
  --hue: 220;
  --blur: 0px;
  --contrast: 1;
  --energy: 0.4;
}
body {
  margin: 0;
  overflow: hidden;
  background: #0a0a12;
  color: #e0e8ff;
  font-family: system-ui, sans-serif;
  filter: hue-rotate(calc(var(--hue) * 1deg)) blur(var(--blur)) contrast(var(--contrast));
  transition: filter 0.3s;
}
#c {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
#scene {
  position: absolute;
  inset: 0;
  perspective: 900px;
  z-index: 2;
  pointer-events: none;
}
.card {
  position: absolute;
  width: 140px;
  height: 90px;
  background: rgba(20, 30, 60, 0.75);
  border: 1px solid rgba(180, 210, 255, 0.4);
  border-radius: 8px;
  padding: 8px;
  font-size: 11px;
  color: #d0e0ff;
  transform-style: preserve-3d;
  transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1), filter 0.3s;
  backdrop-filter: blur(4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.card strong { color: #9cf; }
#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 3;
  font-size: 12px;
  background: rgba(0,0,0,0.5);
  padding: 8px 12px;
  border-radius: 6px;
  pointer-events: auto;
}
button {
  background: #1a2a4a;
  color: #9cf;
  border: 1px solid #4a6a9a;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 6px;
}
#status { margin-top: 6px; opacity: 0.8; }
</style>
