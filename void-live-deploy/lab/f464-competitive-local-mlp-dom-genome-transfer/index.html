<style>
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#field { position:relative; width:100vw; height:100vh; }
.agent {
  position:absolute; width:72px; height:72px; border-radius:12px;
  background:linear-gradient(135deg,#1a1a3a,#2a2a5a);
  border:2px solid #4af; display:flex; align-items:center; justify-content:center;
  font-size:11px; text-align:center; cursor:pointer; user-select:none;
  transition:box-shadow 0.2s; will-change:transform;
}
.agent.highfit { box-shadow:0 0 18px #4af; border-color:#8cf; }
.agent.lowfit { opacity:0.7; }
#ui { position:fixed; top:12px; left:12px; background:rgba(0,0,20,0.85); padding:12px; border-radius:8px; z-index:10; max-width:280px; }
button { margin:4px 4px 0 0; padding:6px 10px; background:#224; color:#cdf; border:1px solid #46a; border-radius:4px; cursor:pointer; }
button:hover { background:#335; }
#status { font-size:12px; margin-top:8px; line-height:1.4; }
#orient { font-size:11px; color:#8af; }
</style>
