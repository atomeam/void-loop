<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #0f0f12; color: #eee; }
header { padding: 1rem; background: #1a1a22; }
h1 { margin: 0; font-size: 1.4rem; }
.controls { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem 1rem; background: #16161e; align-items: center; }
label { font-size: 0.9rem; }
input, button { padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; }
button { cursor: pointer; }
button:hover { background: #333; }
#board { display: flex; height: 60vh; min-height: 400px; overflow-x: auto; padding: 1rem; gap: 8px; }
.day { flex: 1; min-width: 120px; background: #1e1e28; border-radius: 8px; position: relative; border: 1px solid #333; }
.day h3 { margin: 0; padding: 0.5rem; text-align: center; background: #252530; font-size: 0.95rem; border-radius: 8px 8px 0 0; }
.timeline { position: absolute; top: 40px; left: 0; right: 0; bottom: 40px; background: linear-gradient(to bottom, #2a2a38 0%, #1a1a22 100%); }
.block { position: absolute; left: 4px; right: 4px; background: #4a7c59; border-radius: 4px; cursor: grab; opacity: 0.9; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: white; user-select: none; touch-action: none; }
.block:active { cursor: grabbing; }
.totals { padding: 1rem; background: #1a1a22; display: flex; flex-wrap: wrap; gap: 1rem; }
.totals div { background: #252530; padding: 0.5rem 1rem; border-radius: 6px; }
#status { padding: 0.5rem 1rem; font-size: 0.85rem; color: #aaa; }
@media (max-width: 600px) { #board { flex-direction: column; height: auto; } .day { min-height: 120px; } }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Spatial Weekly Timecard · Verse lab</title>
<meta name="description" content="Job: Track daily clock-in, clock-out and breaks on a spatial weekly board.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Spatial Weekly Timecard · Verse lab">
<meta property="og:description" content="Job: Track daily clock-in, clock-out and breaks on a spatial weekly board.">
<meta property="og:url" content="https://a-to-mind.com/lab/f811-spatial-weekly-timecard/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f811-spatial-weekly-timecard/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Weekly Time Card</h1>
  <p>Drag blocks or click to set times. Totals update live. Everything stays on this device.</p>
</header>
<div class="controls">
  <label>OT after <input type="number" id="otThresh" value="8" min="0" max="24" step="0.5"> h/day</label>
  <label>Default break <input type="number" id="breakMin" value="30" min="0" max="120"> min</label>
  <button id="addBlock">Add block to selected day</button>
  <button id="clearAll">Clear week</button>
  <button id="exportCsv">Download CSV</button>
  <button id="copySummary">Copy summary</button>
</div>
<div id="board"></div>
<div class="totals" id="totals"></div>
<div id="status">Ready. Click a day then "Add block", or drag existing blocks.</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
