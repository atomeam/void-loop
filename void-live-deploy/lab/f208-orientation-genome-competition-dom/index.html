<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root { --hue: 200; --energy: 0.3; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c12; color: #e0e6ff; font: 13px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .agent-card {
    position: absolute; width: 110px; padding: 8px; background: rgba(20,24,40,0.85);
    border: 1px solid rgba(160,180,255,0.4); border-radius: 8px; backdrop-filter: blur(6px);
    pointer-events: auto; cursor: grab; font-size: 11px; transform: translate(-50%,-50%);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .agent-card.leader { border-color: #ffd6a0; box-shadow: 0 0 12px #ffd6a055; }
  .agent-card .id { font-weight: 600; color: #a0b4ff; }
  .agent-card .fit { color: #ffd6a0; }
  #hud { position: fixed; bottom: 16px; left: 16px; background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px; max-width: 280px; pointer-events: none; }
  #controls { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; }
  button { background: #1a1e30; color: #ccc; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: #252a40; }
  #status { position: fixed; top: 16px; left: 16px; font-size: 12px; opacity: 0.8; }
</style>

<body>
<canvas id="c"></canvas>
<div id="status">Tilt device or move pointer · agents compete · seal best genome</div>
<div id="hud">
  <div>Agents: <span id="nAgents">0</span> · Leader fitness: <span id="leadFit">0</span></div>
  <div>Orient bias: β <span id="beta">0</span> γ <span id="gamma">0</span></div>
  <div>Sealed genomes: <span id="nSeals">0</span></div>
</div>
<div id="controls">
  <button id="seal">Seal Leader</button>
  <button id="transfer">Transfer via Broadcast</button>
  <button id="reset">Reset Field</button>
</div>
