    --bg: #0a0c10;

  .body:active { cursor: grabbing; }
  .label { font-weight: 600; color: var(--accent); }

    position: absolute; top: 12px; left: 12px; background: rgba(10,12,16,.75);
    padding: 8px 12px; border-radius: 6px; z-index: 10; font-size: 12px;

  button { background: #21262d; color: var(--fg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
