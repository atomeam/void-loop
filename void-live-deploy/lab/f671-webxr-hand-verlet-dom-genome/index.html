<style>
:root { --bg:#0a0a12; --card:#1a1a2e; --accent:#7c5cff; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#stage { position:relative; width:100vw; height:100vh; }
.card {
  position:absolute; width:90px; height:70px; background:var(--card);
  border:2px solid var(--accent); border-radius:12px; padding:8px;
  font-size:12px; cursor:grab; user-select:none; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4); transition:border-color .2s;
}
.card.rewarded { border-color:#5cff7c; }
#hud {
  position:fixed; top:12px; left:12px; background:rgba(0,0,0,.6); padding:10px 14px;
  border-radius:8px; font-size:13px; z-index:10; max-width:280px;
}
button {
  background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:6px;
  cursor:pointer; margin:4px 4px 0 0;
}
#status { margin-top:6px; font-size:11px; opacity:.8; }
</style>
