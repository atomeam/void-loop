<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4cc9f0; --text:#e8e8e8; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; }
#toolbar { position:fixed; top:0; left:0; right:0; height:56px; background:#16181d; display:flex; align-items:center; gap:8px; padding:0 12px; z-index:100; border-bottom:1px solid #2a2d35; }
button, input { background:#22262e; color:var(--text); border:1px solid #3a3f4a; border-radius:6px; padding:6px 10px; font-size:14px; }
button:hover { background:#2a2f38; }
button.primary { background:var(--accent); color:#000; border:none; font-weight:600; }
#board { position:absolute; top:56px; left:0; right:0; bottom:0; overflow:auto; background:#0c0e12; }
#svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.box { position:absolute; min-width:120px; min-height:48px; background:var(--card); border:2px solid #3a3f4a; border-radius:8px; padding:10px 12px; cursor:move; user-select:none; box-shadow:0 4px 12px rgba(0,0,0,.4); }
.box:focus { outline:2px solid var(--accent); }
.box.selected { border-color:var(--accent); }
#status { font-size:13px; opacity:.8; margin-left:auto; }
#log { position:fixed; bottom:8px; left:8px; background:#000a; padding:6px 10px; border-radius:6px; font-size:12px; max-width:60%; }
</style>

  <button id="exportJson">Export JSON</button>
  <button id="exportPng">Export PNG</button>
  <button id="clearBtn">Clear</button>
