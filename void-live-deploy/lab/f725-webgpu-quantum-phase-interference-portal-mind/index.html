<style>
  :root { --bg: #0a0a12; --fg: #e0e0ff; --accent: #6cf; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #1a1a2e; color: var(--fg); border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .portal {
    position: absolute; pointer-events: none; background: rgba(10,20,40,0.75);
    border: 1px solid var(--accent); border-radius: 8px; padding: 4px 8px;
    font-size: 12px; white-space: nowrap; transform: translate(-50%, -50%);
    transition: left 0.15s, top 0.15s; box-shadow: 0 0 12px rgba(100,200,255,0.4);
  }
  #status { position: absolute; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.7; }
</style>
