<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body { margin: 0; background: #0a0a12; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { position: fixed; inset: 0; z-index: 0; }
  #ui-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .sculptor-card {
    position: absolute; width: 140px; height: 90px; background: rgba(30,40,60,0.85);
    border: 1px solid #4af; border-radius: 12px; padding: 8px; box-sizing: border-box;
    pointer-events: auto; cursor: grab; transition: transform 0.1s linear;
    font-size: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .sculptor-card.claimed { border-color: #fa4; }
  .sculptor-card.human { border-color: #4f4; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  button { pointer-events: auto; margin: 4px; padding: 6px 12px; background: #224; color: #fff; border: 1px solid #4af; border-radius: 6px; cursor: pointer; }
  #status { color: #8cf; }
</style>
