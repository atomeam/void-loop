<style>
:root {
  --hue: 220;
  --scale: 1;
  --filter: 0;
}
body {
  margin: 0;
  background: #0a0a12;
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  transition: filter 0.4s, transform 0.4s;
}
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  background: rgba(20,20,40,0.7);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid hsla(var(--hue), 70%, 60%, 0.5);
  backdrop-filter: blur(8px);
  transform: scale(var(--scale)) rotate(calc(var(--filter) * 2deg));
  transition: all 0.3s ease;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}
button {
  background: #2a2a50;
  color: white;
  border: 1px solid #5a5a9a;
  padding: 6px 12px;
  border-radius: 6px;
  margin: 4px;
  cursor: pointer;
}
button:hover { background: #3a3a70; }
#status { font-size: 0.85rem; opacity: 0.8; margin-top: 8px; }
</style>
