<!DOCTYPE html>

<meta charset="UTF-8">

<style>
:root { --bg: #0a0a12; --fg: #e0e0ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
#scene { perspective: 800px; width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
.crystal {
  position: absolute; width: 48px; height: 48px; border-radius: 12px;
  background: hsl(var(--hue), 70%, 55%);
  box-shadow: 0 0 calc(var(--glow) * 20px) hsl(var(--hue), 80%, 60%);
  transform-style: preserve-3d;
  transition: background 0.1s;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: #000;
}
.crystal::after {
  content: ''; position: absolute; inset: 4px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
  pointer-events: none;
}
#ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
button { margin: 4px; padding: 4px 10px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
button:hover { background: #333; }
#status { margin-top: 6px; font-size: 11px; opacity: 0.8; }
</style>
