<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root { --bg: #0a0c10; --fg: #e0e6ef; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
#arena { position: absolute; inset: 0; }
.agent {
  position: absolute; width: 48px; height: 48px; border-radius: 12px;
  background: hsl(var(--hue, 180), 70%, 45%);
  transform: translate(-50%, -50%) scale(var(--scale, 1)) rotate(var(--rot, 0deg));
  box-shadow: 0 0 calc(var(--glow, 8px) * 1px) hsl(var(--hue, 180), 80%, 60%);
  transition: background 0.2s, box-shadow 0.2s;
  user-select: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000;
}
#hud {
  position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
  display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none;
}
#hud button, #hud span { pointer-events: auto; background: #1a1f2a; border: 1px solid #3a4555; color: var(--fg); padding: 6px 10px; border-radius: 6px; }
#status { font-size: 12px; opacity: 0.8; }
#attractor { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #ff6b6b; pointer-events: none; transform: translate(-50%, -50%); opacity: 0; }
</style>
