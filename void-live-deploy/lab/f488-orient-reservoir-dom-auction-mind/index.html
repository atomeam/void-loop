<style>
:root { --bg: #0a0c10; --fg: #e0e6ef; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; height: 100vh; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.agent {
  position: absolute; width: 72px; height: 72px; border-radius: 12px;
  background: hsl(var(--hue, 180), 70%, 45%);
  border: 2px solid hsl(var(--hue, 180), 80%, 70%);
  box-shadow: 0 0 calc(var(--glow, 8) * 1px) hsl(var(--hue, 180), 90%, 60%);
  transform: translate(-50%, -50%) scale(var(--scale, 1)) rotate(var(--rot, 0deg));
  display: flex; align-items: center; justify-content: center; font-size: 11px;
  cursor: pointer; user-select: none; transition: background 0.2s, box-shadow 0.2s;
  will-change: transform, left, top;
}
.agent .label { pointer-events: none; text-shadow: 0 1px 2px #000; }
#ui {
  position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(10,12,16,0.75);
  padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(4px); max-width: 280px;
}
button, .btn { background: #1a2230; color: #e0e6ef; border: 1px solid #3a4a60; border-radius: 4px;
  padding: 4px 10px; margin: 2px; cursor: pointer; font-size: 12px; }
button:hover { background: #243044; }
#status { font-size: 11px; opacity: 0.8; margin-top: 6px; }
#attractor { position: absolute; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; opacity: 0.6; pointer-events: none; transform: translate(-50%,-50%);
  box-shadow: 0 0 12px #fff; z-index: 5; }
</style>
