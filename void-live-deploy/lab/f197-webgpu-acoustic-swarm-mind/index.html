<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --energy: 0.3;
  --residual: 0.1;
  --hue: 200;
  --blur: 0px;
}
body {
  margin: 0;
  overflow: hidden;
  background: #0a0a12;
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  filter: hue-rotate(calc(var(--hue) * 1deg)) blur(var(--blur));
  transition: filter 0.4s;
}
canvas { display: block; width: 100vw; height: 100vh; }
#ui {
  position: fixed; top: 12px; left: 12px; z-index: 10;
  background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
  font-size: 13px; max-width: 320px; backdrop-filter: blur(6px);
}
#nodes { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.node {
  position: absolute; width: 180px; padding: 8px 10px;
  background: rgba(20,30,50,0.75); border: 1px solid rgba(100,180,255,0.4);
  border-radius: 6px; font-size: 12px; transform: translate(-50%,-50%);
  transition: left 0.3s, top 0.3s, opacity 0.3s;
  pointer-events: auto; cursor: grab;
}
.status { color: #8cf; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
