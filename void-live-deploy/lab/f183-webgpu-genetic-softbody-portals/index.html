<style>
  :root { --energy: 0; --best-fit: 0; }
  body { margin: 0; background: #070711; color: #cde; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hud { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(10,10,30,0.75); padding: 12px 16px; border-radius: 8px; border: 1px solid #246; max-width: 340px; backdrop-filter: blur(4px); }
  #hud h1 { margin: 0 0 6px; font-size: 1.05rem; }
  #status { font-size: 0.82rem; line-height: 1.45; }
  button { background: #123; color: #acf; border: 1px solid #46a; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin: 4px 4px 0 0; }
  button:hover { background: #234; }
  #portals { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .portal { position: absolute; width: 110px; height: 70px; pointer-events: auto; background: rgba(20,30,60,0.7); border: 2px solid #4af; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.75rem; padding: 6px; cursor: pointer; transition: opacity 0.3s; backdrop-filter: blur(2px); }
  .portal:hover { border-color: #8cf; }
  #chrome { position: absolute; bottom: 12px; right: 12px; z-index: 10; padding: 8px 12px; background: rgba(20,20,40,0.6); border-radius: 6px; font-size: 0.78rem; transform: scale(calc(1 + var(--energy) * 0.08)); filter: hue-rotate(calc(var(--best-fit) * 40deg)); }
</style>
