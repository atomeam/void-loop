<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
:root { --bg:#0a0a12; --card:#1a1a2e; --accent:#7c5cff; --text:#e0e0ff; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; }
#field { position:relative; width:100vw; height:100vh; }
.card {
  position:absolute; width:120px; height:80px; background:var(--card);
  border:2px solid var(--accent); border-radius:12px; padding:8px;
  font-size:12px; cursor:grab; user-select:none; transition:transform .05s linear;
  box-shadow:0 4px 20px rgba(124,92,255,.3);
}
.card.active { border-color:#ff5c7c; box-shadow:0 0 20px #ff5c7c; }
.card .label { font-weight:600; }
.card .fitness { opacity:.7; font-size:10px; }
#ui {
  position:fixed; top:10px; left:10px; right:10px; z-index:10;
  display:flex; gap:12px; flex-wrap:wrap; pointer-events:none;
}
.panel {
  background:rgba(10,10,18,.85); border:1px solid #333; border-radius:8px;
  padding:10px; font-size:12px; pointer-events:auto; max-width:280px;
}
button,textarea { font:inherit; background:#222; color:var(--text); border:1px solid #444; border-radius:4px; padding:4px 8px; }
button:hover { background:#333; }
textarea { width:100%; height:60px; resize:vertical; }
#status { position:fixed; bottom:10px; left:10px; font-size:11px; opacity:.8; }
</style>
