<style>
:root { --bg:#0a0a12; --fg:#e8e8f0; --acc:#6cf; --card:rgba(20,24,40,.85); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
canvas { display:block; width:100%; height:100%; touch-action:none; }
#ui { position:absolute; top:12px; left:12px; z-index:10; display:flex; gap:8px; flex-wrap:wrap; }
button { background:#1a2040; color:var(--fg); border:1px solid #3a4a80; padding:6px 10px; border-radius:6px; cursor:pointer; }
button:hover { background:#243060; }
#status { position:absolute; bottom:12px; left:12px; font-size:12px; opacity:.8; }
.card { position:absolute; background:var(--card); border:1px solid #4af; border-radius:8px; padding:6px 8px; font-size:11px; pointer-events:auto; cursor:grab; min-width:80px; backdrop-filter:blur(4px); }
.card.winner { border-color:#fc6; box-shadow:0 0 8px #fc6; }
#log { position:absolute; top:12px; right:12px; max-width:220px; font-size:11px; opacity:.7; max-height:40vh; overflow:auto; }
</style>
