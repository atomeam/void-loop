<style>
:root {
  --hue: 220;
  --blur: 0px;
  --contrast: 1;
  --bg: #0a0a12;
}
body {
  margin: 0;
  background: var(--bg);
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  filter: contrast(var(--contrast));
}
canvas { display: block; position: absolute; inset: 0; }
#ui {
  position: absolute; top: 12px; left: 12px; z-index: 10;
  background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px;
  backdrop-filter: blur(6px); font-size: 13px; max-width: 320px;
}
.portal {
  position: absolute; width: 140px; height: 80px;
  background: rgba(20,20,40,.55);
  border: 1px solid hsla(var(--hue), 70%, 60%, .6);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; text-align: center; cursor: grab;
  transform-style: preserve-3d;
  transition: filter .2s;
  user-select: none;
  z-index: 5;
}
.portal:active { cursor: grabbing; }
#status { margin-top: 6px; opacity: .8; }
</style>
