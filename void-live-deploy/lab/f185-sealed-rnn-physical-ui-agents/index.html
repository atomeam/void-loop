<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root { --bg: #0a0a0c; --fg: #e8e6e3; --accent: #7c5cbf; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card { position: absolute; width: 140px; height: 90px; background: rgba(124, 92, 191, 0.18); border: 1px solid rgba(124, 92, 191, 0.6); border-radius: 12px; backdrop-filter: blur(6px); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 12px; pointer-events: none; transition: border-color 0.2s; transform-origin: center; }
.card.champion { border-color: #f0c040; box-shadow: 0 0 20px rgba(240, 192, 64, 0.4); }
#ui { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
button { background: #1a1a22; color: var(--fg); border: 1px solid #444; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
button:hover { background: #252530; }
#status { position: absolute; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.8; z-index: 10; max-width: 60%; }
#energy { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle, #fff8, transparent 70%); pointer-events: none; transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s; }
</style>
