canvas{width:min(100vw,200vh);height:auto;image-rendering:auto;touch-action:none;cursor:crosshair}
#panel{position:fixed;left:16px;bottom:16px;width:290px;padding:14px 16px;border:1px solid #3a4560;border-radius:14px;background:rgba(6,8,14,.82);backdrop-filter:blur(6px);transform-origin:50% 100%;transition:transform .25s ease-out,border-width .25s}

label{display:grid;grid-template-columns:86px 1fr 40px;gap:6px;align-items:center;font-size:12px}
input[type=range]{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button{background:#121828;color:#e8ecf6;border:1px solid #3a4560;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
button:hover{border-color:#8fb4ff}
#hud{margin-top:8px;font-variant-numeric:tabular-nums;font-size:12px}
#lift{position:fixed;width:3px;background:linear-gradient(#9ff,#38f);border-radius:2px;transform-origin:50% 100%;pointer-events:none;box-shadow:0 0 12px #6cf}
#drag{position:fixed;height:3px;background:linear-gradient(90deg,#f86,#fd8);border-radius:2px;pointer-events:none;box-shadow:0 0 12px #f86}

<h1>WING FORGE · F-308</h1>
<p>Real lattice-Boltzmann air flows left to right. Paint rocks into the tunnel (shift-drag erases), then let the forge evolve a wing that flies best around them. This panel tilts with the wing's measured lift.</p>
