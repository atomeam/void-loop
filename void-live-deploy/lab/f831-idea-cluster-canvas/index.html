<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --accent: #58a6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.2rem; }
  textarea { width: 280px; height: 80px; background: #0d1117; color: var(--text); border: 1px solid #30363d; border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  input[type=number] { width: 60px; background: #0d1117; color: var(--text); border: 1px solid #30363d; border-radius: 4px; padding: 6px; }
  button { background: var(--accent); color: #0d1117; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #21262d; color: var(--text); }
  #stage { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at 20% 20%, #1c2128, #0f1419); }
  .card { position: absolute; min-width: 140px; max-width: 220px; background: var(--card); border: 2px solid #30363d; border-radius: 10px; padding: 10px 12px; cursor: grab; user-select: none; box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: border-color .2s, transform .1s; }
  .card:active { cursor: grabbing; z-index: 10; }
  .card[contenteditable] { outline: none; }
  .cluster-label { position: absolute; font-size: 0.75rem; opacity: .6; pointer-events: none; }
  footer { padding: 8px 16px; font-size: 0.8rem; opacity: .7; border-top: 1px solid #30363d; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Idea cluster canvas · Verse lab</title>
<meta name="description" content="A useful local-AI spatial tool for organizing unstructured notes. User pastes ideas. Pure JavaScript TF-IDF produces sparse embedding vectors.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Idea cluster canvas · Verse lab">
<meta property="og:description" content="A useful local-AI spatial tool for organizing unstructured notes. User pastes ideas. Pure JavaScript TF-IDF produces sparse embedding vectors.">
<meta property="og:url" content="https://a-to-mind.com/lab/f831-idea-cluster-canvas/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f831-idea-cluster-canvas/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Idea Cluster Canvas</h1>
  <textarea id="input" placeholder="Paste ideas, one per line&#10;e.g.&#10;Build a mobile app&#10;Fix the login bug&#10;Write docs&#10;Call the team&#10;Research competitors"></textarea>
  <label>Clusters: <input type="number" id="k" value="4" min="2" max="12"></label>
  <button id="clusterBtn">Cluster</button>
  <button id="copyBtn" class="secondary">Copy Markdown</button>
  <button id="downloadBtn" class="secondary">Download JSON</button>
</header>
<div id="stage"></div>
<footer>Local TF-IDF + k-means. Drag cards to reassign clusters. Works offline. Nothing is sent anywhere.</footer>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
