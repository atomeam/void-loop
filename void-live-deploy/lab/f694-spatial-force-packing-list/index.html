<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; overflow: hidden; }
#controls { position: fixed; top: 10px; left: 10px; z-index: 100; background: #222; padding: 12px; border-radius: 8px; max-width: 320px; }
textarea { width: 100%; height: 80px; background: #333; color: #eee; border: 1px solid #555; }
button { margin: 4px; padding: 8px 12px; background: #0a84ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
#canvas { position: relative; width: 100vw; height: 100vh; }
.item { position: absolute; background: #2c2c2e; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: grab; user-select: none; min-width: 80px; text-align: center; font-size: 14px; }
.item.dragging { z-index: 10; opacity: 0.8; cursor: grabbing; }
.centroid { position: absolute; width: 8px; height: 8px; background: #0a84ff; border-radius: 50%; pointer-events: none; opacity: 0.6; }
</style>
