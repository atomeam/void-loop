<!DOCTYPE html>

<meta charset="UTF-8">

<style>
:root {
  --hue: 200;
  --energy: 0.5;
  --entropy: 0.3;
  --mind-mood: 0;
}
body {
  margin: 0;
  background: #0a0a12;
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  filter: hue-rotate(calc(var(--hue) * 1deg)) contrast(calc(1 + var(--energy)*0.3));
}
canvas { display: block; width: 100vw; height: 100vh; }
.orb {
  position: absolute;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(100,200,255,0.2));
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: transform 0.1s linear;
  box-shadow: 0 0 20px rgba(150,200,255,0.4);
}
#hud {
  position: absolute; top: 12px; left: 12px;
  background: rgba(0,0,0,0.6);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  max-width: 280px;
  backdrop-filter: blur(4px);
}
button {
  background: #224;
  color: #cdf;
  border: 1px solid #46a;
  padding: 6px 10px;
  margin: 4px 2px;
  border-radius: 4px;
  cursor: pointer;
}
#status { font-size: 11px; opacity: 0.8; }
</style>
