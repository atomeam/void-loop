  canvas { display: block; width: 100vw; height: 100vh; }
  .portal {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle, #fff6 0%, #4af 40%, #028 100%);
    border: 2px solid #8cf; box-shadow: 0 0 12px #4af;

    font-size: 10px; font-weight: bold; color: #000; user-select: none;
    transition: box-shadow 0.2s;
  }
  .portal:active { cursor: grabbing; }
  .portal.best { box-shadow: 0 0 24px #ff0; border-color: #ff0; }
  #ui { position: absolute; top: 12px; left: 12px; background: #000a; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  button { background: #28a; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
