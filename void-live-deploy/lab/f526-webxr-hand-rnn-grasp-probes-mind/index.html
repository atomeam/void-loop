<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
:root { --bg: #0a0a12; --fg: #e0e0ff; --accent: #6cf; --grasp: #f6c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; height: 100vh; }
#status { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 100; background: rgba(0,0,0,.7); padding: 8px 12px; border-radius: 8px; font-size: 12px; pointer-events: none; }
#controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; }
button { background: #222; color: var(--fg); border: 1px solid #444; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
button:hover { background: #333; }
button.primary { background: var(--accent); color: #000; border: none; }
#canvas { position: relative; width: 100%; height: 100vh; }
.probe { position: absolute; width: 80px; height: 60px; background: rgba(20,20,40,.85); border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; user-select: none; cursor: grab; transition: box-shadow .2s, transform .1s; will-change: transform; }
.probe.grasping { border-color: var(--grasp); box-shadow: 0 0 20px var(--grasp); cursor: grabbing; }
.probe .label { pointer-events: none; text-align: center; }
.hand { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,100,200,.4); border: 2px solid var(--grasp); pointer-events: none; z-index: 50; display: none; }
.hand.active { display: block; }
</style>
