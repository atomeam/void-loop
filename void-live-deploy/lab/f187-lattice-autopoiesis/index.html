  #info { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; font-size: 12px; z-index: 10; pointer-events: none; }
  #seal { position: absolute; bottom: 12px; right: 12px; background: #222; color: #0f0; padding: 6px 10px; border-radius: 6px; font-size: 11px; z-index: 10; }
