<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a12; color: #e0e0ff; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas#field { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .agent {
    position: absolute; width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    font-weight: bold; cursor: pointer; user-select: none; border: 2px solid rgba(255,255,255,0.3);
    transition: box-shadow 0.1s; will-change: transform;
  }
  .agent.selected { box-shadow: 0 0 0 3px #0ff, 0 0 12px #0ff; }
  #ui {
    position: fixed; top: 12px; left: 12px; background: rgba(10,10,20,0.85); padding: 12px;
    border-radius: 8px; font-size: 13px; max-width: 320px; z-index: 10; backdrop-filter: blur(4px);
  }
  button, textarea { margin: 4px 0; font-size: 12px; }
  textarea { width: 100%; height: 60px; background: #111; color: #ccc; border: 1px solid #333; }
  #status { margin-top: 8px; font-size: 11px; opacity: 0.8; }
</style>
