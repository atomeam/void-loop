<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --hue: 220;
    --energy: 0.3;
    --thought: 0.5;
    --residual: 0.2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: hsl(var(--hue), 40%, calc(6% + var(--energy)*8%));
    color: #e8e8f0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    transition: background 0.4s ease, filter 0.3s ease;
    filter: contrast(calc(1 + var(--thought)*0.15)) hue-rotate(calc(var(--residual)*20deg));
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 280px;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #panels {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, hsla(var(--hue), 70%, 60%, 0.55), transparent 70%);
    border: 1px solid hsla(var(--hue), 80%, 70%, 0.4);
    transform: translate(-50%, -50%) scale(calc(0.7 + var(--energy)*0.6));
    transition: transform 0.2s, background 0.3s;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
    padding: 8px;
    opacity: calc(0.6 + var(--thought)*0.4);
  }
  button#xr {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button#xr:hover { background: #333; }
</style>
