<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eef4;
    --muted: #8b9bb4;
    --accent: #3d8bfd;
    --good: #2ecc71;
    --warn: #f39c12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }
  input[type="number"] {
    width: 100%;
    padding: 0.65rem;
    border: 1px solid #2c3a4f;
    border-radius: 8px;
    background: #121820;
    color: var(--text);
    font-size: 1.05rem;
  }
  .row { display: flex; gap: 0.75rem; }
  .row > div { flex: 1; }
  .cost-display {
    text-align: center;
    padding: 1.2rem 0;
  }
  .big {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--good);
  }
  .per { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
  .people {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: center;
    margin: 0.8rem 0;
    min-height: 48px;
  }
  .person {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.35;
    transition: opacity 0.2s, transform 0.2s;
  }
  .person.active { opacity: 1; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    margin: 0.25rem;
  }
  button.secondary { background: #2c3a4f; }
  button:disabled { opacity: 0.5; }
  .actions { text-align: center; margin-top: 0.5rem; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 0.8rem; }
  .bar {
    height: 8px;
    background: #2c3a4f;
    border-radius: 4px;
    overflow: hidden;
    margin: 0.5rem 0;
  }
  .bar > div {
    height: 100%;
    background: var(--warn);
    width: 0%;
    transition: width 0.3s;
  }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Meeting cost calculator · Verse lab</title>
<meta name="description" content="Job: Enter the number of people, their average hourly rate, and the planned length of the meeting.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Meeting cost calculator · Verse lab">
<meta property="og:description" content="Job: Enter the number of people, their average hourly rate, and the planned length of the meeting.">
<meta property="og:url" content="https://a-to-mind.com/lab/f699-meeting-cost-calculator/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f699-meeting-cost-calculator/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Meeting cost calculator</h1>
  <p class="sub">See what the meeting really costs. Everything stays on this device.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="attendees">People</label>
        <input type="number" id="attendees" min="1" max="50" value="6" step="1">
      </div>
      <div>
        <label for="rate">Avg hourly rate</label>
        <input type="number" id="rate" min="0" step="0.01" value="80">
      </div>
    </div>
    <label for="minutes">Planned length (minutes)</label>
    <input type="number" id="minutes" min="1" max="480" value="30" step="1">
  </div>

  <div class="card">
    <div class="cost-display">
      <div class="big" id="total">$0</div>
      <div class="per" id="per">$0 per minute</div>
    </div>
    <div class="people" id="people"></div>
    <div class="bar"><div id="progress"></div></div>
    <div style="text-align:center; font-size:0.85rem; color:var(--muted);" id="status">Ready</div>
    <div class="actions">
      <button id="start">Start timer</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <button id="reset" class="secondary">Reset</button>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="copy">Copy summary</button>
      <button id="download" class="secondary">Download .txt</button>
    </div>
    <p class="note" id="note">Uses the rate you enter. No overhead, no taxes. Live cost uses real elapsed time.</p>
  </div>
</div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
