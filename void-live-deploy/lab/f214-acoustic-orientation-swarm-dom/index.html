<style>
  :root { --bg: #07070c; --card: #12121a; --accent: #8cf; --text: #e6e6f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 10px; left: 10px; z-index: 20; background: #0a0a1288; padding: 10px 14px; border-radius: 10px; font-size: 13px; backdrop-filter: blur(10px); max-width: 280px; }
  button { background: #1a1a22; color: var(--accent); border: 1px solid #333; padding: 5px 9px; border-radius: 6px; margin: 2px; cursor: pointer; font-size: 12px; }
  button:hover { background: #222; }
  #arena { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .card {
    position: absolute; min-width: 90px; min-height: 56px; background: var(--card); border: 2px solid #2a2a3a;
    border-radius: 12px; padding: 8px; font-size: 11px; pointer-events: auto; cursor: grab;
    transition: transform 0.05s linear, border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 24px #0005; user-select: none;
  }
  .card:active { cursor: grabbing; }
  .status { color: #9df; font-size: 11px; margin-top: 4px; }
  .fit { opacity: 0.7; }
</style>
