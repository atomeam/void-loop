<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --void-bg: #0a0a12;
    --accent: #4af;
    --resonance: 0;
  }
  body {
    margin: 0;
    background: var(--void-bg);
    color: #cce;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    transition: background 0.8s;
  }
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,20,0.7);
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #246;
    max-width: 320px;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  #hud h1 { margin: 0 0 8px; font-size: 1.1rem; }
  #status { font-size: 0.85rem; line-height: 1.4; }
  #portals {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .portal {
    position: absolute;
    width: 80px;
    height: 80px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    pointer-events: auto;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.4s;
    background: radial-gradient(circle, rgba(68,170,255,0.3), transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    text-align: center;
    padding: 4px;
  }
  .portal.active {
    opacity: 1;
    transform: scale(1);
  }
  #chrome {
    position: absolute;
    bottom: 12px;
    right: 12px;
    padding: 10px;
    background: rgba(20,20,40,0.6);
    border-radius: 6px;
    font-size: 0.8rem;
    transform: scale(calc(1 + var(--resonance) * 0.15));
    filter: hue-rotate(calc(var(--resonance) * 80deg));
    transition: transform 0.5s, filter 0.5s;
  }
  button {
    background: #123;
    color: #acf;
    border: 1px solid #46a;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #234; }
</style>
