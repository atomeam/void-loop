<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --attention-hue: 200;
    --portal-scale: 1;
    --bg: #0a0c10;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e0e6ef; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #chrome {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: hsl(var(--attention-hue), 40%, 12% / 0.85);
    border: 1px solid hsl(var(--attention-hue), 60%, 40%);
    border-radius: 12px; padding: 12px 16px; backdrop-filter: blur(8px);
    transform: scale(calc(0.95 + var(--portal-scale) * 0.05));
    transition: background 0.3s, border-color 0.3s;
  }
  button, .portal {
    background: hsl(var(--attention-hue), 50%, 20%);
    border: 1px solid hsl(var(--attention-hue), 70%, 50%);
    color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .portal {
    position: absolute; width: 140px; min-height: 70px; padding: 8px;
    font-size: 12px; z-index: 20; user-select: none; touch-action: none;
    transform: scale(var(--portal-scale));
  }
  .portal h4 { margin: 0 0 4px; font-size: 13px; }
  #status { font-size: 11px; opacity: 0.8; margin-top: 6px; }
</style>
