<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --hue: 200;
  --sat: 50%;
  --light: 20%;
  --scale: 1;
  --blur: 0px;
  --energy: 0;
}
body {
  margin: 0;
  overflow: hidden;
  background: hsl(var(--hue), var(--sat), var(--light));
  font-family: system-ui, sans-serif;
  color: #eee;
  filter: blur(var(--blur));
  transform: scale(var(--scale));
  transform-origin: center;
  transition: background 0.3s, filter 0.2s, transform 0.2s;
}
#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
  z-index: 10;
  backdrop-filter: blur(4px);
}
#probes {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}
.probe {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: hsla(var(--hue), 80%, 60%, 0.7);
  border: 2px solid white;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: pointer;
  mix-blend-mode: screen;
}
#seal-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  background: #333;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  z-index: 20;
}
</style>
