<style>
:root { --bg:#0a0a12; --fg:#e8e8f0; --acc:#6cf; --card:#1a1a28; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
#stage { position:relative; width:100vw; height:100vh; }
canvas { position:absolute; inset:0; width:100%; height:100%; }
.agent { position:absolute; width:72px; height:48px; background:var(--card); border:2px solid var(--acc); border-radius:8px; padding:4px; font-size:11px; cursor:pointer; user-select:none; transition:transform .15s; z-index:2; box-shadow:0 4px 12px #0006; }
.agent.best { border-color:#fc6; box-shadow:0 0 12px #fc6; }
.agent .fit { color:#8f8; }
#hud { position:absolute; top:8px; left:8px; right:8px; z-index:10; display:flex; gap:8px; flex-wrap:wrap; pointer-events:none; }
#hud > * { pointer-events:auto; background:#000a; padding:6px 10px; border-radius:6px; border:1px solid #333; }
button { background:#222; color:var(--fg); border:1px solid #555; padding:6px 12px; border-radius:4px; cursor:pointer; }
button:hover { background:#333; }
#log { position:absolute; bottom:8px; left:8px; max-width:40%; font-size:12px; opacity:.8; }
</style>
