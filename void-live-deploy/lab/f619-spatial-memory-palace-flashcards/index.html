<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#5eead4; --text:#e5e7eb; --due:#fbbf24; --good:#34d399; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100dvh; overflow:hidden; }
#ui { position:fixed; top:0; left:0; right:0; z-index:20; padding:8px; background:rgba(15,17,21,.9); backdrop-filter:blur(8px); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
input, textarea, button, select { background:var(--card); color:var(--text); border:1px solid #333; border-radius:6px; padding:6px 10px; font-size:13px; }
button { cursor:pointer; }
button:hover { border-color:var(--accent); }
#palace { position:absolute; inset:70px 0 0 0; overflow:auto; background:#111; }
.card { position:absolute; width:160px; min-height:70px; background:var(--card); border:1px solid #333; border-radius:10px; padding:8px; font-size:12px; cursor:grab; user-select:none; box-shadow:0 4px 12px rgba(0,0,0,.5); }
.card.due { border-color:var(--due); }
.card.studying { border-color:var(--accent); outline:2px solid var(--accent); }
.card .front { font-weight:600; }
.card .back { opacity:.7; margin-top:4px; display:none; }
.card.revealed .back { display:block; }
#study { position:fixed; bottom:0; left:0; right:0; background:rgba(15,17,21,.95); padding:10px; z-index:20; display:none; gap:8px; flex-wrap:wrap; align-items:center; }
#status { font-size:12px; opacity:.7; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Spatial Memory Palace Flashcards · Verse lab</title>
<meta name="description" content="Job: Paste front/back card pairs, drag them onto a 2D spatial palace canvas so position aids recall, then study with local SM-2 spaced repetition.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Spatial Memory Palace Flashcards · Verse lab">
<meta property="og:description" content="Job: Paste front/back card pairs, drag them onto a 2D spatial palace canvas so position aids recall, then study with local SM-2 spaced repetition.">
<meta property="og:url" content="https://a-to-mind.com/lab/f619-spatial-memory-palace-flashcards/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f619-spatial-memory-palace-flashcards/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<div id="ui">
  <textarea id="paste" placeholder="front, back&#10;one per line" rows="1" style="width:180px;height:32px;resize:none;"></textarea>
  <button id="addPaste">Add from paste</button>
  <input id="front" placeholder="Front">
  <input id="back" placeholder="Back">
  <button id="addOne">Add</button>
  <button id="studyBtn">Study due</button>
  <button id="exportJSON">Export JSON</button>
  <button id="exportCSV">Export CSV</button>
  <button id="clear">Clear</button>
  <span id="status">Drag cards · spatial palace + SM-2</span>
</div>
<div id="palace"></div>
<div id="study">
  <span id="studyFront" style="flex:1;font-weight:600;"></span>
  <button id="reveal">Reveal</button>
  <button id="again">Again</button>
  <button id="hard">Hard</button>
  <button id="good">Good</button>
  <button id="easy">Easy</button>
  <button id="speak">Speak</button>
  <button id="stopStudy">Stop</button>
</div>
<script src="app.js"></script>
<h1 class="vl-sr">Spatial Memory Palace Flashcards</h1>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
