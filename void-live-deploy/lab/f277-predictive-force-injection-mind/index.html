<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --border-w: 4px;
    --hue: 200;
    --seal: 0.3;
  }
  body {
    margin: 0;
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #frame {
    position: absolute;
    inset: 12px;
    border: var(--border-w) solid hsl(var(--hue), 70%, 55%);
    border-radius: 12px;
    box-shadow: 0 0 40px hsla(var(--hue), 80%, 50%, var(--seal));
    pointer-events: none;
    transition: border-width 0.2s, box-shadow 0.3s;
    z-index: 2;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #050508;
  }
  #status {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: hsla(var(--hue), 40%, 20%, 0.85);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px solid hsla(var(--hue), 70%, 60%, 0.6);
    z-index: 3;
    transition: background 0.3s;
  }
  #hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: 0.6;
    z-index: 3;
  }
</style>
