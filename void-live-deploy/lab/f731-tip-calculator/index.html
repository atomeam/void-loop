<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --acc:#4ade80; --card:#1a1d24; --border:#2a2e37; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
header { padding:1rem; border-bottom:1px solid var(--border); }
h1 { margin:0; font-size:1.4rem; }
.container { max-width:560px; margin:0 auto; padding:1rem; }
section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
h2 { margin:0 0 0.5rem; font-size:1.1rem; }
label { display:block; margin:0.5rem 0 0.2rem; font-size:0.9rem; }
input, select, button { padding:0.5rem; border-radius:4px; border:1px solid var(--border); background:#111; color:var(--fg); font:inherit; width:100%; }
button { background:var(--acc); color:#000; border:none; cursor:pointer; font-weight:600; width:auto; }
button:hover { filter:brightness(1.1); }
.row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:end; margin-bottom:0.5rem; }
.presets { display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.4rem 0; }
.presets button { background:#222; color:var(--fg); }
.presets button.active { background:var(--acc); color:#000; }
.results { font-size:1.15rem; }
.results strong { color:var(--acc); }
.line { background:#111; padding:0.6rem; border-radius:4px; font-family:ui-monospace,monospace; font-size:0.9rem; margin:0.5rem 0; word-break:break-all; }
footer { text-align:center; font-size:0.8rem; opacity:0.7; padding:1rem; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Tip calculator · Verse lab</title>
<meta name="description" content="Job: Enter the bill amount, pick a tip percent and number of people, choose how to round; get the tip, total and each person's share to copy as a line.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Tip calculator · Verse lab">
<meta property="og:description" content="Job: Enter the bill amount, pick a tip percent and number of people, choose how to round; get the tip, total and each person's share to copy as a line.">
<meta property="og:url" content="https://a-to-mind.com/lab/f731-tip-calculator/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f731-tip-calculator/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <div class="container">
    <h1>Tip calculator</h1>
    <p>Bill, tip percent, people, and rounding. Copy the line. Saved on this device.</p>
  </div>
</header>
<div class="container">
  <section>
    <h2>Bill</h2>
    <label>Amount <input id="bill" type="number" step="0.01" min="0" value="45.00" /></label>
    <label>Tip percent
      <div class="presets" id="presets">
        <button data-p="10">10%</button>
        <button data-p="15">15%</button>
        <button data-p="18">18%</button>
        <button data-p="20" class="active">20%</button>
        <button data-p="25">25%</button>
      </div>
      <input id="tipPct" type="number" step="0.1" min="0" value="20" />
    </label>
    <label>People <input id="people" type="number" min="1" max="99" value="1" /></label>
    <label>Rounding
      <select id="round">
        <option value="exact">Exact to the cent</option>
        <option value="tip-dollar">Round tip up to next dollar</option>
        <option value="each-dollar">Round each person's total to nearest dollar</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Result</h2>
    <div id="results" class="results"></div>
    <div id="line" class="line"></div>
    <div class="row">
      <button id="copyBtn">Copy line</button>
      <button id="clearBtn">Reset</button>
    </div>
  </section>
</div>
<footer>Everything stays on this device. Works offline. Numbers are exact arithmetic on the values you enter.</footer>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
