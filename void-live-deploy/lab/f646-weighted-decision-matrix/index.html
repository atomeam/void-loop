<body>
<main class="vs-page">
<h1>Weighted decision matrix</h1>
<p class="lead">Add options and criteria, set weights, score each option (higher is better), and see the live ranking. Nothing leaves this device.</p>

<div class="section">
  <h2>Options</h2>
  <div id="options"></div>
  <button class="primary" id="add-option">Add option</button>
</div>

<div class="section">
  <h2>Criteria</h2>
  <div id="criteria"></div>
  <button class="primary" id="add-criterion">Add criterion</button>
</div>

<div class="section">
  <h2>Scores</h2>
  <div id="matrix"></div>
</div>

<div class="section">
  <h2>Ranking</h2>
  <div id="ranking"></div>
</div>

<div class="actions">
  <button class="secondary" id="copy">Copy summary</button>
  <button class="secondary" id="csv">Download CSV</button>
  <button class="secondary" id="share">Copy share link</button>
  <button class="secondary" id="reset">Reset</button>
</div>
<div id="status"></div>

</main>
