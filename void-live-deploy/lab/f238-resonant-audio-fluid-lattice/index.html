<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root { --density: 0.3; --visc: 0.8; --ai: 0.5; }
  body { margin: 0; background: #05080f; color: #c8d4e8; font-family: system-ui, sans-serif; overflow: hidden; transition: filter 0.4s; }
  body.morph { filter: hue-rotate(calc(var(--ai) * 40deg)) brightness(calc(0.8 + var(--density) * 0.4)); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: absolute; top: 12px; left: 12px; background: rgba(8,12,24,0.7); padding: 12px 16px; border-radius: calc(8px + var(--density) * 16px); border: 1px solid rgba(100,180,255,0.3); backdrop-filter: blur(8px); max-width: 280px; transition: border-radius 0.3s, box-shadow 0.3s; box-shadow: 0 0 calc(20px * var(--ai)) rgba(80,160,255,0.4); }
  #hud h1 { margin: 0 0 8px; font-size: 1.1rem; letter-spacing: 0.05em; }
  #stats { font-size: 0.8rem; line-height: 1.4; opacity: 0.85; }
  button { background: rgba(40,80,140,0.6); border: 1px solid #4af; color: #eef; padding: 6px 12px; margin: 4px 4px 0 0; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
  button:hover { transform: scale(1.05); }
  .orb { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #48f 60%, #024 100%); box-shadow: 0 0 20px #48f; cursor: grab; opacity: 0.85; transition: transform 0.1s; pointer-events: auto; }
  .orb:active { cursor: grabbing; transform: scale(1.2); }
  #seal { position: absolute; bottom: 12px; right: 12px; font-size: 0.75rem; opacity: 0.6; }
</style>
