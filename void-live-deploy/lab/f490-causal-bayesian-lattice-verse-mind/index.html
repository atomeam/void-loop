<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #0a0c10;
    --fg: #e8eef6;
    --accent: #5ce1e6;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    perspective: 1200px;
    background: radial-gradient(ellipse at center, #12161e 0%, #0a0c10 70%);
  }
  .card {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: rgba(30, 36, 48, 0.85);
    border: 1px solid rgba(92, 225, 230, 0.3);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
    will-change: transform, background;
  }
  .card:active { cursor: grabbing; }
  .card .label { pointer-events: none; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(10,12,16,0.7);
    backdrop-filter: blur(8px);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(92,225,230,0.2);
    max-width: 280px;
  }
  #hud h1 { margin: 0 0 8px; font-size: 16px; color: var(--accent); }
  #hud p { margin: 0 0 10px; font-size: 13px; opacity: 0.85; }
  button {
    background: #1a2230;
    color: var(--fg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 12px;
    margin-right: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #243044; }
  #status { font-size: 12px; opacity: 0.7; margin-top: 8px; }
</style>

<body>

  <h1>Causal Bayesian Lattice</h1>
  <p>Move pointer to inject evidence. Drag cards to rewire space. Seal probabilistic memories.</p>

  <button id="reset">Reset</button>
