<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --residual: 0;
    --energy: 0.3;
    --hue: 220;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050508; color: #eee; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #chrome {
    position: fixed; inset: 0; pointer-events: none;
    filter: hue-rotate(calc(var(--hue) * 1deg)) contrast(calc(1 + var(--energy) * 0.4)) blur(calc(var(--residual) * 2px));
    transition: filter 0.3s;
  }
  .orb {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, hsl(var(--h, 200), 70%, 50%));
    box-shadow: 0 0 20px currentColor;
    pointer-events: auto; cursor: grab; user-select: none;
    transition: transform 0.1s, filter 0.2s;
    backdrop-filter: blur(4px);
  }
  .orb:active { cursor: grabbing; }
  #hud {
    position: fixed; bottom: 12px; left: 12px; right: 12px; font-size: 12px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px;
    pointer-events: auto; display: flex; gap: 12px; flex-wrap: wrap;
  }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #333; }
</style>
