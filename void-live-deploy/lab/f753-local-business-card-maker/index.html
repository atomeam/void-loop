<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
  :root {
    --bg: #0f1419;
    --fg: #e7ecf1;
    --accent: #3b82f6;
    --card-bg: #1e2937;
    --card-fg: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; font-weight: 600; }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    .layout { grid-template-columns: 320px 1fr; }
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  label { font-size: 0.85rem; opacity: 0.85; }
  input, select, button {
    font: inherit;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e2937;
    color: var(--fg);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { filter: brightness(1.1); }
  .preview-wrap {
    background: #0a0e13;
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    perspective: 800px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transform-style: preserve-3d;
    transition: transform 0.1s;
  }
  .actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 1rem;
  }
  .note { font-size: 0.8rem; opacity: 0.6; margin-top: 1rem; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Local business card maker · Verse lab</title>
<meta name="description" content="Job: Type your name, role, phone, email and website; see a live preview of a standard business card and download it as a clean PNG ready to print or share.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Local business card maker · Verse lab">
<meta property="og:description" content="Job: Type your name, role, phone, email and website; see a live preview of a standard business card and download it as a clean PNG ready to print or share.">
<meta property="og:url" content="https://a-to-mind.com/lab/f753-local-business-card-maker/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f753-local-business-card-maker/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<h1>Business card maker</h1>
<div class="layout">
  <form id="form">
    <label>Name
      <input id="name" type="text" placeholder="Alex Rivera" autocomplete="name">
    </label>
    <label>Title / role
      <input id="title" type="text" placeholder="Product Designer">
    </label>
    <label>Phone
      <input id="phone" type="tel" placeholder="+1 555 0100">
    </label>
    <label>Email
      <input id="email" type="email" placeholder="alex@example.com">
    </label>
    <label>Website
      <input id="web" type="url" placeholder="https://example.com">
    </label>
    <label>Theme
      <select id="theme">
        <option value="slate">Slate</option>
        <option value="blue">Blue</option>
        <option value="emerald">Emerald</option>
        <option value="amber">Amber</option>
        <option value="rose">Rose</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <div class="actions">
      <button type="button" id="download">Download PNG</button>
      <button type="button" id="copy">Copy details</button>
    </div>
  </form>
  <div>
    <div class="preview-wrap" id="preview-wrap">
      <canvas id="preview" width="525" height="300"></canvas>
    </div>
    <p class="note">Standard 3.5 × 2 inch card. Download is high-resolution (1050×600). Tilt your phone for a slight spatial preview. Everything stays on this device.</p>
  </div>
</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
<style>
/* verse design loop: kept by tools/design-loop.mjs, measured before and after */
#download { color:#191919 }
#copy { color:#191919 }
/* end verse design loop */
</style>
</body>
</html>
