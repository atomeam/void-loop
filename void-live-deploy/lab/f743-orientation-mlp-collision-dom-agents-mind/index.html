<style>
  :root { --bg: #0a0a12; --fg: #e0e0ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  .agent {
    position: absolute; width: 80px; height: 80px; border-radius: 12px;
    background: hsl(var(--h), 70%, 45%); color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; user-select: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.5); transition: background .1s; cursor: grab;
    border: 2px solid rgba(255,255,255,.3);
  }
  .agent:active { cursor: grabbing; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 100; }
  button { margin: 4px; padding: 6px 12px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  button:hover { background: #333; }
  #status { position: fixed; bottom: 12px; left: 12px; font-size: 12px; opacity: .7; }
</style>
