<meta charset="UTF-8">

<style>
:root { --bg:#0d0d0f; --fg:#e8e4dc; --accent:#7ec8e3; --card:#1a1a1e; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; height:100vh; }
#chrome { position:fixed; top:8px; left:8px; right:8px; z-index:100; display:flex; gap:12px; align-items:center; background:rgba(0,0,0,.6); padding:8px 12px; border-radius:8px; backdrop-filter:blur(4px); }
button { background:#222; color:var(--fg); border:1px solid #444; padding:4px 10px; border-radius:4px; cursor:pointer; }
button:hover { background:#333; }
#status { font-variant-numeric:tabular-nums; opacity:.8; }
#canvas { position:absolute; inset:0; z-index:0; }
#svg { position:absolute; inset:0; z-index:1; pointer-events:none; }
.card { position:absolute; width:140px; min-height:80px; background:var(--card); border:1px solid #333; border-radius:8px; padding:10px; cursor:grab; z-index:2; box-shadow:0 4px 12px rgba(0,0,0,.4); transition:box-shadow .15s; user-select:none; }
.card:active { cursor:grabbing; }
.card h3 { font-size:13px; margin-bottom:4px; color:var(--accent); }
.card p { font-size:12px; opacity:.85; }
</style>
