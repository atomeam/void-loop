<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --residual: 0.3;
    --entropy: 0.5;
    --hue: 180;
  }
  body {
    margin: 0;
    background: #0a0a12;
    color: #c0c0e0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    filter: hue-rotate(calc(var(--hue) * 1deg)) contrast(calc(1 + var(--residual) * 0.3)) blur(calc(var(--entropy) * 0.5px));
  }
  #gpu-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  #info {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(10,10,20,0.7);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .portal {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, hsla(var(--h,180), 80%, 60%, 0.9), transparent 70%);
    box-shadow: 0 0 20px hsla(var(--h,180), 80%, 50%, 0.6);
    cursor: grab;
    z-index: 5;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    backdrop-filter: blur(2px);
  }
  .portal:active { cursor: grabbing; }
  #status { margin-top: 4px; font-size: 11px; opacity: 0.8; }
</style>
