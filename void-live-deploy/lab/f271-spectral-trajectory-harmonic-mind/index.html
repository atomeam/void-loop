<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --entropy: 0.35;
    --fitness: 0.2;
    --hue: 220;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #04040c;
    color: #d0e0ff;
    font-family: system-ui, sans-serif;
    filter: hue-rotate(calc(var(--hue) * 1deg)) contrast(calc(1 + var(--fitness) * 0.15));
    transition: filter 0.7s;
  }
  #stage {
    position: absolute;
    inset: 0;
    transform: scale(calc(1 + var(--entropy) * 0.06)) perspective(900px) rotateX(calc(var(--fitness) * 5deg));
    transition: transform 0.6s;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, #0a0a20, #04040c);
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(8,8,24,0.8);
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid rgba(120,180,255,0.45);
    max-width: 360px;
    z-index: 20;
    backdrop-filter: blur(calc(3px + var(--entropy) * 10px));
    transform: scale(calc(1 + var(--fitness) * 0.08));
  }
  #hud h1 { margin: 0 0 6px; font-size: 1.05rem; }
  #status { font-size: 0.8rem; line-height: 1.45; opacity: 0.92; }
  button {
    background: #101830;
    color: #9cf;
    border: 1px solid #48a;
    padding: 6px 12px;
    margin: 6px 4px 0 0;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #1a2848; }
</style>
