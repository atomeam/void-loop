<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #0a0a12;
    --fg: #e0e0ff;
    --accent: #6cf;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; overflow: hidden;
  }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: crosshair;
  }
  .verse {
    position: absolute; pointer-events: none; font-weight: 500; white-space: nowrap;
    transition: opacity 0.4s, transform 0.3s; text-shadow: 0 0 8px rgba(100,200,255,0.6);
    mix-blend-mode: screen; user-select: none;
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.55);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  }
  #controls {
    position: absolute; bottom: 12px; left: 12px; z-index: 10; display: flex; gap: 8px;
  }
  button {
    background: #222; color: var(--fg); border: 1px solid #444; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #333; }
  #status { position: absolute; bottom: 12px; right: 12px; font-size: 12px; opacity: 0.7; }
</style>
