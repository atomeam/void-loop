<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --hue: 200;
  --scale: 1;
  --cx: 50vw;
  --cy: 50vh;
}
body {
  margin: 0;
  background: #080812;
  color: #d0d0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
}
#hud {
  position: fixed;
  left: var(--cx);
  top: var(--cy);
  transform: translate(-50%, -50%) scale(var(--scale));
  z-index: 10;
  background: rgba(16,16,36,0.75);
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid hsla(var(--hue), 75%, 65%, 0.6);
  backdrop-filter: blur(10px);
  transition: left 0.4s, top 0.4s, transform 0.3s, border-color 0.3s;
  pointer-events: auto;
  max-width: 280px;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}
button {
  background: #252550;
  color: #fff;
  border: 1px solid #5a5aaa;
  padding: 6px 12px;
  border-radius: 6px;
  margin: 4px 4px 0 0;
  cursor: pointer;
}
button:hover { background: #353570; }
#status { font-size: 0.85rem; opacity: 0.85; margin-top: 8px; }
.note { font-size: 0.72rem; margin-top: 8px; opacity: 0.65; line-height: 1.3; }
</style>
