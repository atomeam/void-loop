<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --border-w: 4px;
  --hue: 220;
  --card-scale: 1;
  --card-x: 20px;
  --card-y: 20px;
  --bg: #0a0a12;
}
body {
  margin: 0;
  background: var(--bg);
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  border: var(--border-w) solid hsl(var(--hue), 70%, 50%);
  transition: border-width 0.3s, border-color 0.5s, background 0.5s;
  box-sizing: border-box;
  height: 100vh;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
#card {
  position: fixed;
  left: var(--card-x);
  top: var(--card-y);
  transform: scale(var(--card-scale));
  transform-origin: top left;
  background: rgba(10, 10, 20, 0.85);
  border: 1px solid hsl(var(--hue), 60%, 60%);
  padding: 12px 16px;
  border-radius: 8px;
  backdrop-filter: blur(4px);
  transition: transform 0.4s, border-color 0.5s;
  max-width: 280px;
  z-index: 10;
}
#card h3 { margin: 0 0 8px; font-size: 1rem; }
#status { font-size: 0.9rem; min-height: 1.2em; }
button {
  background: hsl(var(--hue), 50%, 40%);
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 8px;
}
button:hover { filter: brightness(1.2); }
#seals { font-size: 0.75rem; margin-top: 8px; max-height: 100px; overflow-y: auto; }
#fallback-note { position: fixed; bottom: 10px; left: 10px; font-size: 0.8rem; opacity: 0.7; }
</style>
