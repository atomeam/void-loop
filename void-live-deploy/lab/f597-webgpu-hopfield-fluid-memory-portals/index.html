<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --entropy: 0.3;
  --energy: 0.4;
  --bg1: hsl(220, 40%, calc(8% + var(--energy) * 12%));
  --bg2: hsl(calc(200 + var(--entropy) * 80), 50%, 12%);
  --accent: hsl(calc(180 + var(--entropy) * 120), 70%, 55%);
}
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 30% 20%, var(--bg1), var(--bg2)); font-family: system-ui, sans-serif; color: #eee; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#portals { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.portal {
  position: absolute; width: 140px; height: 90px; border-radius: 12px;
  background: rgba(20, 30, 50, 0.75); border: 1px solid var(--accent);
  backdrop-filter: blur(4px); padding: 8px; font-size: 12px; color: #ddd;
  transform: translate(-50%, -50%); pointer-events: auto; cursor: grab;
  transition: border-color 0.3s, box-shadow 0.3s;
  box-shadow: 0 0 calc(var(--energy) * 20px) var(--accent);
}
.portal:active { cursor: grabbing; }
#hud {
  position: fixed; top: 12px; left: 12px; z-index: 2; font-size: 13px;
  background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px;
  pointer-events: none;
}
#controls { position: fixed; bottom: 12px; left: 12px; z-index: 2; }
button { margin-right: 8px; padding: 6px 12px; background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
</style>
