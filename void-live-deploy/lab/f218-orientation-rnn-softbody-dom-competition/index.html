<style>
:root { --bg:#050510; --card:#0c1028; --accent:#7aa2ff; }
html,body{margin:0;height:100%;background:var(--bg);color:#e0e4ff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;max-width:280px;z-index:10;pointer-events:none}
.agent-card{pointer-events:auto;background:rgba(12,16,40,.75);backdrop-filter:blur(8px);border:1px solid rgba(122,162,255,.3);

.agent-card.leader{border-color:#ffd27a;box-shadow:0 0 12px rgba(255,210,122,.4)}
.agent-card h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
#controls{position:fixed;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:10}
button{background:#1a2048;color:#cfd6ff;border:1px solid #445;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
button:hover{background:#252c60}
#status{position:fixed;left:12px;bottom:12px;font-size:11px;opacity:.7;max-width:400px}
