<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root {
  --bg: #0f1419;
  --fg: #e7ecf1;
  --muted: #8b9bb4;
  --accent: #5eead4;
  --card: #1a2332;
  --border: #2d3a4f;
  --danger: #f87171;
  --ok: #4ade80;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { padding: 16px; max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
h2 { font-size: 1.05rem; margin: 0 0 10px; }
label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
input[type="text"], input[type="number"], select {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #111827; color: var(--fg); font-size: 1rem;
}
input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 120px; }
button {
  background: var(--accent); color: #0f1419; border: 0; border-radius: 8px; padding: 10px 14px;
  font-weight: 600; cursor: pointer; font-size: 0.95rem;
}
button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.person-chip {
  background: #243044; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 12px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem;
}
.item {
  border-bottom: 1px solid var(--border); padding: 10px 0;
}
.item:last-child { border-bottom: 0; }
.item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.assignees { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.assignee {
  font-size: 0.8rem; padding: 2px 8px; border-radius: 999px; background: #1e3a2f; color: var(--ok);
}
.totals { font-variant-numeric: tabular-nums; }
.total-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
.total-row.grand { font-weight: 700; font-size: 1.1rem; border-bottom: 0; color: var(--accent); }
.copy-area { width: 100%; min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1e3a2f; color: var(--ok);
  padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { color: var(--muted); font-style: italic; padding: 8px 0; }
@media (max-width: 480px) {
  .row > * { min-width: 100%; }
}
</style>

<body>
<h1>Bill splitter</h1>
<p class="sub">Assign items to people, share tax and tip fairly, copy the totals.</p>

<section>
  <h2>People</h2>
  <div class="row">
    <div>
      <label for="new-person">Add person</label>
      <input id="new-person" type="text" placeholder="Name" autocomplete="off">
    </div>
    <button id="add-person" type="button">Add</button>
  </div>
  <div id="people-list" class="people"></div>
</section>

<section>
  <h2>Items</h2>
  <div class="row">
    <div>
      <label for="item-name">Item</label>
      <input id="item-name" type="text" placeholder="Pizza, drinks…">
    </div>
    <div>
      <label for="item-price">Price</label>
      <input id="item-price" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <button id="add-item" type="button">Add item</button>
  </div>
  <div id="items-list"></div>
</section>

<section>
  <h2>Tax & tip</h2>
  <div class="row">
    <div>
      <label for="tax">Tax %</label>
      <input id="tax" type="number" step="0.1" min="0" value="8.5">
    </div>
    <div>
      <label for="tip">Tip %</label>
      <input id="tip" type="number" step="1" min="0" value="18">
    </div>
    <div>
      <label for="share-mode">Share tax & tip</label>
      <select id="share-mode">
        <option value="proportional">By item subtotal</option>
        <option value="equal">Equally among people</option>
      </select>
    </div>
  </div>
</section>

<section>
  <h2>Totals</h2>
  <div id="totals" class="totals"></div>
  <div class="row" style="margin-top:12px">
    <button id="copy" type="button" class="secondary">Copy breakdown</button>
    <button id="csv" type="button" class="secondary">Download CSV</button>
    <button id="clear" type="button" class="danger">Clear all</button>
  </div>
</section>

<div id="toast" class="toast">Copied</div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
