<style>
  :root { --hue: 220; --contrast: 1.1; --scale: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; color: #e0e0ff; font-family: system-ui, sans-serif; }
  body { filter: hue-rotate(calc(var(--hue) * 1deg)) contrast(var(--contrast)) ; transform: scale(var(--scale)); transform-origin: center; }
  canvas { display: block; width: 100%; height: 100%; background: #000; }

  #ui button, #ui .portal { pointer-events: auto; }
  button { background: #222244; color: #aaf; border: 1px solid #44a; padding: 4px 10px; border-radius: 4px; cursor: pointer; margin: 2px; }
  button:hover { background: #334466; }
  .portal { position: fixed; background: rgba(40,20,80,0.85); border: 1px solid #88f; border-radius: 12px; padding: 6px 10px; font-size: 12px; cursor: pointer; z-index: 20; animation: float 3s ease-in-out infinite; box-shadow: 0 0 12px #448; transition: transform 0.2s; }
  .portal:hover { transform: scale(1.1); }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  #status { margin-top: 6px; opacity: 0.8; }
</style>
