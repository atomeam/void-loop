<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root { --bg:#05050a; --portal:#0ff; --text:#e0e0ff; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; }
#stage { position:relative; width:100vw; height:100vh; perspective:800px; transform-style:preserve-3d; }
.agent {
  position:absolute; width:90px; height:90px; border-radius:18px;
  background:radial-gradient(circle at 30% 30%, rgba(0,255,255,.35), rgba(0,0,40,.6));
  border:1px solid rgba(0,255,255,.4); box-shadow:0 0 20px rgba(0,255,255,.25);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;
  cursor:pointer; user-select:none; will-change:transform,filter,border-radius;
  transition:box-shadow .15s;
}
.agent:hover { box-shadow:0 0 32px rgba(0,255,255,.55); }
#hud {
  position:fixed; bottom:12px; left:12px; right:12px; z-index:10;
  display:flex; gap:8px; flex-wrap:wrap; pointer-events:none;
}
button, .info {
  pointer-events:auto; background:#111; color:#0ff; border:1px solid #0ff4;
  border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
}
.info { cursor:default; opacity:.85; }
#status { position:fixed; top:10px; left:10px; font-size:12px; opacity:.7; z-index:10; }
</style>
