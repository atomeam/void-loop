<style>
:root { --bg:#0a0c10; --card:#1a1e28; --accent:#7af; --text:#e0e4ee; }
* { box-sizing: border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; height:100vh; }
#canvas { position:absolute; inset:0; z-index:0; }
#stage { position:absolute; inset:0; z-index:1; }
.card {
  position:absolute; width:90px; height:60px; background:rgba(30,40,60,.85);
  border:1px solid #4af; border-radius:10px; display:flex; align-items:center;
  justify-content:center; font-size:12px; cursor:pointer; user-select:none;
  backdrop-filter:blur(4px); transition:transform .15s, background .3s;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.card:hover { border-color:#af7; }
#hud {
  position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,.6);
  padding:10px 14px; border-radius:10px; font-size:13px; max-width:280px;
}
button { margin:4px 4px 0 0; padding:6px 10px; background:#222; color:#eee;
  border:1px solid #555; border-radius:6px; cursor:pointer; }
button:hover { background:#333; }
#status { font-size:11px; color:#8f8; margin-top:4px; }
