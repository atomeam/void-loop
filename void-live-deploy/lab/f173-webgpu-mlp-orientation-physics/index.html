<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050508;
    color: #d8d4cc;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.6rem 1rem;
    background: rgba(10,10,14,0.85);
    backdrop-filter: blur(8px);
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
  }
  h1 { margin: 0; font-size: 0.9rem; font-weight: 500; }
  #status { opacity: 0.7; }
  canvas { flex: 1; width: 100%; display: block; touch-action: none; }
  #controls {
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    z-index: 20;
    background: rgba(0,0,0,0.6);
    padding: 0.4rem;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }
  button {
    background: #1a1a22;
    color: #eee;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    font-size: 0.7rem;
    cursor: pointer;
  }
  button:active { background: #2a2a3a; }
  #info {
    position: absolute;
    top: 3.5rem;
    left: 0.8rem;
    right: 0.8rem;
    font-size: 0.65rem;
    opacity: 0.55;
    text-align: center;
    pointer-events: none;
    z-index: 15;
  }
  .dom-attractor {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle, hsla(180,70%,50%,0.4), transparent 70%);
    border: 1px solid hsla(180,80%,60%,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    pointer-events: auto;
    z-index: 10;
    cursor: grab;
    user-select: none;
  }
  .dom-attractor.dragging { cursor: grabbing; opacity: 0.8; }
</style>
