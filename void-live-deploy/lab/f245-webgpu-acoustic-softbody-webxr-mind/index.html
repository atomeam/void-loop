<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
:root {
  --bg: #050510;
  --fg: #d0e0ff;
  --accent: #6af;
  --hue: 220;
  --blur: 0px;
  --contrast: 1;
  --strain: 0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: hsl(var(--hue), 20%, 5%);
  color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden;
  filter: blur(var(--blur)) contrast(var(--contrast));
  transition: filter 0.4s, background 0.6s;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: absolute; z-index: 10; padding: 10px; pointer-events: none; }
.ui > * { pointer-events: auto; }
button, .status {
  background: rgba(10,10,30,0.85); color: var(--fg); border: 1px solid #334;
  border-radius: 6px; padding: 7px 11px; margin: 3px; font-size: 13px;
}
button:hover { border-color: var(--accent); }
.status { font-size: 11px; opacity: 0.85; max-width: 320px; }
.anchors { position: absolute; inset: 0; pointer-events: none; }
.anchor {
  position: absolute; width: 72px; height: 42px;
  background: hsla(var(--hue), 40%, 18%, 0.9);
  border: 1px solid hsl(var(--hue), 70%, 60%);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; pointer-events: auto; cursor: grab;
  transform: translate(-50%, -50%) scale(1);
  transition: transform 0.15s, filter 0.2s, border-color 0.2s;
}
.anchor.hot { border-color: #f66; filter: brightness(1.4); }
</style>
