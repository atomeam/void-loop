<!DOCTYPE html>
<html lang="en" class="vs-tool"><link rel="stylesheet" href="/verse.css" media="screen">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 600; color: var(--soft); }
  textarea { width: 100%; max-width: 40rem; height: 10rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  /* the canvas is a paper sheet; it stays white so a print or PNG is a label */
  #preview { border: 1px solid var(--line); margin-top: 1rem; background: #fff; max-width: 100%; }
  @media print { .controls { display: none; } }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Label and name tag sheet · Verse lab</title>
<meta name="description" content="Job: Paste names, pick a label size, get a printable sheet of name tags or labels to download as PNG.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Label and name tag sheet · Verse lab">
<meta property="og:description" content="Job: Paste names, pick a label size, get a printable sheet of name tags or labels to download as PNG.">
<meta property="og:url" content="https://a-to-mind.com/lab/f639-label-name-tag-sheet/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f639-label-name-tag-sheet/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<link rel="stylesheet" href="/lab/tool-theme.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<main class="vs-page">
<h1>Label and name tag sheet</h1>
<p class="lead">Paste names (one per line). Choose a size. Download a printable sheet as PNG, or print this page.</p>
<div class="controls">
  <label for="names">Names</label>
  <textarea id="names" placeholder="Alice&#10;Bob&#10;Carol&#10;..."></textarea>
  <div class="row">
    <div>
      <label for="size">Label size</label>
      <select id="size">
        <option value="2x1">2" × 1" (30 per letter page)</option>
        <option value="3.5x2">3.5" × 2" (name tags, 10 per page)</option>
        <option value="1x0.5">1" × 0.5" (80 per page)</option>
        <option value="4x2">4" × 2" (badges, 8 per page)</option>
      </select>
    </div>
    <div>
      <label for="fontSize">Font size (px)</label>
      <input type="number" id="fontSize" value="24" min="8" max="72">
    </div>
    <div>
      <label for="bg">Background</label>
      <input type="color" id="bg" value="#ffffff">
    </div>
    <div>
      <label for="fg">Text color</label>
      <input type="color" id="fg" value="#000000">
    </div>
  </div>
  <button class="primary" id="gen" style="margin-top:1rem">Generate sheet</button>
  <button class="secondary" id="dl" disabled>Download PNG</button>
</div>
<canvas id="preview" width="816" height="1056"></canvas>
<p class="note">Sheet is sized for US Letter (8.5" × 11" at 96 dpi). Print at 100% scale. Works offline. Nothing is sent anywhere.</p>
</main>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
