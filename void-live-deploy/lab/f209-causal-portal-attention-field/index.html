<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --hue: 200;
    --scale: 1;
    --blur: 0px;
    --portal-glow: 0;
  }
  html, body {
    margin: 0; height: 100%; background: #0a0a12; color: #e0e0ff;
    font-family: system-ui, sans-serif; overflow: hidden;
    transform: scale(var(--scale)); transform-origin: center;
    filter: hue-rotate(calc(var(--hue) * 1deg)) blur(var(--blur));
    transition: filter 0.4s, transform 0.3s;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 12px; background: rgba(10,10,20,0.7);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; pointer-events: none;
    border: 1px solid rgba(100,150,255,0.3);
  }
  .portal-marker {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid rgba(100,200,255,0.6); background: rgba(80,160,255,0.15);
    pointer-events: none; transform: translate(-50%, -50%);
    box-shadow: 0 0 calc(var(--portal-glow) * 20px) rgba(100,180,255,0.5);
  }
  button {
    position: fixed; bottom: 16px; right: 16px; background: #1a2a4a; color: #cce;
    border: 1px solid #4af; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
</style>
