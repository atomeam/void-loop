<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --hue: 200;
  --contrast: 1.1;
  --blur: 0px;
  --perspective: 800px;
  --rx: 0deg;
  --ry: 0deg;
  --scale: 1;
}
body {
  margin: 0;
  background: #0a0a12;
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  filter: hue-rotate(var(--hue)) contrast(var(--contrast)) blur(var(--blur));
  perspective: var(--perspective);
}
#stage {
  position: absolute;
  inset: 0;
  transform: rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--scale));
  transform-style: preserve-3d;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}
#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
  z-index: 10;
}
#status { font-weight: bold; }
button {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 20;
  padding: 8px 16px;
  background: #223;
  color: #fff;
  border: 1px solid #445;
  border-radius: 6px;
  cursor: pointer;
}
</style>
