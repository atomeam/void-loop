<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<style>
  :root { --fit: 0.4; --div: 0.5; --hue: 200; }
  body { margin: 0; background: #0a0c10; color: #e0e6ef; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #arena { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .agent {
    position: absolute; width: 72px; height: 48px; border-radius: 8px;
    background: hsla(var(--hue), 60%, 40%, 0.85); border: 2px solid #fff4;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
    pointer-events: auto; cursor: grab; user-select: none; transition: filter 0.2s;
    box-shadow: 0 4px 12px #0008;
  }
  .agent.champ { border-color: #ffd700; box-shadow: 0 0 16px #ffd70088; }
  .energy {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #4af 0%, #08f0 70%); pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 2; background: #1118; backdrop-filter: blur(8px);
    padding: 12px 16px; border-radius: 12px; max-width: 320px; pointer-events: auto;
  }
  button, input { margin: 4px 4px 4px 0; padding: 6px 10px; background: #223; color: #eee; border: 1px solid #446; border-radius: 6px; }
  button:hover { background: #334; }
  #status { font-size: 12px; opacity: 0.8; margin-top: 6px; }
  #chrome { position: fixed; inset: 0; pointer-events: none; z-index: 0; border: 8px solid hsla(var(--hue), 50%, 30%, var(--fit)); transition: border-color 0.4s; }
</style>
