<style>
:root { --speed: 0; --hue: 200; }
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#stage { position:relative; width:100vw; height:100vh; }
.portal {
  position:absolute; width:72px; height:72px; border-radius:18px;
  background:hsl(var(--hue),70%,55%); border:2px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; font-size:11px;
  pointer-events:none; transition:background .3s; will-change:transform;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
#chrome {
  position:absolute; inset:12px; border:3px solid hsl(var(--hue),40%,40%);
  border-radius:calc(24px + var(--speed) * 40px); pointer-events:none;
  opacity:calc(0.3 + var(--speed) * 0.4); transition:border-radius .4s;
}
#ui {
  position:absolute; top:12px; left:12px; background:rgba(0,0,0,.6); padding:8px 12px;
  border-radius:8px; font-size:13px; z-index:10; max-width:280px;
}
button { margin:4px 4px 0 0; padding:4px 10px; background:#223; color:#fff; border:1px solid #445; border-radius:4px; cursor:pointer; }
button:hover { background:#334; }
#status { font-size:11px; opacity:.8; margin-top:4px; }
</style>
