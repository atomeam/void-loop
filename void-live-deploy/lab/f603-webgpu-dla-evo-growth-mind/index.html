<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --entropy: 0.5;
    --size: 0.3;
    --hue: 200;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: hsl(var(--hue), 40%, calc(8% + var(--entropy)*12%));
    color: #e0e0e0; font-family: system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .seed {
    position: absolute; width: 80px; height: 60px; border-radius: 12px;
    background: hsla(var(--hue), 70%, 55%, 0.85); color: #111;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    cursor: grab; user-select: none; box-shadow: 0 4px 12px rgba(0,0,0,.4);
    transition: transform .15s, background .3s;
    z-index: 10;
  }
  .seed:active { cursor: grabbing; }
  .ui {
    position: fixed; bottom: 16px; left: 16px; z-index: 20;
    background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; backdrop-filter: blur(4px);
  }
  button {
    margin: 0 6px; padding: 6px 12px; border: none; border-radius: 6px;
    background: #4a9; color: #111; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #6cB; }
  #status { margin-top: 6px; opacity: .8; }
</style>
