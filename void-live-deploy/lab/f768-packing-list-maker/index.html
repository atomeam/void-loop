<body>
<h1>Packing list maker</h1>
<p class="subtitle">Enter your trip details. Get a checklist to tick off. Saved on this device. Copy when ready.</p>

<form id="form">
  <label for="days">Trip length (days)</label>
  <input type="number" id="days" min="1" max="90" value="7">

  <label for="weather">Weather</label>
  <select id="weather">
    <option value="mild">Mild</option>
    <option value="hot">Hot</option>
    <option value="cold">Cold</option>
    <option value="rainy">Rainy</option>
  </select>

  <label for="type">Kind of trip</label>
  <select id="type">
    <option value="city">City</option>
    <option value="beach">Beach</option>
    <option value="hiking">Hiking</option>
    <option value="business">Business</option>
    <option value="camping">Camping</option>
  </select>

  <label for="custom">Custom items (one per line, optional)</label>
  <textarea id="custom" rows="3" placeholder="passport\ncharger\nbook"></textarea>

  <button type="button" id="generate">Update list</button>
</form>

<div id="list"></div>
<div class="actions">
  <button type="button" id="copy" class="secondary">Copy list</button>
  <button type="button" id="clear" class="secondary">Clear checks</button>
</div>
<div id="status"></div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
