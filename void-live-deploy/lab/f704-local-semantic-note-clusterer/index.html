<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
#controls { padding: 12px; background: #222; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { width: 100%; height: 100px; background: #333; color: #eee; border: 1px solid #555; }
canvas { display: block; background: #000; touch-action: none; }
#labels { position: absolute; top: 0; left: 0; pointer-events: none; }
.label { position: absolute; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: grab; }
button, input { background: #444; color: #eee; border: 1px solid #666; padding: 6px 12px; border-radius: 4px; }
.cluster-0 { border-color: #4fc3f7; }
.cluster-1 { border-color: #81c784; }
.cluster-2 { border-color: #ffb74d; }
.cluster-3 { border-color: #e57373; }
.cluster-4 { border-color: #ba68c8; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Local semantic note clusterer · Verse lab</title>
<meta name="description" content="A previously unused primary substrate for The Verse canvas: pure client-side semantic clustering of user notes via local character n-gram embeddings and cosine">

<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<div id="controls">
  <button id="clusterBtn">Cluster notes</button>
  <label>Threshold <input type="range" id="thresh" min="0.1" max="0.9" step="0.05" value="0.35"></label>
  <button id="dlMd">Download Markdown</button>
  <button id="dlJson">Download JSON</button>
  <span id="status">Paste notes below, one per line.</span>
</div>
<textarea id="notes" placeholder="One note or idea per line&#10;Meeting tomorrow about Q3 budget&#10;Buy groceries: milk eggs bread&#10;Idea for new feature: offline sync&#10;Call mom this weekend"></textarea>
<div style="position:relative;">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="labels"></div>
</div>
<script src="app.js"></script>
<h1 class="vl-sr">Local semantic note clusterer</h1>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
