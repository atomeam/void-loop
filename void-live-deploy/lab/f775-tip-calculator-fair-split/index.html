<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --accent:#4cc9f0; --muted:#8b9bb4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:1rem; }
  .card { background:var(--card); border-radius:16px; padding:1.5rem; max-width:420px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  h1 { margin:0 0 1rem; font-size:1.4rem; }
  label { display:block; margin:.75rem 0 .25rem; font-size:.9rem; color:var(--muted); }
  input, select { width:100%; padding:.6rem .75rem; border-radius:8px; border:1px solid #2a3a50; background:#0d1117; color:var(--text); font-size:1rem; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  button { margin-top:1rem; width:100%; padding:.75rem; border:0; border-radius:8px; background:var(--accent); color:#041016; font-weight:600; font-size:1rem; cursor:pointer; }
  button:active { transform:scale(.98); }
  #out { margin-top:1.25rem; padding:1rem; background:#0d1117; border-radius:8px; font-variant-numeric:tabular-nums; line-height:1.5; min-height:4rem; }
  .muted { color:var(--muted); font-size:.85rem; }
  .share { margin-top:.5rem; font-size:.85rem; word-break:break-all; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Tip calculator · Verse lab</title>
<meta name="description" content="Job: Someone enters a bill amount, tip percent, tax, and number of people; they get clear per-person totals (with rounding options) they can copy or share via link.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Tip calculator · Verse lab">
<meta property="og:description" content="Job: Someone enters a bill amount, tip percent, tax, and number of people; they get clear per-person totals (with rounding options) they can copy or share via link.">
<meta property="og:url" content="https://a-to-mind.com/lab/f775-tip-calculator-fair-split/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f775-tip-calculator-fair-split/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<div class="card">
  <h1>Tip calculator</h1>
  <div class="row">
    <div>
      <label for="bill">Bill amount</label>
      <input id="bill" type="number" min="0" step="0.01" value="50" inputmode="decimal">
    </div>
    <div>
      <label for="tip">Tip %</label>
      <input id="tip" type="number" min="0" step="0.1" value="18" inputmode="decimal">
    </div>
  </div>
  <div class="row">
    <div>
      <label for="tax">Tax %</label>
      <input id="tax" type="number" min="0" step="0.1" value="0" inputmode="decimal">
    </div>
    <div>
      <label for="people">People</label>
      <input id="people" type="number" min="1" step="1" value="2" inputmode="numeric">
    </div>
  </div>
  <label>Rounding</label>
  <select id="round">
    <option value="none">Exact</option>
    <option value="nearest">Nearest cent</option>
    <option value="up">Round up to cent</option>
  </select>
  <button id="calc">Calculate</button>
  <div id="out"></div>
  <button id="copy" style="background:#2a3a50;color:var(--text);margin-top:.5rem">Copy breakdown</button>
  <div class="share muted" id="share"></div>
</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
