<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --acc:#4da3ff; --card:#1a1d24; --border:#2a2e36; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); line-height:1.4; }
header { padding:1rem; text-align:center; border-bottom:1px solid var(--border); }
h1 { margin:0; font-size:1.4rem; }
.container { max-width:640px; margin:0 auto; padding:1rem; }
label { display:block; margin:.6rem 0 .2rem; font-size:.9rem; opacity:.8; }
input, select, button { width:100%; padding:.6rem; font-size:1rem; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--fg); }
button { background:var(--acc); color:#000; font-weight:600; cursor:pointer; margin-top:.5rem; }
button.secondary { background:transparent; color:var(--acc); border-color:var(--acc); }
.results { margin-top:1rem; background:var(--card); border-radius:8px; padding:.8rem; }
.result-row { display:flex; justify-content:space-between; padding:.3rem 0; border-bottom:1px solid var(--border); }
.result-row:last-child { border:0; }
.unit { opacity:.7; }
.value { font-variant-numeric: tabular-nums; }
.actions { display:flex; gap:.5rem; margin-top:1rem; }
.actions button { flex:1; }
#toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#333; padding:.5rem 1rem; border-radius:4px; display:none; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Unit converter · Verse lab</title>
<meta name="description" content="Job: Pick a category (length, weight, volume, temperature, area, speed, time, data), enter a number in one unit, and see it converted live into all the others.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Unit converter · Verse lab">
<meta property="og:description" content="Job: Pick a category (length, weight, volume, temperature, area, speed, time, data), enter a number in one unit, and see it converted live into all the others.">
<meta property="og:url" content="https://a-to-mind.com/lab/f651-unit-converter/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f651-unit-converter/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Unit converter</h1>
  <p>Convert length, weight, volume, temperature and more. Offline, nothing sent.</p>
</header>
<div class="container">
  <label for="cat">Category</label>
  <select id="cat"></select>

  <label for="val">Value</label>
  <input type="number" id="val" step="any" placeholder="Enter a number" value="1">

  <label for="from">From unit</label>
  <select id="from"></select>

  <div class="results" id="results"></div>

  <div class="actions">
    <button id="copy">Copy summary</button>
    <button id="csv" class="secondary">Download CSV</button>
  </div>
</div>
<div id="toast">Copied</div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
