<!DOCTYPE html>
<html lang="en" class="vs-tool"><link rel="stylesheet" href="/verse.css" media="screen">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
@media (max-width: 700px) { .controls { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
.list-item { display: flex; gap: 0.4rem; align-items: center; }
.list-item input { flex: 1; }
.settings { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: 1rem 0; }
.settings label { display: flex; align-items: center; gap: 0.4rem; color: var(--soft); }
.settings input[type=number] { width: 5rem; }
.rota { overflow-x: auto; margin-top: 1rem; }
table { min-width: 600px; }
.person { font-weight: 500; }
.actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; padding-left: 13rem; }
@media (max-width: 700px) { .actions { padding-left: 0; padding-bottom: 3.5rem; } }
@media print {
  .controls, .settings, .actions, .lead { display: none !important; }
}
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Chore rota · Verse lab</title>
<meta name="description" content="A practical household chore rota generator. Add people and chores. Instantly see a multi-week rotating schedule where assignments cycle fairly.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Chore rota · Verse lab">
<meta property="og:description" content="A practical household chore rota generator. Add people and chores. Instantly see a multi-week rotating schedule where assignments cycle fairly.">
<meta property="og:url" content="https://a-to-mind.com/lab/f631-chore-rota/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f631-chore-rota/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<link rel="stylesheet" href="/lab/tool-theme.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<main class="vs-page">
<h1>Chore rota</h1>
<p class="lead">Add people and chores. Get a fair rotating weekly schedule. Download or print.</p>

<div class="controls">
  <div class="card">
    <h2>People</h2>
    <div id="people-list" class="list"></div>
    <button class="add-btn" id="add-person">+ Add person</button>
  </div>
  <div class="card">
    <h2>Chores</h2>
    <div id="chores-list" class="list"></div>
    <button class="add-btn" id="add-chore">+ Add chore</button>
  </div>
</div>

<div class="settings">
  <label>Weeks to show: <input type="number" id="weeks" min="1" max="12" value="4"></label>
  <label>Start week offset: <input type="number" id="offset" min="0" max="20" value="0"></label>
</div>

<div id="rota-container" class="rota"></div>

<div class="actions">
  <button class="primary" id="download">Download PNG</button>
  <button class="secondary" id="print">Print</button>
  <button class="secondary" id="reset">Reset lists</button>
</div>

<canvas id="export-canvas" style="display:none"></canvas>
</main>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
