<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --border-w: 4px;
  --border-r: 16px;
  --hue: 200;
  --card-scale: 1;
  --card-rot: 0deg;
  --bg: #0a0a12;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  transition: background 0.4s;
}
#canvas-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  border: var(--border-w) solid hsl(var(--hue), 70%, 50%);
  border-radius: var(--border-r);
  overflow: hidden;
  transition: border-radius 0.3s, border-width 0.3s, border-color 0.3s;
}
canvas { display: block; width: 100%; height: 100%; background: #050508; }
#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(10,10,20,0.75);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  pointer-events: none;
  max-width: 280px;
}
#mind-card {
  position: absolute;
  bottom: 24px;
  right: 24px;
  background: rgba(20,20,40,0.85);
  border: 1px solid hsl(var(--hue), 60%, 40%);
  border-radius: 12px;
  padding: 12px 16px;
  transform: scale(var(--card-scale)) rotate(var(--card-rot));
  transition: transform 0.4s, border-color 0.4s;
  pointer-events: auto;
  max-width: 260px;
}
button {
  background: hsl(var(--hue), 50%, 30%);
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  margin: 4px 4px 0 0;
  cursor: pointer;
  font-size: 12px;
}
button:hover { filter: brightness(1.2); }
#seals { font-size: 11px; margin-top: 8px; max-height: 80px; overflow-y: auto; }
.note { font-size: 11px; opacity: 0.7; }
</style>
