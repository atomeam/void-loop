<!DOCTYPE html>

<meta charset="UTF-8">

<style>
  :root { --hue: 220; --sat: 45%; --lit: 7%; --glow: 0.3; }
  body { margin: 0; background: hsl(var(--hue), var(--sat), var(--lit)); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #ui { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.65); padding: 10px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; backdrop-filter: blur(6px); }
  .anchor { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: hsla(var(--ah), 75%, 55%, .65); border: 2px solid rgba(255,255,255,.5); cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 9px; text-align: center; user-select: none; transform: translate(-50%, -50%); box-shadow: 0 0 16px hsla(var(--ah), 80%, 60%, calc(var(--glow) * 0.7)); }
  .anchor:active { cursor: grabbing; }
  #seal { position: absolute; bottom: 12px; right: 12px; padding: 8px 16px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #seal:hover { background: #2a2a2a; }
  #status { position: absolute; bottom: 12px; left: 12px; font-size: 11px; opacity: .7; }
</style>
