<style>
:root { --bg: #0a0a12; --fg: #e0e0ff; --accent: #6d4aff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
#ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(10,10,18,0.7); padding: 12px; border-radius: 8px; backdrop-filter: blur(4px); max-width: 280px; }
button { background: var(--accent); color: white; border: 0; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin: 2px; }
button:disabled { opacity: 0.5; }
.card { position: absolute; width: 140px; min-height: 70px; background: rgba(109,74,255,0.25); border: 1px solid var(--accent); border-radius: 8px; padding: 8px; z-index: 5; cursor: grab; transition: transform 0.3s, opacity 0.3s; backdrop-filter: blur(2px); font-size: 12px; }
.card:active { cursor: grabbing; }
#status { font-size: 12px; margin-top: 8px; opacity: 0.8; }
</style>
