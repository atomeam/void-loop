<style>
  :root { --bg:#0a0a12; --fg:#e8e8f0; --accent:#7af; --card:#1a1a28; }

  .card { position:absolute; min-width:72px; padding:8px 10px; background:var(--card); border:1px solid #445; border-radius:6px; cursor:grab; user-select:none; z-index:5; font-size:12px; box-shadow:0 4px 12px rgba(0,0,0,.4); transition:transform .15s; }
  .card:active { cursor:grabbing; }
  .card.pinned { border-color:#f80; box-shadow:0 0 8px #f80; }
  #status { font-size:11px; opacity:.8; margin-top:6px; }
