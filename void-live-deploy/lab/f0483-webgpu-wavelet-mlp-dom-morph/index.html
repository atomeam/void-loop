#controls { position:fixed; bottom:12px; left:12px; z-index:10; display:flex; gap:8px; }
button { background:#222; color:#fff; border:1px solid #555; padding:6px 10px; border-radius:6px; cursor:pointer; }
canvas { position:absolute; inset:0; pointer-events:none; opacity:0.4; }
#status { position:fixed; top:8px; left:8px; font-size:12px; opacity:0.7; }
