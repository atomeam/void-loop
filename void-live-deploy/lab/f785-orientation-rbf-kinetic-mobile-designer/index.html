<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
body { margin:0; background:#111; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
#stage { position:relative; width:100vw; height:70vh; perspective:800px; background:radial-gradient(#222,#000); }
.arm { position:absolute; left:50%; top:50%; width:4px; height:120px; background:#aaa; transform-origin:top center; transform-style:preserve-3d; }
.node { position:absolute; bottom:-20px; left:-18px; width:40px; height:40px; border-radius:50%; background:#48f; cursor:grab; box-shadow:0 4px 12px #000; }
.controls { padding:12px; background:#1a1a1a; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button, input, select { padding:8px 12px; background:#333; color:#fff; border:1px solid #555; border-radius:6px; }
button:hover { background:#444; }
#status { font-size:12px; opacity:0.7; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Kinetic Mobile Designer · Verse lab</title>
<meta name="description" content="A useful design tool for The Verse: a hierarchical CSS 3D kinetic mobile (nested absolute divs with transform-style: preserve-3d) whose node positions, rotations">

</head>
<body>
<div id="stage"></div>
<div class="controls">
  <label>Arms: <input type="range" id="arms" min="3" max="7" value="5"></label>
  <label>Color: <input type="color" id="color" value="#4488ff"></label>
  <button id="seal">Seal Design</button>
  <button id="downloadCss">Download CSS</button>
  <button id="downloadPng">Download PNG</button>
  <button id="copyCss">Copy CSS</button>

</div>
