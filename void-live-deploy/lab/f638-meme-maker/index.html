<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
  :root { --bg:#111; --fg:#eee; --accent:#4a9eff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; padding:12px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }
  label { font-size:0.85rem; }
  input[type=text], input[type=number], input[type=color], select, button {
    background:#222; color:var(--fg); border:1px solid #444; border-radius:6px; padding:6px 10px; font:inherit;
  }
  button { background:var(--accent); color:#000; border:none; cursor:pointer; font-weight:600; }
  button.secondary { background:#333; color:var(--fg); }
  #wrap { position:relative; margin:12px 0; max-width:100%; }
  canvas { display:block; max-width:100%; height:auto; background:#000; border-radius:8px; touch-action:none; cursor:move; }
  .hint { font-size:0.8rem; opacity:0.7; margin-top:4px; }
  .hidden { display:none; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Meme maker · Verse lab</title>
<meta name="description" content="A single offline page that turns any picture the person already has into a classic meme.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Meme maker · Verse lab">
<meta property="og:description" content="A single offline page that turns any picture the person already has into a classic meme.">
<meta property="og:url" content="https://a-to-mind.com/lab/f638-meme-maker/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f638-meme-maker/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<h1>Meme maker</h1>
<p>Add a photo, write the top and bottom lines, drag them, then download the PNG. Everything stays on this device.</p>

<div class="row">
  <input type="file" id="file" accept="image/*" capture="environment">
  <button type="button" id="camBtn" class="secondary">Use camera</button>
  <button type="button" id="blankBtn" class="secondary">Blank canvas</button>
</div>
<video id="vid" class="hidden" playsinline></video>
<canvas id="camCan" class="hidden"></canvas>

<div class="row">
  <label>Top <input type="text" id="top" placeholder="TOP TEXT" maxlength="80"></label>
  <label>Bottom <input type="text" id="bot" placeholder="BOTTOM TEXT" maxlength="80"></label>
</div>
<div class="row">
  <label>Size <input type="range" id="size" min="16" max="120" value="48"></label>
  <span id="sizeVal">48</span>
  <label>Colour <input type="color" id="color" value="#ffffff"></label>
  <label>Outline <input type="color" id="outline" value="#000000"></label>
  <label>Weight <input type="range" id="weight" min="1" max="16" value="6"></label>
</div>
<div class="row">
  <button type="button" id="download">Download PNG</button>
  <button type="button" id="copyLink" class="secondary">Copy share link</button>
  <button type="button" id="reset" class="secondary">Reset positions</button>
</div>

<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
</div>
<p class="hint">Drag the text. Pinch or resize the window — text stays in relative place. Last captions are remembered.</p>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
