#stage { position:relative; width:100vw; height:100vh; }
.card {
  position:absolute; width:72px; height:72px; border-radius:12px;

}
.card.positive { border-color:#f66; background:linear-gradient(135deg,#3a1a1a,#5a2a2a); }

#hand { position:absolute; width:24px; height:24px; border-radius:50%; background:#fff; pointer-events:none; mix-blend-mode:screen; box-shadow:0 0 20px #fff; }
#ui { position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:8px; }
button { margin:4px; padding:6px 10px; background:#223; color:#fff; border:1px solid #55f; border-radius:4px; cursor:pointer; }
#status { font-size:12px; margin-top:4px; color:#aaf; }
