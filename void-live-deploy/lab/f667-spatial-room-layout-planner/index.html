<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #111; }
header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
h1 { margin: 0 0 8px; font-size: 1.4rem; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label { font-size: 0.85rem; }
input[type=number] { width: 60px; padding: 4px; }
button { padding: 6px 12px; background: #0066cc; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
button:hover { background: #0055aa; }
#canvas-wrap { position: relative; margin: 16px; background: #fff; border: 1px solid #ccc; overflow: auto; height: 70vh; }
#floor { position: relative; background: #e8f0e8; border: 2px solid #333; }
.item { position: absolute; background: rgba(100,150,255,0.7); border: 2px solid #336; border-radius: 4px; cursor: move; display: flex; align-items: center; justify-content: center; font-size: 12px; user-select: none; touch-action: none; }
.item .label { pointer-events: none; }
.resize { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; background: #336; cursor: nwse-resize; border-radius: 2px; }
#info { padding: 8px 16px; background: #fff; border-top: 1px solid #ddd; font-size: 0.9rem; }
.actions { display: flex; gap: 8px; margin-top: 8px; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Room layout planner · Verse lab</title>
<meta name="description" content="Job: Enter room dimensions and drag furniture shapes onto a floor plan to plan a layout; download a PNG of the plan and a text list of items with sizes.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Room layout planner · Verse lab">
<meta property="og:description" content="Job: Enter room dimensions and drag furniture shapes onto a floor plan to plan a layout; download a PNG of the plan and a text list of items with sizes.">
<meta property="og:url" content="https://a-to-mind.com/lab/f667-spatial-room-layout-planner/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f667-spatial-room-layout-planner/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Room layout planner</h1>
  <div class="controls">
    <label>Width (m) <input type="number" id="roomW" value="4" min="1" max="20" step="0.1"></label>
    <label>Length (m) <input type="number" id="roomL" value="5" min="1" max="20" step="0.1"></label>
    <button id="setRoom">Set room</button>
    <button id="addBed">Add bed</button>
    <button id="addTable">Add table</button>
    <button id="addChair">Add chair</button>
    <button id="addSofa">Add sofa</button>
    <button id="clear">Clear items</button>
  </div>
</header>
<div id="canvas-wrap">
  <div id="floor"></div>
</div>
<div id="info">
  <div id="stats">Free area: --</div>
  <div class="actions">
    <button id="download">Download PNG</button>
    <button id="copyList">Copy item list</button>
    <button id="save">Save</button>
  </div>
</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
