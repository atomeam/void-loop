<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root { --bg: #0a0c10; --card: #161b22; --accent: #58a6ff; --good: #3fb950; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #e6edf3; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  .verse-card {
    position: absolute; width: 92px; height: 68px; border-radius: 10px;
    background: var(--card); border: 1px solid #30363d; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 11px; user-select: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: box-shadow .2s, border-color .2s;
    pointer-events: none;
  }
  .verse-card.pulse { border-color: var(--good); box-shadow: 0 0 18px var(--good); }
  .verse-card .id { font-weight: 600; color: var(--accent); }
  .verse-card .fit { font-size: 10px; opacity: .7; }
  #hud {
    position: fixed; top: 12px; left: 12px; background: rgba(22,27,34,.85); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; z-index: 10; max-width: 280px; backdrop-filter: blur(4px);
  }
  button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; margin-top: 6px; font-size: 12px;
  }
  button:hover { background: #30363d; }
  #status { margin-top: 6px; opacity: .8; }
</style>
