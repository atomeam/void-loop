<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root { --bg: #0a0a12; --fg: #e0e0ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; overflow: hidden; height: 100vh;
  }
  #scene {
    perspective: 800px; width: 100vw; height: 100vh; position: relative;
    transform-style: preserve-3d;
  }
  .tile {
    position: absolute; width: 140px; height: 90px; padding: 8px;
    background: hsl(var(--h), 70%, 45%); color: #fff; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: grab;
    transform-style: preserve-3d; user-select: text;
    font-size: 13px; line-height: 1.3; overflow: auto;
  }
  .tile:active { cursor: grabbing; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px;
    font-size: 12px; max-width: 280px;
  }
  button {
    margin: 4px; padding: 6px 10px; background: #333; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #555; }
</style>
