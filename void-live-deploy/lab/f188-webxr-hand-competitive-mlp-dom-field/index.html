<style>
  :root { --hue: 210; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; color: #e0e0ff; font-family: system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card {
    position: absolute; width: 140px; height: 90px; border-radius: 12px;
    background: hsl(var(--hue), 60%, 18%); border: 1px solid hsl(var(--hue), 70%, 45%);
    color: #fff; padding: 8px; box-sizing: border-box; pointer-events: none;
    transition: background 0.3s; font-size: 13px; line-height: 1.3;
    will-change: transform, left, top;
  }
  .hud {
    position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap;
  }
  button {
    background: #222; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #333; }
  #status { position: absolute; bottom: 10px; left: 10px; z-index: 10; font-size: 12px; opacity: 0.8; }
</style>
