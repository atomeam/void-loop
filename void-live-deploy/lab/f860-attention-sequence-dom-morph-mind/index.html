:root { --bg: #0a0c10; --card: #161b22; --accent: #58a6ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: #e6edf3; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
#canvas { position: fixed; inset: 0; z-index: 0; }
#portals { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.portal {
  position: absolute; width: 120px; height: 90px; background: rgba(22,27,34,0.85);
  border: 1px solid #30363d; border-radius: 12px; padding: 8px; font-size: 12px;
  pointer-events: auto; cursor: grab; transition: filter 0.2s, transform 0.1s;
  backdrop-filter: blur(4px); display: flex; flex-direction: column; justify-content: space-between;
  clip-path: polygon(10% 0%, 90% 0%, 100% 30%, 100% 70%, 90% 100%, 10% 100%, 0% 70%, 0% 30%);
}
.portal:active { cursor: grabbing; }
.portal h3 { font-size: 13px; color: var(--accent); }
.portal .energy { font-size: 10px; opacity: 0.7; }
#hud { position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
#hud button { margin-left: 8px; background: var(--accent); border: none; color: #000; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
</style>
