<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --hue: 220;
    --scale: 1;
    --border: 2px;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: hsl(var(--hue), 40%, 8%);
    color: #e0e0ff;
    font-family: system-ui, sans-serif;
    transform: scale(var(--scale));
    transform-origin: center;
    transition: background 0.4s, transform 0.3s;
  }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    cursor: crosshair;
  }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 12px;
    border: var(--border) solid hsl(var(--hue), 70%, 55%);
    font-size: 13px; max-width: 280px; backdrop-filter: blur(4px);
  }
  button, .seal {
    background: hsl(var(--hue), 60%, 40%); color: white; border: none;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; margin: 4px 4px 0 0;
  }
  .orb {
    position: absolute; width: 36px; height: 36px; border-radius: 50%;
    pointer-events: auto; cursor: grab; z-index: 20;
    box-shadow: 0 0 12px currentColor; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold; color: #111; user-select: none;
    transition: transform 0.1s;
  }
  .orb:active { cursor: grabbing; transform: scale(1.2); }
  #status { opacity: 0.8; margin-top: 6px; }
</style>
