<style>
  :root { --bg: #0a0a12; --card: #1a1a2e; --accent: #00ffc8; }
  body { margin: 0; background: var(--bg); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }

  button:hover { background: #333; }
  #status { position: fixed; bottom: 12px; left: 12px; z-index: 20; font-size: 11px; opacity: 0.8; }
  #gaze { position: absolute; width: 16px; height: 16px; border: 2px solid #ff0; border-radius: 50%; pointer-events: none; z-index: 15; transform: translate(-50%,-50%); display: none; }
