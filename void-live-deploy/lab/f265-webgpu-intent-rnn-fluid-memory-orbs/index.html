.orb {
  position: absolute; width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle, var(--orb), transparent 70%);
  border: 1px solid rgba(167,139,250,0.5); pointer-events: auto; cursor: grab;
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  color: #fff; text-shadow: 0 0 4px #000; transform: translate(-50%, -50%);
  transition: transform 0.1s;
}
.orb:active { cursor: grabbing; }
.status { position: fixed; bottom: 8px; left: 12px; font-size: 11px; opacity: 0.6; }
