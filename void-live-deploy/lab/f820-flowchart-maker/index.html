<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
  :root { --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --accent: #58a6ff; --line: #8b949e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 0.75rem 1rem; background: #161b22; border-bottom: 1px solid #30363d; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  header h1 { font-size: 1.1rem; margin: 0 1rem 0 0; }
  button, input { background: var(--card); color: var(--text); border: 1px solid #30363d; border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.9rem; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #board-wrap { flex: 1; position: relative; overflow: auto; background: #0d1117; }
  #board { position: relative; width: 2000px; height: 1400px; background-image: radial-gradient(#21262d 1px, transparent 1px); background-size: 20px 20px; }
  .box { position: absolute; min-width: 120px; min-height: 48px; background: var(--card); border: 2px solid #30363d; border-radius: 8px; padding: 0.5rem 0.75rem; cursor: move; user-select: none; box-shadow: 0 2px 8px #0004; }
  .box.selected { border-color: var(--accent); }
  .box input { width: 100%; background: transparent; border: none; color: inherit; font: inherit; outline: none; text-align: center; }
  svg.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .status { font-size: 0.8rem; opacity: 0.7; margin-left: auto; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Flowchart maker · Verse lab</title>
<meta name="description" content="Job: Add boxes for process steps, type their labels, drag them around a board, connect them with arrows, then download the diagram as a PNG or export the structure">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Flowchart maker · Verse lab">
<meta property="og:description" content="Job: Add boxes for process steps, type their labels, drag them around a board, connect them with arrows, then download the diagram as a PNG or export the structure">
<meta property="og:url" content="https://a-to-mind.com/lab/f820-flowchart-maker/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f820-flowchart-maker/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Flowchart maker</h1>
  <button id="add">+ Add box</button>
  <button id="connect">Connect mode</button>
  <button id="export-png">Download PNG</button>
  <button id="export-json">Export JSON</button>
  <button id="import-json">Import JSON</button>
  <button id="clear">Clear</button>
  <span class="status" id="status">Ready</span>
</header>
<div id="board-wrap">
  <div id="board">
    <svg class="overlay" id="svg"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
      </marker>
    </defs></svg>
  </div>
</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
