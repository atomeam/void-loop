<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
:root { --bg: #0f0f12; --card: #1a1a22; --text: #e8e8f0; --accent: #6cf; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
#ui { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,.7); padding: 12px; border-radius: 12px; max-width: 280px; }
#ui input, #ui button { width: 100%; margin: 4px 0; padding: 8px; border-radius: 8px; border: none; background: #222; color: var(--text); }
#ui button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; }
#board { width: 100vw; height: 100vh; perspective: 1200px; transform-style: preserve-3d; }
#scene { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.1s linear; }
.card {
  position: absolute; width: 180px; min-height: 80px; background: var(--card);
  border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  transform-style: preserve-3d; cursor: grab; user-select: none;
  border-left: 6px solid var(--hue, #6cf);
}
.card.done { opacity: 0.5; text-decoration: line-through; }
.card h3 { font-size: 14px; margin-bottom: 4px; }
.card small { color: #aaa; font-size: 11px; }
#status { position: fixed; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.7; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
