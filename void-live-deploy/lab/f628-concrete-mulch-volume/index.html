<!DOCTYPE html>

<meta charset="UTF-8">

<style>
:root { --bg:#0f1115; --card:#1a1d24; --accent:#4a9eff; --text:#e8eaed; --muted:#9aa0a6; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); line-height:1.4; }
#chrome { padding:12px 16px; background:#16181d; border-bottom:1px solid #2a2e36; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
#chrome h1 { margin:0; font-size:1.1rem; flex:1; }
button, select, input { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid #3c424c; background:#22262e; color:var(--text); }
button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
button.secondary { background:#333; }
#items { padding:12px; display:flex; flex-direction:column; gap:12px; }
.item { background:var(--card); border-radius:10px; padding:12px; display:grid; grid-template-columns:1fr 180px; gap:12px; }
@media (max-width:700px) { .item { grid-template-columns:1fr; } }
.fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
label { display:flex; flex-direction:column; font-size:0.8rem; color:var(--muted); gap:2px; }
canvas { width:100%; height:160px; background:#111; border-radius:6px; }
.summary { font-size:0.9rem; margin-top:6px; }
.total { padding:12px 16px; background:#16181d; border-top:1px solid #2a2e36; font-weight:600; }
.note { font-size:0.75rem; color:var(--muted); margin-top:4px; }
#status { font-size:0.8rem; color:var(--muted); margin-left:auto; }
</style>
