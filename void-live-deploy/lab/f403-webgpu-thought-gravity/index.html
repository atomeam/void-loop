<!DOCTYPE html>

<style>
  :root {
    --entropy: 0.4;
    --coherence: 0.3;
    --hue: 200;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: hsl(var(--hue), 30%, 4%);
    color: #e8e6e3;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    transition: background 0.8s ease;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #chrome {
    position: absolute; inset: 0; pointer-events: none;
    border: 8px solid hsla(var(--hue), 70%, 50%, calc(0.3 + var(--coherence) * 0.5));
    border-radius: calc(12px + var(--entropy) * 40px);
    box-shadow: inset 0 0 calc(20px + var(--coherence) * 60px) hsla(var(--hue), 80%, 50%, 0.15);
    transition: border-radius 0.4s, border-color 0.6s, box-shadow 0.6s;
  }
  #hud {
    position: absolute; top: 1rem; left: 1rem; right: 1rem;
    display: flex; gap: 0.75rem; align-items: center; pointer-events: auto;
    z-index: 10;
  }
  #input {
    flex: 1; padding: 0.6rem 1rem; border-radius: 999px;
    border: 2px solid hsla(var(--hue), 60%, 50%, 0.6);
    background: rgba(0,0,0,0.4); color: inherit; font-size: 1rem;
    backdrop-filter: blur(8px);
  }
  #seal, #status {
    padding: 0.5rem 1rem; border-radius: 999px;
    border: 2px solid hsla(var(--hue), 70%, 50%, 0.8);
    background: rgba(0,0,0,0.5); cursor: pointer; font-size: 0.85rem;
  }
  #status { pointer-events: none; cursor: default; }
  .portal {
    position: absolute; pointer-events: none;
    padding: 0.5rem 0.8rem; border-radius: 1rem;
    background: hsla(var(--hue), 40%, 10%, 0.7);
    border: 1px solid hsla(var(--hue), 70%, 60%, 0.5);
    font-size: 0.75rem; max-width: 12rem;
    transform: translate(-50%, -50%);
    transition: left 0.3s, top 0.3s, opacity 0.4s, transform 0.4s;
    backdrop-filter: blur(4px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #info {
    position: absolute; bottom: 1rem; left: 1rem; font-size: 0.75rem;
    opacity: 0.6; max-width: 28rem; pointer-events: none;
  }
</style>
