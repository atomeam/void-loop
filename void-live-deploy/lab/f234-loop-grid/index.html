<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee; }
header { padding:12px 16px; background:#1a1a1a; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
h1 { margin:0; font-size:1.2rem; }
button, select, input { padding:8px 12px; border:1px solid #444; background:#222; color:#eee; border-radius:6px; cursor:pointer; font-size:14px; }
button:hover { background:#333; }
#grid { display:grid; grid-template-columns:repeat(8, 48px); gap:4px; padding:16px; justify-content:center; }
.cell { width:48px; height:48px; background:#222; border:2px solid #333; border-radius:4px; cursor:pointer; }
.cell.on { background:#4af; border-color:#6cf; }
.cell.playing { outline:2px solid #fff; }
.controls { padding:8px 16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; background:#1a1a1a; }
.status { font-size:12px; color:#aaa; padding:8px 16px; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Loop Grid · Verse lab</title>
<meta name="description" content="A Verse lab experiment: Loop Grid.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Loop Grid · Verse lab">
<meta property="og:description" content="A Verse lab experiment: Loop Grid.">
<meta property="og:url" content="https://a-to-mind.com/lab/f234-loop-grid/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f234-loop-grid/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<script src="/visit.js" defer></script>
</head>
<body>
<header>
  <h1>Loop Grid</h1>
  <div>
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <button id="clear">Clear</button>
    <button id="download">Download JSON</button>
    <button id="share">Copy share link</button>
  </div>
</header>
<div class="controls">
  <label>Tempo <input id="tempo" type="range" min="60" max="180" value="120"></label>
  <span id="tempoVal">120</span>
  <label>Wave
    <select id="wave">
      <option value="sine">Sine</option>
      <option value="square">Square</option>
      <option value="triangle">Triangle</option>
    </select>
  </label>
</div>
<div id="grid"></div>
<div class="status" id="status">Click cells to place notes. Press Play (first click unlocks audio). Area of the week: Music.</div>
<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
