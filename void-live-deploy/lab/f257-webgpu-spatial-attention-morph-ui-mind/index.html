<style>
:root {
  --attn-energy: 0.2;
  --attn-entropy: 0.5;
  --bg: #0a0a12;
}
body {
  margin: 0;
  background: var(--bg);
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  filter: hue-rotate(calc(var(--attn-entropy) * 40deg)) contrast(calc(1 + var(--attn-energy) * 0.3));
  transition: filter 0.4s ease;
}
#overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
}
#ui {
  position: fixed; top: 12px; left: 12px; z-index: 10;
  background: rgba(10,10,20,0.7); padding: 10px 14px; border-radius: 8px;
  backdrop-filter: blur(8px); font-size: 13px; max-width: 280px;
}
button { margin: 4px 0; padding: 6px 10px; background: #2a2a4a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #3a3a6a; }
.card {
  position: absolute; width: 72px; height: 72px;
  background: linear-gradient(135deg, #3a2a5a, #1a3a5a);
  border-radius: 12px; border: 1px solid rgba(120,180,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; text-align: center; color: #c0d0ff;
  transition: transform 0.15s linear, opacity 0.2s, filter 0.2s;
  pointer-events: auto; user-select: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.card.high { border-color: #80c0ff; box-shadow: 0 0 20px rgba(100,180,255,0.6); }
#status { font-size: 11px; opacity: 0.8; margin-top: 6px; }
