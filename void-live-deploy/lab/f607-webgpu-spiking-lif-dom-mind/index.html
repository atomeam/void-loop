<style>
:root { --hue: 200; --sat: 50%; --sync: 0; }
body { margin:0; background:#0a0a12; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
#canvas { position:absolute; inset:0; z-index:0; }
#nodes { position:absolute; inset:0; z-index:1; pointer-events:none; }
.node { position:absolute; width:48px; height:48px; border-radius:8px; background:hsla(var(--hue),var(--sat),60%,0.7); 
  transform:translate(-50%,-50%) scale(1); transition:transform 0.05s, opacity 0.1s; pointer-events:auto; cursor:grab;
  box-shadow:0 0 12px hsla(var(--hue),80%,60%,0.4); display:flex; align-items:center; justify-content:center; font-size:10px; }
.node.spike { transform:translate(-50%,-50%) scale(1.4); background:hsla(calc(var(--hue)+60),90%,70%,0.95); }
#ui { position:absolute; top:12px; left:12px; z-index:2; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:8px; font-size:13px; }
button { margin:4px; padding:6px 10px; background:#222; color:#eee; border:1px solid #444; border-radius:4px; cursor:pointer; }
button:hover { background:#333; }
#status { margin-top:6px; font-family:monospace; font-size:11px; }
</style>
