<style>
:root {
  --bg: #050510;
  --fg: #d0e0ff;
  --accent: #6af;
  --hue: 200;
  --blur: 0px;
  --contrast: 1;
  --residual: 0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: hsl(var(--hue), 25%, 6%);
  color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden;
  filter: blur(var(--blur)) contrast(var(--contrast));
  transition: filter 0.4s, background 0.6s;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: absolute; z-index: 10; padding: 10px; pointer-events: none; }
.ui > * { pointer-events: auto; }
button, .status {
  background: rgba(10,10,30,0.85); color: var(--fg); border: 1px solid #334;
  border-radius: 6px; padding: 7px 11px; margin: 3px; font-size: 13px;
}
button:hover { border-color: var(--accent); }
.status { font-size: 11px; opacity: 0.85; max-width: 340px; }
.orbs { position: absolute; inset: 0; pointer-events: none; }
.orb {
  position: absolute; width: 80px; height: 48px;
  background: hsla(var(--hue), 45%, 16%, 0.88);
  border: 1px solid hsl(var(--hue), 75%, 62%);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; pointer-events: auto; cursor: grab; text-align: center; line-height: 1.1;
  transform: translate(-50%, -50%) scale(1);
  transition: transform 0.12s, filter 0.18s, border-color 0.18s;
  filter: brightness(1);
}
.orb.hot { border-color: #f6a; filter: brightness(1.5) saturate(1.3); }
</style>
