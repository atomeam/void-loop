<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --energy: 0.3;
  --fitness: 0.5;
  --bg: hsl(220, 15%, calc(8% + var(--energy) * 4%));
  --accent: hsl(calc(180 + var(--fitness) * 80), 70%, 55%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chrome { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(4px); font-size: 13px; max-width: 280px; }
.chrome button { margin: 4px 4px 0 0; padding: 4px 10px; background: var(--accent); border: none; color: #111; border-radius: 4px; cursor: pointer; }
.facet {
  position: absolute; width: 90px; height: 64px; background: rgba(30,30,40,0.75);
  border: 1px solid var(--accent); border-radius: 6px; padding: 6px; font-size: 11px;
  pointer-events: none; transition: background 0.2s; z-index: 5;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.status { position: absolute; bottom: 12px; left: 12px; font-size: 12px; opacity: 0.8; z-index: 10; }
</style>
