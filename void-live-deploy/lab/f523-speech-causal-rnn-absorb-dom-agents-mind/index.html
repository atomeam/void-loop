<style>
  :root { --bg: #0a0a12; --card: #1a1a2e; --accent: #00f0ff; --text: #e0e0ff; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #status { position: fixed; top: 0; left: 0; right: 0; background: #111; padding: 8px 12px; font-size: 13px; z-index: 100; display: flex; gap: 16px; align-items: center; }
  #arena { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
  .agent { position: absolute; width: 72px; height: 48px; background: var(--card); border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; user-select: none; cursor: pointer; transition: box-shadow 0.2s; }
  .agent.high { box-shadow: 0 0 12px var(--accent); }
  #controls { position: fixed; bottom: 12px; left: 12px; background: #111a; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 100; max-width: 280px; }
  input, button { background: #222; color: var(--text); border: 1px solid #444; padding: 6px; border-radius: 4px; }
  button { cursor: pointer; }
  button:hover { background: #333; }
</style>
