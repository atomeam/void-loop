<!DOCTYPE html>

<meta charset="UTF-8">

<style>
  :root { --bg: #0a0c10; --card: #161b22; --accent: #58a6ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: #e6edf3;
    font-family: system-ui, sans-serif; overflow: hidden; height: 100vh;
  }
  #field {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(ellipse at center, #11151c 0%, #0a0c10 70%);
  }
  .agent {
    position: absolute; width: 140px; height: 90px; padding: 8px;
    background: var(--card); border: 1px solid #30363d; border-radius: 8px;
    font-size: 12px; color: #c9d1d9; cursor: grab; user-select: none;
    transition: transform 0.08s linear, filter 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .agent:active { cursor: grabbing; }
  .agent.targeted { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .agent.rewarded { animation: pulse 0.4s ease-out; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    background: rgba(22,27,34,.85); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.4; backdrop-filter: blur(4px);
  }
  button, .btn {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; margin-right: 6px; font-size: 12px;
  }
  button:hover { background: #30363d; }
  #cursor {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); pointer-events: none; z-index: 50;
    box-shadow: 0 0 8px var(--accent); transform: translate(-50%, -50%);
  }
  .note { outline: none; min-height: 40px; }
</style>
