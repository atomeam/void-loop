<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
:root { --completion-hue: 200; --residual-scale: 1; --bg: #0a0a12; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: #e0e0ff; font-family: system-ui, sans-serif; overflow: hidden; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
.chrome { position: fixed; top: 12px; left: 12px; background: rgba(10,10,20,.75); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 10; backdrop-filter: blur(4px); }
.chrome button { margin: 2px; padding: 4px 10px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
.chrome button:hover { background: #333; }
.portal { position: absolute; width: 120px; height: 70px; background: hsla(var(--completion-hue), 60%, 30%, .85); border: 1px solid hsla(var(--completion-hue), 80%, 60%, .9); border-radius: 6px; padding: 6px; font-size: 11px; pointer-events: auto; cursor: grab; z-index: 5; transform: scale(var(--residual-scale)); transition: transform .2s, background .3s; }
.portal:active { cursor: grabbing; }
#status { margin-top: 6px; opacity: .8; }
</style>
