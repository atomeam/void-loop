<style>
  :root { --hue: 220; --sat: 40%; --morph: 0; }
  body {
    margin: 0; background: hsl(var(--hue), var(--sat), 8%); color: #eee;
    font-family: system-ui, sans-serif; overflow: hidden;
    transition: background 0.8s, filter 0.4s;
    filter: hue-rotate(calc(var(--morph) * 40deg)) brightness(calc(1 + var(--morph) * 0.15));
  }
  #void {
    position: absolute; inset: 0; display: block;
  }
  #hud {
    position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.55);
    padding: 10px 14px; border-radius: 12px; backdrop-filter: blur(6px);
    transform: scale(calc(1 + var(--morph) * 0.08)) translateY(calc(var(--morph) * -8px));
    border: 1px solid hsl(var(--hue), 60%, 50%);
    transition: transform 0.6s, border-color 0.6s;
  }
  button { margin: 4px; padding: 6px 10px; background: #222; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
  button:hover { background: #333; }
  #status { font-size: 12px; opacity: 0.8; margin-top: 6px; }
</style>
