<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
:root {
  --hue: 220;
  --radius: 12px;
  --blur: 0px;
  --energy: 0;
}
body {
  margin: 0;
  overflow: hidden;
  background: hsl(var(--hue), 40%, 8%);
  color: #eee;
  font-family: system-ui, sans-serif;
  transition: background 0.3s;
}
canvas { display: block; width: 100vw; height: 100vh; }
#chrome {
  position: fixed;
  inset: 20px;
  border: 3px solid hsl(var(--hue), 70%, 50%);
  border-radius: var(--radius);
  pointer-events: none;
  filter: blur(var(--blur));
  mix-blend-mode: screen;
  opacity: 0.6;
}
.probe {
  position: absolute;
  width: 80px;
  height: 60px;
  background: hsla(var(--hue), 80%, 60%, 0.3);
  border: 1px solid #fff8;
  border-radius: 8px;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  user-select: none;
  backdrop-filter: blur(4px);
}
#status {
  position: fixed;
  bottom: 10px;
  left: 10px;
  font-size: 12px;
  opacity: 0.7;
}
button {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 10;
  background: #333;
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
