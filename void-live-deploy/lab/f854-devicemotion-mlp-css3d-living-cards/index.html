<style>
  body { margin: 0; background: #0a0a12; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #stage { position: relative; width: 100%; height: 100%; perspective: 800px; transform-style: preserve-3d; }
  .card {
    position: absolute; width: 140px; height: 90px; border-radius: 12px;
    background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid #0f3460;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transform-style: preserve-3d; transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 0 20px #e94560; }
  .card .id { font-size: 12px; opacity: .7; }
  .card .fit { font-size: 18px; font-weight: bold; color: #e94560; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 10; }
  button { background: #e94560; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 8px; }
</style>
