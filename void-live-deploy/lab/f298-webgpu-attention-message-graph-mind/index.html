<style>
  :root { --bg: #07090d; --fg: #d8e0ea; --accent: #7af0ff; --card: #c77dff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .card {
    position: absolute; width: 88px; height: 56px; border-radius: 12px;
    background: linear-gradient(135deg, #2a1a3a, var(--card) 70%);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    text-align: center; pointer-events: auto; cursor: grab; user-select: none;
    box-shadow: 0 4px 24px #c77dff66; transition: transform 0.08s, opacity 0.2s;
    border: 1px solid #ffffff22;
  }
  .card:active { cursor: grabbing; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 10; background: #0d1118cc; padding: 8px 12px; border-radius: 8px; font-size: 13px; backdrop-filter: blur(4px); }
  button { background: #1a2230; color: var(--accent); border: 1px solid #334; padding: 4px 10px; margin: 2px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #253040; }
  #status { font-size: 11px; opacity: 0.85; margin-top: 4px; }
</style>
