  .plant {
    position: absolute; z-index: 5; width: 80px; height: 80px;
    border-radius: 40% 60% 50% 50%; background: rgba(80,200,120,.35);
    border: 1px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center; cursor: grab; user-select: none; backdrop-filter: blur(4px);
    transition: transform .2s;
  }
  .plant:active { cursor: grabbing; }
