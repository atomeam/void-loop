<style>
  :root { --void: #0a0a12; --portal: #4af; }
  body { margin: 0; background: var(--void); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { position: absolute; inset: 0; z-index: 1; }
  .portal {
    position: absolute; z-index: 2; width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(80,180,255,0.35), transparent 70%);
    border: 1px solid rgba(100,200,255,0.4);
    border-radius: 40% 60% 50% 50%;
    clip-path: circle(40% at 50% 50%);
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    cursor: pointer;
    mix-blend-mode: screen;
    pointer-events: auto;
  }
  .portal:hover { filter: brightness(1.4); }
  #ui { position: fixed; bottom: 16px; left: 16px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #1a1a2e; color: #eee; border: 1px solid #4af; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2a2a4e; }
  #status { position: fixed; top: 12px; left: 12px; z-index: 10; font-size: 13px; opacity: 0.8; }
</style>
