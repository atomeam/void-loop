<style>
  :root { --morph: 0; --hue: 180; --scale: 1; --blur: 0; }
  html, body { margin: 0; height: 100%; background: #0a0a12; color: #c8c8d0; font-family: system-ui, sans-serif; overflow: hidden; }
  body { filter: hue-rotate(calc(var(--hue) * 1deg)) blur(calc(var(--blur) * 1px)); transform: scale(var(--scale)); transition: filter 0.4s, transform 0.4s; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(10,10,20,0.7); padding: 10px 14px; border-radius: 8px; border: 1px solid #3a3a50; font-size: 13px; pointer-events: none; z-index: 2; transform: translateY(calc(var(--morph) * -8px)); }
  #hud b { color: #7af; }
  button { pointer-events: auto; margin-top: 8px; background: #2a2a40; color: #c8c8d0; border: 1px solid #5a5a70; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3a3a50; }
</style>
