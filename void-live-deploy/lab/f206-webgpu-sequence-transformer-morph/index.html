<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --hue: 220;
    --contrast: 1;
    --blur: 0px;
    --perspective: 800px;
    --rotate: 0deg;
    --scale: 1;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: hsl(var(--hue), 40%, 8%);
    color: #eee;
    font-family: system-ui, sans-serif;
    filter: contrast(var(--contrast)) blur(var(--blur));
    transition: filter 0.3s, background 0.5s;
  }
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .echo {
    position: absolute;
    width: 140px;
    padding: 12px;
    background: hsla(var(--hue), 60%, 20%, 0.75);
    border: 1px solid hsla(var(--hue), 80%, 60%, 0.6);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
    font-size: 13px;
    line-height: 1.4;
    transform: translate(-50%, -50%) scale(var(--card-scale, 1)) rotate(var(--card-rot, 0deg));
    transition: transform 0.15s, opacity 0.3s, background 0.4s;
    opacity: 0.85;
  }
  #hud {
    position: fixed;
    bottom: 12px;
    left: 12px;
    font-size: 12px;
    opacity: 0.7;
    pointer-events: none;
    background: rgba(0,0,0,0.4);
    padding: 8px 12px;
    border-radius: 8px;
  }
  #seal {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 8px 14px;
    background: #222;
    border: 1px solid #555;
    color: #aaa;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12px;
  }
  #seal:hover { background: #333; }
</style>
