<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --entropy: 0.5;
    --peak: 0.3;
    --hue: 200;
    --radius: 40px;
  }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    transition: all 0.2s;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: absolute;
    top: 1rem;
    left: 1rem;
    pointer-events: none;
    max-width: 28rem;
  }
  #status {
    display: inline-block;
    padding: 0.5rem 1rem;
    border: 2px solid hsl(var(--hue), 70%, 50%);
    border-radius: var(--radius);
    font-size: 0.9rem;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(calc(var(--peak) * 8px));
    transition: all 0.3s;
    box-shadow: 0 0 calc(var(--peak) * 20px) hsl(var(--hue), 70%, 40%);
  }
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), transparent calc(30% - var(--peak)*20%), rgba(0,0,0,0.4));
    mix-blend-mode: multiply;
    transition: all 0.2s;
  }
  #info {
    margin-top: 0.6rem;
    font-size: 0.75rem;
    opacity: 0.75;
  }
</style>
