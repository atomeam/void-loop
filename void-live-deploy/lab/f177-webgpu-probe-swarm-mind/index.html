<!DOCTYPE html>

<style>
  :root { --hue: 200; --fit: 0.5; }
  body { margin: 0; background: #0a0a0c; color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #mind {
    position: absolute; width: 140px; height: 70px; border-radius: 12px;
    border: 3px solid hsl(var(--hue), 70%, 55%); background: rgba(10,10,12,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.75rem; cursor: grab; user-select: none; backdrop-filter: blur(4px);
    transition: border-color 0.4s, box-shadow 0.4s;
    box-shadow: 0 0 20px hsl(var(--hue), 70%, 40%);
  }
  #mind:active { cursor: grabbing; }
  #status { opacity: 0.9; }
  #seal { position: absolute; bottom: 1rem; right: 1rem; padding: 0.5rem 1rem; background: #222; border: 1px solid #555; color: #ccc; border-radius: 6px; cursor: pointer; }
  #info { position: absolute; top: 1rem; left: 1rem; font-size: 0.8rem; opacity: 0.6; max-width: 280px; }
</style>
