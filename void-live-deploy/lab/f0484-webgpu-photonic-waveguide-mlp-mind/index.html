<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #0a0c10;
    --fg: #e8eef6;
    --accent: #6cf;
    --glow: 0;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #stage { display: flex; flex-direction: column; height: 100%; }
  header { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #222; }
  button, label { background: #1a1e26; color: var(--fg); border: 1px solid #333; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #canvas-wrap { flex: 1; position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #05070a; }
  #receivers { position: absolute; inset: 0; pointer-events: none; }
  .card {
    position: absolute; width: 120px; height: 72px; border-radius: 12px;
    background: rgba(20,24,32,.75); border: 1px solid #334;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    transform: scale(calc(0.9 + var(--glow) * 0.4));
    box-shadow: 0 0 calc(var(--glow) * 40px) rgba(100,200,255, calc(var(--glow) * 0.8));
    transition: transform .15s, box-shadow .15s;
    backdrop-filter: blur(4px);
  }
  .card span { opacity: .9; }
  #status { font-size: 12px; opacity: .7; }
</style>
