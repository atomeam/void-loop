<style>
:root {
  --energy: 0.2;
  --entropy: 0.4;
  --residual: 0.1;
  --hue: 220;
}
body {
  margin: 0;
  overflow: hidden;
  background: hsl(var(--hue), 40%, calc(8% + var(--energy)*12%));
  color: #eee;
  font-family: system-ui, sans-serif;
  transition: background 0.3s;
}
canvas { display: block; width: 100vw; height: 100vh; }
#ui {
  position: fixed; top: 12px; left: 12px; z-index: 10;
  background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px;
  font-size: 12px; backdrop-filter: blur(4px);
}
.orb {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, hsl(var(--hue), 80%, 60%), transparent 70%);
  pointer-events: none; mix-blend-mode: screen;
  transition: all 0.15s;
  filter: blur(calc(var(--entropy) * 2px));
}
#status { font-variant-numeric: tabular-nums; }
</style>
