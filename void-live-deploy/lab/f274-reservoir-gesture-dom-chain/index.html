<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0c10;
    --fg: #e0e6f0;
    --accent: #6ee7b7;
    --stiff: 0.5;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #chain { position: absolute; inset: 0; pointer-events: none; }
  .anchor {
    position: absolute;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent), #1e3a5f);
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto;
    cursor: grab;
    box-shadow: 0 0 12px rgba(110, 231, 183, 0.6);
    transition: box-shadow 0.15s;
    user-select: none;
    touch-action: none;
  }
  .anchor:active { cursor: grabbing; box-shadow: 0 0 20px var(--accent); }
  .anchor::after {
    content: attr(data-i);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #0a0c10;
  }
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    pointer-events: none; z-index: 10;
  }
  #hud button, #hud span {
    pointer-events: auto;
    background: rgba(20,24,32,0.85);
    border: 1px solid rgba(110,231,183,0.4);
    color: var(--fg);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    backdrop-filter: blur(4px);
  }
  button { cursor: pointer; }
  button:hover { background: rgba(30,40,50,0.95); }
  #status { font-variant-numeric: tabular-nums; }
  .line {
    position: absolute;
    height: 2px;
    background: rgba(110,231,183,0.35);
    transform-origin: 0 50%;
    pointer-events: none;
  }
</style>
