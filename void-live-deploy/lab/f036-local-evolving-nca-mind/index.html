<style>
  :root {
    --hue: 220;
    --blur: 0px;
    --contrast: 1;
    --scale: 1;
  }
  body {
    margin: 0;
    background: #0a0a12;
    color: #e0e0ff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    filter: hue-rotate(calc(var(--hue) * 1deg)) blur(var(--blur)) contrast(var(--contrast));
    transform: scale(var(--scale));
    transform-origin: center;
    transition: filter 0.4s, transform 0.4s;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    backdrop-filter: blur(6px); max-width: 280px;
  }
  button { margin: 4px 2px; padding: 6px 10px; background: #2a2a4a; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3a3a6a; }
  #metrics { font-size: 12px; opacity: 0.8; margin-top: 6px; }
</style>
