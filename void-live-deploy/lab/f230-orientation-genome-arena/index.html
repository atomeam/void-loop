<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a12; color: #e0e0e0; overflow: hidden; }
  #arena { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; max-width: 320px; }
  button { background: #2a2a4a; color: #fff; border: 1px solid #555; padding: 6px 12px; margin: 4px; cursor: pointer; border-radius: 4px; }
  button:hover { background: #3a3a6a; }
  #bodies { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .body { position: absolute; border-radius: 50%; pointer-events: auto; cursor: grab; opacity: 0.85; transition: all 0.1s; box-shadow: 0 0 15px currentColor; }
  .body:active { cursor: grabbing; }
  #status { font-size: 0.85em; margin-top: 8px; line-height: 1.3; }
</style>

<div id="ui">

  <p style="margin:4px 0; font-size:0.9em">Tilt device or drag to compete. Seal & transfer winning genome.</p>
  <button id="start">Start Competition</button>
  <button id="seal">Seal Winner Genome</button>
