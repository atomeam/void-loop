<style>
:root {
  --scale: 1;
  --hue: 200;
  --blur: 0px;
  --pulse: 1;
}
body { margin:0; background:#0a0a12; color:#e0e0ff; font-family: system-ui, sans-serif; overflow:hidden; }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
#cards { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; }
.card {
  position:absolute; width:140px; height:90px; background:hsla(var(--hue),70%,40%,0.7);
  border:2px solid hsla(var(--hue),80%,60%,0.9); border-radius:12px;
  transform: scale(var(--scale)); filter: blur(var(--blur));
  opacity: var(--pulse); pointer-events:auto; cursor:pointer;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:13px; transition: transform 0.1s, filter 0.1s, opacity 0.1s;
  box-shadow: 0 0 20px hsla(var(--hue),70%,50%,0.4);
}
.card:hover { z-index:10; }
#status {
  position:fixed; bottom:10px; left:10px; z-index:10; background:rgba(0,0,0,0.6);
  padding:8px 12px; border-radius:8px; font-size:12px; max-width:320px;
}
button {
  margin:4px; padding:6px 10px; background:#222; color:#fff; border:1px solid #555; border-radius:6px; cursor:pointer;
}
</style>
