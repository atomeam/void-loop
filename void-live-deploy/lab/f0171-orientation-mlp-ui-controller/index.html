<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --scale: 1;
    --hue: 200;
    --force: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e8e4dc;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
    overflow: hidden;
  }
  header { text-align: center; margin-bottom: 1rem; z-index: 10; }
  h1 { font-size: 1.1rem; font-weight: 500; margin: 0 0 0.3rem; }
  .status { font-size: 0.75rem; opacity: 0.7; }
  #tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    width: min(90vw, 420px);
    margin-bottom: 1rem;
    z-index: 10;
  }
  .tile {
    aspect-ratio: 1;
    background: hsla(var(--hue), 60%, 40%, 0.3);
    border: 1px solid hsla(var(--hue), 70%, 60%, 0.5);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s;
    transform: scale(var(--scale));
  }
  .tile:active { transform: scale(calc(var(--scale) * 0.95)); }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  #info {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    right: 1rem;
    font-size: 0.7rem;
    opacity: 0.6;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
</style>
