<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --morph-hue: 200;
    --morph-blur: 0px;
    --morph-scale: 1;
    --morph-contrast: 1;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; color: #e0e0ff; font-family: system-ui, sans-serif; }
  body {
    filter: hue-rotate(calc(var(--morph-hue) * 1deg)) blur(var(--morph-blur)) contrast(var(--morph-contrast));
    transform: scale(var(--morph-scale));
    transform-origin: center;
    transition: filter 0.4s, transform 0.4s;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card {
    position: absolute;
    width: 180px;
    padding: 12px;
    background: rgba(20, 20, 40, 0.75);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    cursor: grab;
    user-select: none;
    transition: transform 0.15s, filter 0.2s, opacity 0.2s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card:active { cursor: grabbing; }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .card p { margin: 0; font-size: 12px; opacity: 0.85; }
  #hud {
    position: fixed; bottom: 12px; left: 12px; right: 12px;
    font-size: 12px; opacity: 0.7; pointer-events: none;
    display: flex; justify-content: space-between;
  }
  button { pointer-events: auto; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
</style>
