<!DOCTYPE html>
<html lang="en">

<style>
:root {
  --void-radius: 16px;
  --void-hue: 220;
  --void-thick: 2px;
  --void-scale: 1;
  --void-rot: 0deg;
  --void-bg: #0a0a12;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--void-bg);
  color: #e0e0f0;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: background 0.6s;
}
#canvas-wrap {
  position: relative;
  border: var(--void-thick) solid hsl(var(--void-hue), 60%, 50%);
  border-radius: var(--void-radius);
  box-shadow: 0 0 40px hsla(var(--void-hue), 70%, 40%, 0.4);
  transition: border-radius 0.4s, border-color 0.4s, box-shadow 0.4s;
  transform: scale(var(--void-scale)) rotate(var(--void-rot));
}
canvas {
  display: block;
  border-radius: calc(var(--void-radius) - 2px);
  background: #000;
  cursor: crosshair;
}
#hud {
  position: absolute;
  top: 8px; left: 8px;
  font-size: 12px;
  background: rgba(0,0,0,0.6);
  padding: 6px 10px;
  border-radius: 6px;
  pointer-events: none;
  max-width: 220px;
}
#mind-card {
  position: fixed;
  bottom: 20px; right: 20px;
  background: rgba(20,20,40,0.85);
  border: 1px solid hsla(var(--void-hue), 50%, 60%, 0.5);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  backdrop-filter: blur(8px);
  transform: scale(var(--void-scale)) rotate(var(--void-rot));
  transition: transform 0.3s, border-color 0.4s;
  max-width: 280px;
}
button {
  background: hsl(var(--void-hue), 40%, 30%);
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin: 2px;
  font-size: 12px;
}
button:hover { filter: brightness(1.2); }
#status { font-size: 11px; opacity: 0.8; margin-top: 6px; }
</style>
