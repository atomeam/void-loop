<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
:root { --bg: #0a0c10; --fg: #e0e6f0; --accent: #5ce1e6; --danger: #ff6b6b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
#hud > * { pointer-events: auto; }
button, textarea { background: #1a1e28; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 6px 10px; font: inherit; }
button:hover { border-color: var(--accent); }
#status { background: rgba(10,12,16,.75); padding: 8px 12px; border-radius: 8px; max-width: 420px; }
.agent-card {
  position: absolute; width: 72px; height: 72px; border-radius: 12px;
  background: rgba(20,24,36,.85); border: 2px solid #444; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 11px; pointer-events: none;
  transition: transform .08s linear; backdrop-filter: blur(4px);
}
.agent-card.champion { border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
#export-area { position: fixed; bottom: 12px; left: 12px; right: 12px; display: none; }
#export-area textarea { width: 100%; height: 80px; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
