:root { --bg:#0b0e14; --fg:#e6edf3; --accent:#58a6ff; --card:#161b22; }

.portal { position:absolute; width:72px; height:48px; background:var(--card); border:1px solid #30363d; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:grab; user-select:none; transform:translate(-50%,-50%); will-change:transform; box-shadow:0 4px 12px rgba(0,0,0,.4); }
.portal.pinned { border-color:var(--accent); background:#1c2a40; }
#hud { position:absolute; top:12px; left:12px; background:rgba(22,27,34,.85); padding:8px 12px; border-radius:8px; z-index:10; }
button { background:#21262d; color:var(--fg); border:1px solid #30363d; padding:4px 10px; border-radius:6px; cursor:pointer; }
button:hover { background:#30363d; }
#canvas { position:absolute; inset:0; pointer-events:none; }
#status { font-size:12px; opacity:.8; }
</style>
