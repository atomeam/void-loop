<style>
:root { --bg: #0a0a12; --fg: #e0e0ff; --accent: #6cf; --portal: #f6c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; height: 100vh; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.portal { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,100,200,0.25); border: 2px solid var(--portal); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: grab; user-select: none; backdrop-filter: blur(4px); z-index: 2; transition: transform 0.1s; }
.portal.neg { background: rgba(100,200,255,0.25); border-color: var(--accent); }
.portal:active { cursor: grabbing; transform: scale(1.1); }
#ui { position: absolute; top: 12px; left: 12px; z-index: 3; background: rgba(10,10,18,0.7); padding: 10px 14px; border-radius: 12px; max-width: 280px; }
button { background: #222; color: var(--fg); border: 1px solid #444; padding: 6px 12px; margin: 4px 4px 4px 0; border-radius: 6px; cursor: pointer; }
button:hover { background: #333; }
#status { font-size: 12px; opacity: 0.8; margin-top: 6px; }
</style>
