<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --hue: 200;
    --density: 0.3;
    --conf: 0.5;
    --border: 12px;
  }
  body {
    margin: 0;
    background: hsl(var(--hue), 30%, 8%);
    color: #eee;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    transition: background 0.6s ease;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
  }
  .hud {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.55);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid hsl(var(--hue), 60%, 40%);
    z-index: 10;
  }
  .cards {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .card {
    position: absolute;
    width: 140px;
    height: 90px;
    background: hsla(var(--hue), 40%, 20%, 0.7);
    border: 2px solid hsl(var(--hue), 70%, 55%);
    border-radius: calc(var(--border) * 0.5);
    padding: 8px;
    font-size: 12px;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.5s;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .card h4 { margin: 0 0 4px; font-size: 13px; }
  .controls {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  button {
    background: hsl(var(--hue), 50%, 25%);
    color: #fff;
    border: 1px solid hsl(var(--hue), 60%, 50%);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: hsl(var(--hue), 50%, 35%); }
  .seals { max-height: 80px; overflow: auto; font-size: 11px; margin-top: 4px; }
  .note { font-size: 11px; opacity: 0.7; }
</style>

<body>

</div>
<div class="cards" id="cards"></div>
<div class="controls">
