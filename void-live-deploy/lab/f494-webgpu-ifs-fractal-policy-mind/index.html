<style>
:root { --complexity: 0.3; --hue: 220; --energy: 0.4; }

canvas { display:block; position:absolute; inset:0; width:100%; height:100%; }
#portals { position:absolute; inset:0; pointer-events:none; }

header { position:absolute; top:12px; left:12px; z-index:10; background:hsla(0,0%,0%,0.55); padding:8px 14px; border-radius:8px; }
button { margin:0 6px; padding:6px 10px; background:#222; color:#eee; border:1px solid #555; border-radius:4px; cursor:pointer; }
button:hover { background:#333; }
#status { position:absolute; bottom:12px; left:12px; font-size:13px; opacity:0.8; z-index:10; }
