<meta charset="UTF-8">

<style>
  :root { --hue: 200; --morph: 0; --intent-x: 0; --intent-y: 0; }
  body {
    margin: 0; background: hsl(var(--hue), 30%, 7%); color: #eee;
    font-family: system-ui, sans-serif; overflow: hidden;
    transition: background 0.7s, filter 0.5s;
    filter: hue-rotate(calc(var(--morph) * 60deg)) brightness(calc(1 + var(--morph) * 0.1));
  }
  #void { position: absolute; inset: 0; display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6);
    padding: 12px 16px; border-radius: 14px; backdrop-filter: blur(8px);
    transform: translate(calc(var(--intent-x) * 40px), calc(var(--intent-y) * 30px)) scale(calc(1 + var(--morph) * 0.12));
    border: 1px solid hsl(var(--hue), 70%, 55%);
    transition: transform 0.5s, border-color 0.5s;
    max-width: 280px;
  }
  button { margin: 4px; padding: 6px 12px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 8px; cursor: pointer; }
  button:hover { background: #2a2a2a; }
  #status { font-size: 12px; opacity: 0.85; margin-top: 8px; line-height: 1.3; }
</style>
