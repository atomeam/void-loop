#stage { position:relative; width:100vw; height:100vh; perspective:800px; }
.card {
  position:absolute; width:90px; height:120px; border-radius:12px;
  background:linear-gradient(145deg,#1a1a2e,#16213e);
  border:2px solid #4cc9f0; box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  font-size:12px; text-align:center; cursor:pointer; user-select:none;
  transition:border-color .2s, transform .05s linear;
  transform-style:preserve-3d;
}
.card .fit { font-size:10px; opacity:.7; margin-top:4px; }
canvas { position:absolute; inset:0; pointer-events:none; }

button { margin:4px; padding:6px 10px; background:#4cc9f0; border:none; border-radius:6px; color:#000; font-weight:600; cursor:pointer; }
button:hover { background:#7dd3fc; }
#status { font-size:12px; margin-top:4px; opacity:.8; }
