<style>
  :root {
    --hue: 200;
    --blur: 0px;
    --scale: 1;
    --bright: 1;
  }
  body {
    margin: 0;
    background: #0a0a12;
    color: #e0e0ff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    filter: hue-rotate(var(--hue)) blur(var(--blur)) brightness(var(--bright));
    transform: scale(var(--scale));
    transform-origin: center;
    transition: filter 0.4s, transform 0.4s;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 8px 12px;
    background: rgba(0,0,0,0.6); border-radius: 8px; font-size: 13px;
    pointer-events: none; backdrop-filter: blur(4px);
  }
  #seal {
    position: fixed; bottom: 12px; right: 12px; padding: 6px 10px;
    background: rgba(0,40,80,0.7); border-radius: 6px; font-size: 12px;
    cursor: pointer; pointer-events: auto;
  }
  button { pointer-events: auto; }
</style>
