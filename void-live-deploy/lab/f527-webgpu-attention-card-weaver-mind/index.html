#stage { position:relative; width:100vw; height:100vh; }
.card {
  position:absolute; width:140px; height:90px; background:#1a1a2e; border:2px solid #4af;
  border-radius:12px; padding:8px; cursor:grab; user-select:none;
  box-shadow:0 0 15px #4af4; transition:box-shadow 0.2s;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  font-size:13px; text-align:center;
}
.card.grasped { box-shadow:0 0 25px #f4a; border-color:#f4a; }
.card:active { cursor:grabbing; }
#links { position:absolute; top:0; left:0; pointer-events:none; }
#ui { position:absolute; top:12px; left:12px; z-index:10; background:rgba(0,0,0,0.6); padding:10px; border-radius:8px; font-size:12px; }
button { background:#4af; color:#000; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; margin:4px; }
#status { margin-top:6px; opacity:0.8; }
