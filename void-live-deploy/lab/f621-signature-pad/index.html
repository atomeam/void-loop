<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --text: #e8eaed;
    --accent: #5b9cff;
    --pad-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0.5rem 0 1rem; font-weight: 600; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 0.8rem;
    justify-content: center;
  }
  label { font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; }
  input[type="color"] { width: 2.2rem; height: 2.2rem; border: none; background: none; cursor: pointer; }
  input[type="range"] { width: 100px; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pad-wrap {
    background: var(--panel);
    padding: 0.5rem;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: var(--pad-bg);
    border-radius: 6px;
    touch-action: none;
    cursor: crosshair;
    max-width: 100%;
  }
  .gallery {
    margin-top: 1.2rem;
    width: 100%;
    max-width: 700px;
  }
  .gallery h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  .thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }
  .thumb {
    width: 120px;
    height: 70px;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    position: relative;
  }
  .thumb:hover, .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 4px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status { font-size: 0.8rem; opacity: 0.7; margin-top: 0.5rem; text-align: center; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Signature pad · Verse lab</title>
<meta name="description" content="Job: Draw your signature with a mouse or finger on a clean pad, then download a transparent PNG ready to paste into a form or document.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Signature pad · Verse lab">
<meta property="og:description" content="Job: Draw your signature with a mouse or finger on a clean pad, then download a transparent PNG ready to paste into a form or document.">
<meta property="og:url" content="https://a-to-mind.com/lab/f621-signature-pad/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f621-signature-pad/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
  <h1>Signature pad</h1>
  <div class="controls">
    <label>Colour <input type="color" id="color" value="#111111"></label>
    <label>Thickness <input type="range" id="width" min="1" max="16" value="3"></label>
    <button id="clear">Clear</button>
    <button id="undo">Undo</button>
    <button id="save">Save to gallery</button>
    <button id="download" class="primary">Download PNG</button>
  </div>
  <div class="pad-wrap">
    <canvas id="pad" width="640" height="280"></canvas>
  </div>
  <div class="status" id="status">Draw with mouse, pen or finger. Download a transparent PNG.</div>
  <div class="gallery">
    <h2>Recent on this device</h2>
    <div class="thumbs" id="thumbs"></div>
  </div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
