<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
:root { --bg:#0f1115; --fg:#e8e8e8; --muted:#888; --accent:#4dabf7; --border:#333; --card:#1a1d24; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, sans-serif; padding:12px; max-width:900px; margin:0 auto; }
h1 { font-size:1.4rem; margin:0 0 8px; font-weight:600; }
p.lead { color:var(--muted); margin:0 0 16px; font-size:0.95rem; }
label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:4px; }
input[type=number], input[type=text], select { width:100%; background:#1a1d24; color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:8px; font:14px system-ui; }
.room { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
.room-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-bottom:8px; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
button { background:var(--accent); color:#000; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.9rem; }
button.secondary { background:#333; color:var(--fg); }
button.danger { background:#c92a2a; color:#fff; }
canvas { width:100%; max-width:400px; height:120px; background:#111; border-radius:6px; margin-top:8px; display:block; }
.status { font-size:0.8rem; color:var(--muted); margin-top:8px; }
.summary { background:#1a1d24; border:1px solid var(--border); border-radius:8px; padding:12px; margin-top:12px; }
</style>
<meta name="verse-handoff" content="in: none; out: none">
<title>Paint estimator · Verse lab</title>
<meta name="description" content="Job: Enter room dimensions, number of doors and windows, coats of paint and coverage.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="Paint estimator · Verse lab">
<meta property="og:description" content="Job: Enter room dimensions, number of doors and windows, coats of paint and coverage.">
<meta property="og:url" content="https://a-to-mind.com/lab/f627-paint-estimator/">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://a-to-mind.com/lab/f627-paint-estimator/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lab/lab.css">
<style>@media (prefers-reduced-motion: no-preference){@view-transition{navigation:auto}}</style>
<script src="/visit.js" defer></script>
</head>
<body>
<h1>Paint Estimator</h1>
<p class="lead">Enter room sizes, doors, windows and coats. See paint needed and a wall preview. Copy or download the list. Everything stays on this device.</p>

<div class="controls">
  <label style="margin:0"><input type="radio" name="units" value="imp" checked> Imperial (ft / gal)</label>
  <label style="margin:0"><input type="radio" name="units" value="met"> Metric (m / L)</label>
  <button id="addRoom" class="secondary">+ Add room</button>
</div>

<div id="rooms"></div>

<div class="summary" id="summary">Total paint will appear here.</div>

<div class="controls">
  <button id="copy">Copy shopping list</button>
  <button id="dlTxt" class="secondary">Download .txt</button>
  <button id="dlCsv" class="secondary">Download CSV</button>
  <button id="share" class="secondary">Copy share link</button>
  <button id="clear" class="secondary">Clear all</button>
</div>
<div class="status" id="status">Ready. Offline after load. No data leaves this device.</div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
