<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root { --bg: #0a0a12; --card: #1a1a2e; --accent: #6cf; }
  body { margin: 0; background: var(--bg); color: #eee; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #canvas { position: relative; width: 100%; height: 100%; }
  .card {
    position: absolute; width: 140px; height: 90px; background: var(--card);
    border: 1px solid #333; border-radius: 12px; padding: 12px; box-sizing: border-box;
    transition: transform 0.15s ease, background 0.3s; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; justify-content: center; font-size: 13px;
  }
  .card h3 { margin: 0 0 4px; font-size: 14px; color: var(--accent); }
  .card p { margin: 0; opacity: 0.7; font-size: 11px; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px; font-size: 12px; z-index: 10; }
  #hud button { margin-right: 8px; padding: 4px 10px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  #hud button:hover { background: #333; }
  #status { margin-top: 6px; opacity: 0.8; }
</style>
