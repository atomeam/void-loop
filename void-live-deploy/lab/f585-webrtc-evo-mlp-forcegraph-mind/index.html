  .node.agent0 { border-color: #f44; }

  .node.agent3 { border-color: #ff4; }

  button, textarea { background: #222; color: #eee; border: 1px solid #555; margin: 2px; padding: 4px 8px; border-radius: 4px; }
  textarea { width: 100%; height: 60px; font-size: 10px; }
