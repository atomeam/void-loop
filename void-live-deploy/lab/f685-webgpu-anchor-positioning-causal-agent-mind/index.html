<meta charset="UTF-8">

<style>
  :root { --bg: #0a0c10; --fg: #e0e6f0; --accent: #5ce1e6; --card: #161b22; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .portal {
    position: absolute; width: 140px; height: 90px; background: var(--card);
    border: 1px solid #2a3440; border-radius: 12px; padding: 8px; font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); cursor: grab; z-index: 10;
    transition: border-color .2s, transform .1s;
    anchor-name: --agent; /* will be overridden per portal */
  }
  .portal:hover { border-color: var(--accent); }
  .portal.dragging { cursor: grabbing; z-index: 20; }
  .portal h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); }
  .portal p { margin: 0; opacity: .7; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 30; background: rgba(10,12,16,.75);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; backdrop-filter: blur(4px); }
  button, label { margin: 4px; padding: 6px 10px; background: #1c2330; color: var(--fg);
    border: 1px solid #2a3440; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { font-size: 11px; opacity: .6; margin-top: 6px; }
</style>
