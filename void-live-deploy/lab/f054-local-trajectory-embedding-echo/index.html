<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --echo-hue: 200;
  --echo-scale: 1;
  --residual-blur: 0px;
  --confidence: 0.5;
}
body {
  margin: 0;
  overflow: hidden;
  background: #0a0a12;
  color: #eee;
  font-family: system-ui, sans-serif;
  filter: hue-rotate(calc(var(--echo-hue) * 1deg)) blur(var(--residual-blur));
  transform: scale(var(--echo-scale));
  transform-origin: center;
  transition: filter 0.3s, transform 0.3s;
}
canvas { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed;
  top: 12px; left: 12px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  pointer-events: none;
}
#seal {
  position: fixed;
  bottom: 12px; right: 12px;
  padding: 8px 16px;
  background: #2a2a4a;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
.card {
  position: absolute;
  background: rgba(20,20,40,0.7);
  border: 1px solid #446;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  pointer-events: none;
  transition: transform 0.2s, opacity 0.2s;
}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="verse-handoff" content="in: none; out: none">
<title>Local Trajectory Embedding Echo Field · Verse lab</title>

<canvas id="c"></canvas>
<div id="hud">Draw or tilt to record trajectories. Echoes appear from memory. Residual morphs the field.</div>
<button id="seal">Seal Memory</button>

<div id="card1" class="card" style="top:60%;left:70%">echo 1</div>
