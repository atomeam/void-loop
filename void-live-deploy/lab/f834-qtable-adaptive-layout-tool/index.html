<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
  :root { --bg: #0f1419; --card: #1a2332; --accent: #3d8bfd; --text: #e6edf3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
  #controls { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #161b22ee; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea { flex: 1; min-width: 180px; height: 48px; background: #0d1117; color: var(--text); border: 1px solid #30363d; border-radius: 6px; padding: 6px; font-size: 14px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
  button.secondary { background: #238636; }
  button:disabled { opacity: 0.5; }
  #canvas { position: relative; width: 100%; height: 100%; }
  .card { position: absolute; min-width: 120px; max-width: 200px; padding: 10px 12px; background: var(--card); border-radius: 10px; box-shadow: 0 4px 12px #0006; cursor: grab; user-select: none; transition: transform 0.15s; font-size: 14px; line-height: 1.3; border: 2px solid transparent; }
  .card:active { cursor: grabbing; }
  .card .fit { font-size: 11px; opacity: 0.7; margin-top: 4px; }
  #status { position: fixed; bottom: 8px; left: 8px; font-size: 12px; opacity: 0.8; background: #0008; padding: 4px 8px; border-radius: 4px; }
</style>

<body>
<div id="controls">
  <textarea id="input" placeholder="Paste tasks or notes, one per line…"></textarea>
  <button id="spawn">Spawn cards</button>
  <button id="seal" class="secondary">Seal best</button>
  <button id="copy">Copy ordered</button>
  <button id="download">Download JSON</button>
</div>
<div id="canvas"></div>
<div id="status">Tilt device or move pointer · click cards to reinforce · Seal to persist</div>
