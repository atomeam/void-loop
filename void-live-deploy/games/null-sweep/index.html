<!doctype html>
<html lang="en" class="vs-tool">
<head>
<meta charset="utf-8">
<meta name="verse-handoff" content="in: none; out: none">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Null Sweep · Verse</title>
<meta name="description" content="Verse's own full-screen minesweeper: the first click is always safe, there is no timer, and your cleared-board streak stays on this device.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;background:#05050a;color:#e8e6f5;font:13px/1.4 ui-monospace,monospace;overflow:hidden}
  #c{position:absolute;image-rendering:pixelated;background:#07060f;touch-action:none}
  #hud{position:absolute;left:8px;top:8px;display:flex;gap:14px;background:#0b1020dd;border:2px solid #7aa7ff;padding:4px 10px;pointer-events:none}
  #bar{position:absolute;right:8px;top:8px;display:flex;gap:6px}
  button{font:inherit;background:#151a33;color:#e8e6f5;border:1px solid #7aa7ff;border-radius:6px;padding:6px 9px;min-height:36px;cursor:pointer}
  #msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(92vw,540px);background:#0b1020ee;border:2px solid #a58bff;padding:6px 10px}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="hud"><span id="cleared">Cleared 0</span><span id="streak">Streak 0</span><span id="mines">Mines 12</span></div>
<div id="bar"><button id="mute">Sound on</button><button id="flag">Flag: off</button><button id="new">New board</button></div>
<div id="msg">Tap to reveal. The first tap is always safe. Right-click or switch Flag on to mark a mine. No timer — take your time.</div>
<script type="module" src="/games/null-sweep/app.js"></script>
</body>
</html>
