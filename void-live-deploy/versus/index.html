<!doctype html>
<html lang="en" class="vs-tool">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Versus · Verse</title>
<meta name="description" content="Versus.">
<link rel="stylesheet" href="/verse.css">
<link rel="stylesheet" href="/versus/layout.css">
<link rel="canonical" href="https://a-to-mind.com/versus/">
<meta property="og:title" content="Versus · Verse">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="verse-handoff" content="in: none; out: none">
<!-- modulepreload: tools/preload.mjs -->
<link rel="modulepreload" href="/versus/open.js">
<link rel="modulepreload" href="/lib/owner-link.js">
<!-- /modulepreload -->
</head>
<body>
<main id="elv-root">
  <div class="elv" data-owner="0"><div class="elv-doors" aria-hidden="true"><span class="elv-door"></span><span class="elv-seam"></span><span class="elv-door"></span></div><h1 class="elv-sign"><span class="elv-tape" aria-hidden="true"></span>Out of Order</h1></div>
</main>
<script type="module">
import { ownerModel, ownerToken } from '/versus/open.js';
const root = document.getElementById('elv-root'), q = new URLSearchParams(location.search), view = q.get('view');
const model = await ownerModel();
// the owner's views: every rival (it was /rival/) and the side-by-side (it was /compare/). Anyone else only ever gets the sign above.
if (model && view === 'rival') await (await import('/versus/rivals.js')).renderRivals(root, location.search, await ownerToken());
else if (model && view === 'compare') (await import('/versus/compare.js')).renderCompare(root, location.search);
else if (model && view === 'assimilated') (await import('/versus/assimilated.js')).renderAssimilated(root);
else if (model) {
  const { ownerHtml } = await import('/lib/versus-floor.js');
  root.innerHTML = ownerHtml(model) + '<nav class="elv-views" aria-label="More on Versus"><a href="/versus/?view=rival">Every rival</a> · <a href="/versus/?view=compare">Side by side</a> · <a href="/versus/?view=assimilated">Assimilated</a></nav>'; // void-review: ok (ownerHtml runs every value through esc; the links are fixed)
}
</script>
<script type="module" src="/verse-shell.js"></script>
</body>
</html>
