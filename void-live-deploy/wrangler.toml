name = "a-to-mind"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Shared miss list (asks Void couldn't answer yet). Create once:
#   npx wrangler kv namespace create MISSES   -> paste the id below
# Secrets once: npx wrangler pages secret put READ_TOKEN --project-name=a-to-mind
#               npx wrangler pages secret put SALT --project-name=a-to-mind
# Paid Void + the store (plan item 12): npx wrangler pages secret put GUMROAD_PING_KEY --project-name=a-to-mind      (any long random string; also in the Ping URL)
#                                       optional: GUMROAD_ACCESS_TOKEN (Gumroad app token, view_sales) = read each sale back from the API;
#                                       without it a keyed ping with Atom's seller_id (lib/gumroad.js SELLER_IDS) is trusted. Optional GUMROAD_SELLER_ID overrides it.
[[kv_namespaces]]
binding = "MISSES"
id = "95b089f5717a4793b2b52a852f2a8443"

# Void's queue + miss list (D1, 100k writes/day free). Reuses the old a-to-mind-board database.
[[d1_databases]]
binding = "DB"
database_name = "a-to-mind-board"
database_id = "3f92c99d-b78a-4394-8bb5-d9945ded44cf"


# Answer engine (plan item 2): Workers AI, free Gemma 4 26B
[ai]
binding = "AI"
# VOID_ANSWER_MODELS  on = /api/answer uses Workers AI (Gemma default + the router below) and writes D1 (answer cache,
#   route log, counters). Unset/off = main's open-web answers: no Workers AI, no D1 writes (0ff8643).
# Router (lib/router.js), optional Pages env vars, read only when VOID_ANSWER_MODELS=on:
#   VOID_ROUTER_TUNE   JSON thresholds, e.g. {"skillMin":0.72,"hardMin":0.6}  (tune from GET /api/routes scores)
#   VOID_ESCALATE      off = hard asks never escalate (logged as "would escalate")
#   VOID_ESCALATE_CAP  escalations to Qwen 3.8 27B per day (default 10)
#   VOID_AI_PLAN       set to paid after moving to Workers Paid: escalation stops (it would bill) until someone says yes
