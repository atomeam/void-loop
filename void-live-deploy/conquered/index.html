<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Tower · Verse</title>
<meta name="description" content="Verse's tower: the site it is on now and every site it has conquered.">
<style>
  /* a-to-mind.com/conquered (owner, 2026-10-24: "current target at the top, conquered sites stacked underneath, and nothing rendered above it"):
     the same tower as the card (skills/tower.js towerHtml), full screen, left open and kept current */
  html, body { margin: 0; min-height: 100%; background: #07060b; color: #ecebf5; font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  main { padding: 18px 12px 30px; }
  .tw-stack { max-height: none !important; overflow: visible !important; }
  #stamp { text-align: center; font-size: 11px; opacity: .5; margin-top: 8px; }
  a { color: inherit; }
</style>
<!-- modulepreload: tools/preload.mjs -->
<link rel="modulepreload" href="/lib/tower.js">
<link rel="modulepreload" href="/skills/tower.js">
<!-- /modulepreload -->
</head>
<body>
<main><div id="tower">Reading the tower…</div><div id="stamp"></div></main>
<script type="module">
  import { tower } from '/lib/tower.js';
  import { towerHtml, detailText } from '/skills/tower.js';
  const $ = (id) => document.getElementById(id), esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const get = (u) => fetch(u, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  async function draw() {
    const [inv, ev, fr] = await Promise.all([get('/lap.items.json'), get('/tower.evidence.json'), get('/tower.frontier.json')]);
    const t = tower((inv && inv.onlySite) || [], (ev && ev.floors) || {}, fr);
    $('tower').innerHTML = towerHtml(t, esc); $('stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
    for (const b of $('tower').querySelectorAll('.tower-floor')) b.onclick = () => { const f = t.floors.find((x) => x.floor === +b.dataset.floor); if (f) $('tower').querySelector('.tower-detail').textContent = detailText(f); };
  }
  draw(); setInterval(() => { if (document.visibilityState === 'visible') draw(); }, 30000);
</script>
</body>
</html>
