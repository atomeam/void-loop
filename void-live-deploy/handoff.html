<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<title>Handoff · Void</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#050505;color:#d8d8dc;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
input,textarea,button{font:inherit;color:inherit;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 16px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #7cf;outline-offset:2px}
#q{width:min(560px,100%);border-radius:24px;text-align:center}
#q::placeholder{color:#666}
button{cursor:pointer}button:hover{border-color:rgba(255,255,255,.4)}
#card{width:min(760px,100%);display:none;flex-direction:column;gap:12px}
#card.on{display:flex}
#meta{color:#8a8a92;font-size:13px;overflow-wrap:anywhere}
pre{margin:0;padding:16px;max-height:55vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
#drop{width:min(760px,100%);display:none;flex-direction:column;gap:10px}
#drop.on{display:flex}
textarea{min-height:160px;resize:vertical}
#msg{min-height:1.4em;color:#8a8a92;font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){#card.on,#drop.on{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
  <input id="q" type="text" placeholder="paste a handoff link or id  ·  or type drop" autocomplete="off" autofocus aria-label="Handoff link, id, or the word drop">
  <div id="msg" role="status" aria-live="polite"></div>
  <section id="card" aria-label="Handoff">
    <div id="meta"></div>
    <pre id="body" tabindex="0"></pre>
    <div class="row"><button id="copy" type="button">copy</button><button id="save" type="button">download</button></div>
  </section>
  <section id="drop" aria-label="Drop a file">
    <input id="dn" type="text" placeholder="file name (letters, digits . _ - space)" autocomplete="off" aria-label="File name">
    <textarea id="db" placeholder="paste the file or report (plain text)" aria-label="File contents"></textarea>
    <input id="dt" type="password" placeholder="write token (kept in this tab only)" autocomplete="off" aria-label="Write token">
    <div class="row"><button id="send" type="button">drop it</button></div>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var q=$('q'),msg=$('msg'),card=$('card'),drop=$('drop'),cur=null;
  function say(t){msg.textContent=t||''}
  function idFrom(s){var m=String(s).match(/[a-f0-9]{32}/i);return m?m[0].toLowerCase():null}
  function ago(t){var s=Math.max(0,Math.floor(Date.now()/1000)-t);if(s<90)return s+'s ago';if(s<5400)return Math.round(s/60)+'m ago';if(s<172800)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'}
  function show(d){
    cur=d;drop.classList.remove('on');card.classList.add('on');
    $('meta').textContent=d.name+(d.author?'  ·  '+d.author:'')+'  ·  '+ago(d.created)+'  ·  expires '+new Date(d.expires*1000).toLocaleDateString();
    $('body').textContent=d.body;say('');
  }
  function load(id){
    say('opening…');card.classList.remove('on');
    fetch('/api/handoff?id='+id,{cache:'no-store'}).then(function(r){
      if(r.status===404)throw new Error('not found, or it has expired');
      if(!r.ok)throw new Error('could not open (status '+r.status+')');
      return r.json();
    }).then(show).catch(function(e){say(e.message)});
  }
  q.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var v=q.value.trim();if(!v)return;
    if(v.toLowerCase()==='drop'){card.classList.remove('on');drop.classList.add('on');say('');$('dn').focus();q.value='';return}
    var id=idFrom(v);if(!id){say('that does not look like a handoff link');return}
    history.replaceState(null,'','?id='+id);load(id);q.value='';
  });
  $('copy').addEventListener('click',function(){
    if(!cur)return;
    (navigator.clipboard?navigator.clipboard.writeText(cur.body):Promise.reject()).then(function(){say('copied')},function(){say('copy blocked by the browser')});
  });
  $('save').addEventListener('click',function(){
    if(!cur)return;
    var a=document.createElement('a'),u=URL.createObjectURL(new Blob([cur.body],{type:'text/plain'}));
    a.href=u;a.download=cur.name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
  });
  $('send').addEventListener('click',function(){
    var name=$('dn').value.trim(),body=$('db').value,tok=$('dt').value;
    if(!name||!body||!tok){say('name, contents and token are all needed');return}
    say('dropping…');
    fetch('/api/handoff',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({name:name,author:'web',body:body})})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
    .then(function(x){
      if(!x.ok)throw new Error(x.j&&x.j.error?x.j.error:'failed');
      $('db').value='';$('dt').value='';
      history.replaceState(null,'','?id='+x.j.id);load(x.j.id);
      if(navigator.clipboard)navigator.clipboard.writeText(location.origin+'/api/handoff?id='+x.j.id+'&raw=1').catch(function(){});
    }).catch(function(e){say(e.message)});
  });
  var start=idFrom(location.search);if(start)load(start);
})();
</script>
</body>
</html>
