<body>
<main id="card"><h2>Flip a coin</h2><noscript><p style="text-align:center">The coin needs JavaScript to flip.</p></noscript></main>
  <nav id="related" aria-label="Related tools"><!-- related --><span class="tk-label">Use with</span> <a href="/wheel/">Wheel of names</a> <a href="/random/">Random number</a> <a href="/tools/">All tools</a><!-- /related --></nav>
<footer><a href="/flip/?q=flip+a+famous+coin">Flip a real coin from history</a> · <a href="/flip/?q=create+a+coin">Make your own coin</a> · <a href="/">Ask Verse anything</a></footer>
<script type="module">
  import coin from '/skills/coin.js';
  const card = document.getElementById('card');
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const ask = (q) => { const t = String(q || '').trim(); return coin.match(t.toLowerCase(), t) ? t : 'flip a coin'; };
  const api = {
    esc,
    showPage(build) { card.innerHTML = ''; build(card); return card; },
    say: null,
    // a coin ask stays on this page; anything else goes to Verse
    stage: { ask(q) { const t = String(q || ''); if (coin.match(t.toLowerCase(), t)) { history.pushState(null, '', '/flip/?q=' + encodeURIComponent(t)); coin.run(t, api); } else location.href = '/?q=' + encodeURIComponent(t); } },
  };
  coin.run(ask(new URLSearchParams(location.search).get('q') || 'flip a coin'), api);
  addEventListener('popstate', () => coin.run(ask(new URLSearchParams(location.search).get('q') || 'flip a coin'), api));
  // the space bar or Enter flips again, as a coin site should
  addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !/^(input|select|textarea|button)$/i.test(e.target.tagName)) { e.preventDefault(); const b = card.querySelector('.coin-again'); if (b) b.click(); } });
  // share this page (the tower's sharing aspect): the phone's own share sheet where there is one, else the link copied; the address keeps the coin
  const share = () => { const url = location.href, title = document.title;
    if (navigator.share) { navigator.share({ title, url }).catch(() => {}); return ''; }
    try { navigator.clipboard.writeText(url); return 'Link copied'; } catch (_) { return 'Copy the address bar'; } };
  // the "Use with" row comes after the load event, which the tower times: nothing a person is not waiting for loads before it
  addEventListener('load', () => { Promise.all([import('/lib/toolkit.js'), import('/lib/flip-card.js')]).then(([m, f]) => m.mountRelated(document.getElementById('related'), '/flip/', [{ label: 'Share this coin', run: share }], { card: () => f.cardAsk(location.search) })).catch(() => {}); });
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); }); // opens offline after one visit (sw.js TOOLS)</script>
</body>
