# Copy to .github/workflows/bot-factory.yml (needs a token with the workflow scope).
# Every hour Verse grows new bots with free Workers AI, gates them (probe must pass), and opens a helper/* PR that automerges when green.
name: bot-factory
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: write, pull-requests: write }
concurrency: { group: bot-factory, cancel-in-progress: false }
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Grow and gate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node tools/bot-factory.mjs --grow 20 && node --test tools/bot-factory.test.mjs
      - name: Open a PR when bots were added
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          git diff --quiet -- void-live-deploy/bots && exit 0
          b=helper/bot-factory-$(date -u +%Y%m%d%H%M)
          git config user.name verse-bot && git config user.email verse-bot@users.noreply.github.com
          git checkout -b "$b" && git add void-live-deploy/bots && git commit -m "Bot factory: new bots that passed their probes" && git push -u origin "$b"
          gh pr create --head "$b" --title "Bot factory: $(node -p "require('./void-live-deploy/bots/registry.json').live") bots live" --body "Grown by tools/bot-factory.mjs --grow; only bots whose probe passed are live."
