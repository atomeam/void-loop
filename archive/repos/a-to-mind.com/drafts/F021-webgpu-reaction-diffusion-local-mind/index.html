<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F021 Void Reaction-Diffusion Local Mind</title>
<style>
:root {
  --border-w: 4px;
  --hue: 220;
  --card-scale: 1;
  --card-x: 20px;
  --card-y: 20px;
  --bg: #0a0a12;
}
body {
  margin: 0;
  background: var(--bg);
  color: #e0e0ff;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  border: var(--border-w) solid hsl(var(--hue), 70%, 50%);
  transition: border-width 0.3s, border-color 0.5s, background 0.5s;
  box-sizing: border-box;
  height: 100vh;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
#card {
  position: fixed;
  left: var(--card-x);
  top: var(--card-y);
  transform: scale(var(--card-scale));
  transform-origin: top left;
  background: rgba(10, 10, 20, 0.85);
  border: 1px solid hsl(var(--hue), 60%, 60%);
  padding: 12px 16px;
  border-radius: 8px;
  backdrop-filter: blur(4px);
  transition: transform 0.4s, border-color 0.5s;
  max-width: 280px;
  z-index: 10;
}
#card h3 { margin: 0 0 8px; font-size: 1rem; }
#status { font-size: 0.9rem; min-height: 1.2em; }
button {
  background: hsl(var(--hue), 50%, 40%);
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 8px;
}
button:hover { filter: brightness(1.2); }
#seals { font-size: 0.75rem; margin-top: 8px; max-height: 100px; overflow-y: auto; }
#fallback-note { position: fixed; bottom: 10px; left: 10px; font-size: 0.8rem; opacity: 0.7; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="card">
  <h3>Void Mind</h3>
  <div id="status">Initializing substrate…</div>
  <button id="seal">Seal interpretation</button>
  <button id="clear">Clear field</button>
  <div id="seals"></div>
</div>
<div id="fallback-note"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const sealsEl = document.getElementById('seals');
const noteEl = document.getElementById('fallback-note');

let W = 128, H = 128;
let grid, next;
let painting = false;
let mouseX = 0, mouseY = 0;

// Gray-Scott params (mitosis-like)
const Du = 0.16, Dv = 0.08, f = 0.0545, k = 0.062;

function initGrid() {
  grid = new Float32Array(W * H * 2);
  next = new Float32Array(W * H * 2);
  for (let i = 0; i < W * H; i++) {
    grid[i*2] = 1.0;     // A
    grid[i*2+1] = 0.0;   // B
  }
  // sparse seeds
  for (let s = 0; s < 8; s++) {
    const x = Math.floor(Math.random() * W);
    const y = Math.floor(Math.random() * H);
    const i = (y * W + x) * 2;
    grid[i+1] = 1.0;
  }
}

function idx(x, y) { return ((y + H) % H * W + (x + W) % W) * 2; }

function step() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const A = grid[i], B = grid[i+1];
      // Laplacian (5-point)
      let lapA = -4 * A, lapB = -4 * B;
      lapA += grid[idx(x+1,y)] + grid[idx(x-1,y)] + grid[idx(x,y+1)] + grid[idx(x,y-1)];
      lapB += grid[idx(x+1,y)+1] + grid[idx(x-1,y)+1] + grid[idx(x,y+1)+1] + grid[idx(x,y-1)+1];
      const reaction = A * B * B;
      next[i]   = A + (Du * lapA - reaction + f * (1 - A));
      next[i+1] = B + (Dv * lapB + reaction - (k + f) * B);
      next[i]   = Math.max(0, Math.min(1, next[i]));
      next[i+1] = Math.max(0, Math.min(1, next[i+1]));
    }
  }
  [grid, next] = [next, grid];
}

function paint(mx, my) {
  const cx = Math.floor(mx / canvas.width * W);
  const cy = Math.floor(my / canvas.height * H);
  const r = 3;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx + dy*dy <= r*r) {
        const i = idx(cx + dx, cy + dy);
        grid[i+1] = 1.0;
      }
    }
  }
}

function render() {
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const B = grid[i*2+1];
    const v = Math.floor(B * 255);
    img.data[i*4]   = v;
    img.data[i*4+1] = Math.floor(v * 0.6);
    img.data[i*4+2] = 255 - v;
    img.data[i*4+3] = 255;
  }
  // scale to canvas
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

// Stats for the mind
function computeStats() {
  let sumB = 0, sumB2 = 0, edges = 0;
  for (let i = 0; i < W * H; i++) {
    const B = grid[i*2+1];
    sumB += B;
    sumB2 += B * B;
    // crude edge
    if (i % W > 0 && Math.abs(B - grid[(i-1)*2+1]) > 0.2) edges++;
  }
  const n = W * H;
  const mean = sumB / n;
  const variance = sumB2 / n - mean * mean;
  const edgeDensity = edges / n;
  return { mean, variance, edgeDensity };
}

// Simple classifier (in main for demo; could be Worker)
function classify(stats) {
  const { mean, variance, edgeDensity } = stats;
  if (variance < 0.01) return { class: 'uniform', confidence: 0.9 };
  if (edgeDensity > 0.15 && variance > 0.05) return { class: 'labyrinth', confidence: 0.7 };
  if (variance > 0.08 && mean > 0.2) return { class: 'spots', confidence: 0.75 };
  if (edgeDensity > 0.08) return { class: 'stripes', confidence: 0.6 };
  return { class: 'emerging', confidence: 0.5 };
}

// IndexedDB
let db;
const req = indexedDB.open('void-patterns', 1);
req.onupgradeneeded = e => {
  e.target.result.createObjectStore('seals', { keyPath: 'id', autoIncrement: true });
};
req.onsuccess = e => { db = e.target.result; loadSeals(); };

function seal() {
  if (!db) return;
  const stats = computeStats();
  const cls = classify(stats);
  const hash = btoa(JSON.stringify(stats)).slice(0, 12);
  const entry = { ts: Date.now(), class: cls.class, confidence: cls.confidence, hash, stats };
  const tx = db.transaction('seals', 'readwrite');
  tx.objectStore('seals').add(entry);
  tx.oncomplete = loadSeals;
  statusEl.textContent = `Sealed: ${cls.class} (${hash})`;
}

function loadSeals() {
  if (!db) return;
  const tx = db.transaction('seals', 'readonly');
  const store = tx.objectStore('seals');
  const req = store.getAll();
  req.onsuccess = () => {
    const items = req.result.slice(-5).reverse();
    sealsEl.innerHTML = items.map(s => 
      `<div>${new Date(s.ts).toLocaleTimeString()} · ${s.class} · ${s.hash}</div>`
    ).join('') || '<div>No seals yet</div>';
  };
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
initGrid();

// Interaction
canvas.addEventListener('mousedown', e => { painting = true; mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; if (painting) paint(mouseX, mouseY); });
window.addEventListener('mouseup', () => painting = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); painting = true; const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY; }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; mouseX = t.clientX; mouseY = t.clientY; if (painting) paint(mouseX, mouseY); }, {passive:false});

document.getElementById('seal').onclick = seal;
document.getElementById('clear').onclick = () => { initGrid(); statusEl.textContent = 'Field cleared'; };

// Mind loop
let frame = 0;
function loop() {
  step();
  if (painting) paint(mouseX, mouseY);
  render();
  if (frame % 30 === 0) {
    const stats = computeStats();
    const cls = classify(stats);
    statusEl.textContent = `Mind sees: ${cls.class} (${Math.round(cls.confidence*100)}%)`;
    // Morph UI
    document.documentElement.style.setProperty('--hue', cls.class === 'spots' ? 40 : cls.class === 'stripes' ? 180 : cls.class === 'labyrinth' ? 280 : 220);
    document.documentElement.style.setProperty('--border-w', (4 + cls.confidence * 8) + 'px');
    document.documentElement.style.setProperty('--card-scale', 0.9 + cls.confidence * 0.3);
    document.documentElement.style.setProperty('--bg', `hsl(${cls.class === 'spots' ? 30 : 220}, 20%, ${5 + cls.confidence * 5}%)`);
  }
  frame++;
  requestAnimationFrame(loop);
}

// WebGPU note
if (navigator.gpu) {
  noteEl.textContent = 'WebGPU available — Canvas2D simulation active (full compute path is a building block for next).';
} else {
  noteEl.textContent = 'WebGPU not available — using Canvas2D substrate.';
}

loop();
loadSeals();
</script>
</body>
</html>
