<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F213 · WebGPU Neural Kernel DOM Chain</title>
<style>
  :root { --bg: #0a0a0f; --card: #16161e; --accent: #6cf; --text: #e8e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 10; background: #1118; padding: 8px 12px; border-radius: 8px; font-size: 13px; backdrop-filter: blur(8px); }
  button { background: #222; color: var(--accent); border: 1px solid #444; padding: 6px 10px; border-radius: 6px; margin: 2px; cursor: pointer; }
  button:hover { background: #333; }
  #arena { position: relative; width: 100vw; height: 100vh; }
  .card {
    position: absolute; width: 120px; height: 70px; background: var(--card); border: 2px solid #333;
    border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px;
    pointer-events: none; transition: transform 0.08s linear, background 0.3s, border-color 0.3s;
    box-shadow: 0 4px 20px #0006;
  }
  .card .label { text-align: center; line-height: 1.3; }
  .status { color: #8af; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<div id="hud">
  <strong>F213 · WebGPU Neural Kernel DOM Chain</strong><br>
  <span class="status" id="status">Initializing…</span><br>
  <button id="orient">Enable Orientation</button>
  <button id="seal">Seal Leader</button>
  <button id="inject">Inject Sealed</button>
  <button id="reset">Reset Genomes</button>
  <div>Agents: <span id="count">0</span> · Mode: <span id="mode">—</span></div>
</div>
<div id="arena"></div>
<script>
const N = 6;
const cards = [];
let genomes = []; // Float32Array per agent, ~12 weights
let fitness = new Float32Array(N);
let positions = new Float32Array(N * 2);
let orientation = { beta: 0, gamma: 0 };
let hasOrient = false;
let gpu = null;
let mode = 'js';

function rand() { return Math.random() * 2 - 1; }
function makeGenome() {
  const g = new Float32Array(12);
  for (let i = 0; i < 12; i++) g[i] = rand() * 0.4;
  return g;
}
for (let i = 0; i < N; i++) genomes.push(makeGenome());

const arena = document.getElementById('arena');
for (let i = 0; i < N; i++) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<div class="label">A${i}<br><span class="fit">0</span></div>`;
  arena.appendChild(d);
  cards.push(d);
  positions[i*2] = 100 + (i % 3) * 200;
  positions[i*2+1] = 150 + Math.floor(i / 3) * 180;
}

document.getElementById('orient').onclick = () => {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(p => { if (p === 'granted') startOrient(); }).catch(() => startOrient());
  } else startOrient();
};
function startOrient() {
  window.addEventListener('deviceorientation', e => {
    orientation.beta = (e.beta || 0) / 90;
    orientation.gamma = (e.gamma || 0) / 90;
    hasOrient = true;
  });
  document.getElementById('status').textContent = 'Orientation live';
}

document.getElementById('seal').onclick = sealLeader;
document.getElementById('inject').onclick = injectSealed;
document.getElementById('reset').onclick = () => { genomes = Array.from({length:N}, makeGenome); fitness.fill(0); };

async function sealLeader() {
  const best = fitness.indexOf(Math.max(...fitness));
  const g = Array.from(genomes[best]);
  try {
    const db = await idb();
    const tx = db.transaction('genomes', 'readwrite');
    tx.objectStore('genomes').put({ id: 'leader', weights: g, fitness: fitness[best], t: Date.now() });
    if (typeof BroadcastChannel !== 'undefined') {
      new BroadcastChannel('f213').postMessage({ type: 'seal', weights: g, fitness: fitness[best] });
    }
    document.getElementById('status').textContent = `Sealed A${best} (${fitness[best].toFixed(1)})`;
  } catch (e) {
    document.getElementById('status').textContent = 'Seal failed (IDB)';
  }
}
async function injectSealed() {
  try {
    const db = await idb();
    const req = db.transaction('genomes').objectStore('genomes').get('leader');
    req.onsuccess = () => {
      if (req.result) {
        const worst = fitness.indexOf(Math.min(...fitness));
        genomes[worst] = new Float32Array(req.result.weights);
        fitness[worst] = 0;
        document.getElementById('status').textContent = `Injected into A${worst}`;
      }
    };
  } catch {}
}
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('f213', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('genomes', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = rej;
  });
}
if (typeof BroadcastChannel !== 'undefined') {
  new BroadcastChannel('f213').onmessage = e => {
    if (e.data?.type === 'seal') {
      document.getElementById('status').textContent = 'Peer sealed genome received';
    }
  };
}

// Tiny MLP kernel (JS fallback / reference)
function mlpStep(i, inputs) {
  const w = genomes[i];
  // 4 in → 4 hidden → 2 out, simple
  const h = new Float32Array(4);
  for (let j = 0; j < 4; j++) {
    let s = w[j*4] * inputs[0] + w[j*4+1] * inputs[1] + w[j*4+2] * inputs[2] + w[j*4+3] * inputs[3];
    h[j] = Math.tanh(s);
  }
  const ox = h[0]*w[8] + h[1]*w[9] + h[2]*w[10] + h[3]*w[11];
  const oy = h[0]*w[8+1] + ...; // simplified; real impl below
  return [ox * 40, oy * 40];
}
// Correct simple version
function runKernelJS() {
  const targets = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    const ni = (i + 1) % N;
    const dx = (positions[ni*2] - positions[i*2]) / 300;
    const dy = (positions[ni*2+1] - positions[i*2+1]) / 300;
    const inputs = [dx, dy, orientation.beta, orientation.gamma];
    const w = genomes[i];
    let h0 = Math.tanh(w[0]*inputs[0] + w[1]*inputs[1] + w[2]*inputs[2] + w[3]*inputs[3]);
    let h1 = Math.tanh(w[4]*inputs[0] + w[5]*inputs[1] + w[6]*inputs[2] + w[7]*inputs[3]);
    const ox = h0 * w[8] + h1 * w[9];
    const oy = h0 * w[10] + h1 * w[11];
    targets[i*2] = positions[i*2] + ox * 30;
    targets[i*2+1] = positions[i*2+1] + oy * 30;
    // fitness: coherence + small energy
    fitness[i] += 0.1 - Math.abs(dx) * 0.05;
  }
  return targets;
}

async function initGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return false;
    const device = await adapter.requestDevice();
    const shader = `
      struct Genome { w: array<f32, 12> };
      @group(0) @binding(0) var<storage, read> genomes: array<Genome, ${N}>;
      @group(0) @binding(1) var<storage, read_write> positions: array<f32, ${N*2}>;
      @group(0) @binding(2) var<storage, read> orient: vec2<f32>;
      @compute @workgroup_size(1)
      fn main(@builtin(global_invocation_id) id: vec3<u32>) {
        let i = id.x;
        if (i >= ${N}u) { return; }
        let ni = (i + 1u) % ${N}u;
        let dx = (positions[ni*2u] - positions[i*2u]) / 300.0;
        let dy = (positions[ni*2u+1u] - positions[i*2u+1u]) / 300.0;
        let w = genomes[i].w;
        let h0 = tanh(w[0]*dx + w[1]*dy + w[2]*orient.x + w[3]*orient.y);
        let h1 = tanh(w[4]*dx + w[5]*dy + w[6]*orient.x + w[7]*orient.y);
        let ox = h0 * w[8] + h1 * w[9];
        let oy = h0 * w[10] + h1 * w[11];
        positions[i*2u] = positions[i*2u] + ox * 30.0;
        positions[i*2u+1u] = positions[i*2u+1u] + oy * 30.0;
      }
    `;
    const module = device.createShaderModule({ code: shader });
    const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
    const genomeBuffer = device.createBuffer({ size: N * 12 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const posBuffer = device.createBuffer({ size: N * 2 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    const orientBuffer = device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }); // actually storage for simplicity? wait, use storage
    // Fix: use storage for orient too
    const orientStorage = device.createBuffer({ size: 8, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: genomeBuffer } },
        { binding: 1, resource: { buffer: posBuffer } },
        { binding: 2, resource: { buffer: orientStorage } }
      ]
    });
    gpu = { device, pipeline, genomeBuffer, posBuffer, orientStorage, bindGroup };
    mode = 'webgpu';
    return true;
  } catch (e) { return false; }
}

function uploadGenomes() {
  if (!gpu) return;
  const flat = new Float32Array(N * 12);
  for (let i = 0; i < N; i++) flat.set(genomes[i], i * 12);
  gpu.device.queue.writeBuffer(gpu.genomeBuffer, 0, flat);
}
function uploadPos() {
  if (!gpu) return;
  gpu.device.queue.writeBuffer(gpu.posBuffer, 0, positions);
}

async function stepGPU() {
  if (!gpu) return runKernelJS();
  uploadGenomes();
  uploadPos();
  gpu.device.queue.writeBuffer(gpu.orientStorage, 0, new Float32Array([orientation.beta, orientation.gamma]));
  const encoder = gpu.device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(gpu.pipeline);
  pass.setBindGroup(0, gpu.bindGroup);
  pass.dispatchWorkgroups(N);
  pass.end();
  // Readback
  const readBuffer = gpu.device.createBuffer({ size: N*2*4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  encoder.copyBufferToBuffer(gpu.posBuffer, 0, readBuffer, 0, N*2*4);
  gpu.device.queue.submit([encoder.finish()]);
  await readBuffer.mapAsync(GPUMapMode.READ);
  const data = new Float32Array(readBuffer.getMappedRange());
  const targets = new Float32Array(data);
  readBuffer.unmap();
  readBuffer.destroy();
  // fitness update on CPU
  for (let i = 0; i < N; i++) {
    const ni = (i + 1) % N;
    const dx = Math.abs(positions[ni*2] - positions[i*2]) / 300;
    fitness[i] += 0.12 - dx * 0.08;
  }
  return targets;
}

async function loop() {
  let targets;
  if (mode === 'webgpu' && gpu) {
    targets = await stepGPU();
  } else {
    targets = runKernelJS();
  }
  // Clamp and apply
  const w = window.innerWidth, h = window.innerHeight;
  for (let i = 0; i < N; i++) {
    let x = targets[i*2], y = targets[i*2+1];
    x = Math.max(20, Math.min(w-140, x));
    y = Math.max(60, Math.min(h-90, y));
    positions[i*2] = x; positions[i*2+1] = y;
    cards[i].style.transform = `translate(${x}px, ${y}px)`;
    cards[i].querySelector('.fit').textContent = fitness[i].toFixed(1);
    const hue = 200 + (fitness[i] % 80);
    cards[i].style.borderColor = `hsl(${hue}, 70%, 55%)`;
  }
  document.getElementById('count').textContent = N;
  document.getElementById('mode').textContent = mode;
  requestAnimationFrame(loop);
}

(async () => {
  const ok = await initGPU();
  document.getElementById('status').textContent = ok ? 'WebGPU kernel live' : 'JS kernel (no WebGPU)';
  mode = ok ? 'webgpu' : 'js';
  loop();
})();
</script>
</body>
</html>
