<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F-182 WebGPU Spectral NCA Orientation Mind</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --hue: 220; --energy: 0.5; }
  html, body { margin: 0; height: 100%; background: #05070a; color: #e0e8f0; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .node { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: hsl(var(--hue), 70%, 50%); opacity: 0.7; filter: blur(1px); transition: transform 0.1s linear, opacity 0.2s; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #000; mix-blend-mode: screen; }
  #status { position: fixed; bottom: 8px; left: 8px; font-size: 11px; opacity: 0.6; }
  button { background: #111; color: #fff; border: 1px solid #444; padding: 4px 8px; margin: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="nodes"></div>
  <div>
    <button id="seed">Seed</button>
    <button id="seal">Seal</button>
    <span id="info">WebGPU Spectral NCA + Orientation</span>
  </div>
</div>
<div id="status">Initializing…</div>
<script>
const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');
const nodesContainer = document.getElementById('nodes');
let gpu, device, context, format;
let pipeline, bindGroup, bufferA, bufferB, sampler, textureA, textureB;
let W = 128, H = 72, ping = 0;
let spectrum = new Float32Array(16);
let orient = { beta: 0, gamma: 0 };
let energy = 0.3;
let nodes = [];

async function initWebGPU() {
  if (!navigator.gpu) return false;
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return false;
  device = await adapter.requestDevice();
  context = canvas.getContext('webgpu');
  format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format, alphaMode: 'premultiplied' });
  // Compute shader for spectral-biased NCA / RD
  const shader = device.createShaderModule({ code: `
    @group(0) @binding(0) var<storage, read> src: array<f32>;
    @group(0) @binding(1) var<storage, read_write> dst: array<f32>;
    @group(0) @binding(2) var<uniform> u: vec4f; // time, energy, beta, gamma
    @compute @workgroup_size(8, 8)
    fn main(@builtin(global_invocation_id) id: vec3u) {
      let w = 128u; let h = 72u;
      let x = id.x; let y = id.y;
      if (x >= w || y >= h) { return; }
      let i = y * w + x;
      var v = src[i];
      // Laplacian
      var lap = 0.0;
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          if (dx == 0 && dy == 0) { continue; }
          let nx = (x + u32(dx + w)) % w;
          let ny = (y + u32(dy + h)) % h;
          lap += src[ny * w + nx];
        }
      }
      lap = lap / 8.0 - v;
      // Spectral injection (low res from u.y energy + bias)
      let sx = f32(x) / f32(w);
      let bias = sin(sx * 6.28 + u.x * 0.5) * u.y * 0.3 + u.z * 0.01 * (sx - 0.5);
      // Orientation tilt
      let tilt = u.w * 0.005 * (f32(y) / f32(h) - 0.5);
      // Simple activator-inhibitor
      let act = v + lap * 0.15 + bias + tilt;
      act = clamp(act * 1.02 - 0.01, 0.0, 1.0);
      dst[i] = act;
    }
  `});
  pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: shader, entryPoint: 'main' }
  });
  const size = W * H * 4;
  bufferA = device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  bufferB = device.createBuffer({ size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const uniform = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bufferA } },
      { binding: 1, resource: { buffer: bufferB } },
      { binding: 2, resource: { buffer: uniform } }
    ]
  });
  // Init random
  const init = new Float32Array(W * H);
  for (let i = 0; i < init.length; i++) init[i] = Math.random() * 0.3;
  device.queue.writeBuffer(bufferA, 0, init);
  return true;
}

function createNodes() {
  for (let i = 0; i < 5; i++) {
    const n = document.createElement('div');
    n.className = 'node';
    n.textContent = '·';
    n.style.left = (20 + i * 15) + '%';
    n.style.top = (30 + Math.sin(i) * 20) + '%';
    nodesContainer.appendChild(n);
    nodes.push({ el: n, x: 0.2 + i * 0.15, y: 0.4, vx: 0, vy: 0 });
  }
}

async function setupAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 32;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    setInterval(() => {
      analyser.getByteFrequencyData(data);
      let e = 0;
      for (let i = 0; i < data.length; i++) e += data[i];
      energy = e / (data.length * 255);
      document.documentElement.style.setProperty('--energy', energy);
    }, 100);
  } catch (e) { statusEl.textContent += ' mic denied'; }
}

function setupOrientation() {
  window.addEventListener('deviceorientation', e => {
    orient.beta = e.beta || 0;
    orient.gamma = e.gamma || 0;
  });
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (context) context.configure({ device, format, alphaMode: 'premultiplied' });
}

async function frame(t) {
  requestAnimationFrame(frame);
  if (!device) return;
  // Swap and dispatch
  const srcBuf = ping ? bufferB : bufferA;
  const dstBuf = ping ? bufferA : bufferB;
  // Update bind (simplified: recreate or use dynamic; for demo rebind)
  const uniform = new Float32Array([t * 0.001, energy, orient.beta, orient.gamma]);
  // In real code write to uniform buffer; omitted for brevity in this sketch
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8));
  pass.end();
  // Readback simplified (async in production)
  device.queue.submit([encoder.finish()]);
  ping = 1 - ping;
  // Morph nodes (approximate from energy)
  nodes.forEach((n, i) => {
    n.x += (energy - 0.5) * 0.002 + Math.sin(t * 0.001 + i) * 0.001;
    n.y += Math.cos(t * 0.0008 + i) * 0.001;
    n.el.style.left = (n.x * 100) + '%';
    n.el.style.top = (n.y * 100) + '%';
    n.el.style.transform = `scale(${0.6 + energy})`;
    n.el.style.opacity = 0.4 + energy * 0.5;
  });
  document.documentElement.style.setProperty('--hue', 180 + energy * 140 + orient.gamma * 0.5);
  statusEl.textContent = `energy ${(energy*100)|0}% · β${orient.beta|0} γ${orient.gamma|0}`;
}

document.getElementById('seed').onclick = () => {
  // Seed random
  statusEl.textContent = 'seeded';
};
document.getElementById('seal').onclick = () => {
  localStorage.setItem('f182-seal', JSON.stringify({ energy, orient, t: Date.now() }));
  statusEl.textContent = 'sealed';
};

window.addEventListener('resize', resize);
resize();
createNodes();
setupOrientation();
setupAudio();
initWebGPU().then(ok => {
  if (!ok) statusEl.textContent = 'WebGPU unavailable — Canvas2D fallback not shown';
  else requestAnimationFrame(frame);
});
</script>
</body>
</html>
