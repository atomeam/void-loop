# Void reviews every pull request first, in seconds: tools/review-pr.mjs runs the code checks a-to-mind.com runs when a
# visitor asks Void to review code (void-live-deploy/lib/code-review.js) on the lines the PR adds. It keeps one PR comment
# (marked <!-- void-review -->) up to date, puts each bug or risk on its line with a one-click fix where a safe one exists
# (tools/review-post.mjs), and then is a merge gate: the "void-review" check fails while the added lines carry a bug or a
# risk. A line that is right as written says so with a "void-review: ok" comment. No npm install, no browser: the whole
# job is a checkout and one node script, so it reports long before the suite (test-and-deploy) does.
# It is the main review and the one check a PR waits on before it merges (automerge.yml); the suite runs on main after the
# deploy. Every other reviewer (CodeRabbit) is an extra: reported, never waited on, never blocking.
name: Void review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR to review. automerge.yml dispatches this on a PR's branch after merging main into it, because a push made with the workflow's token starts no pull_request run.
        required: true
        type: string

concurrency:
  group: void-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  void-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which PR (the event's, or the one dispatched by number)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.ref }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$EVENT_PR" ]; then
            printf 'number=%s\nsha=%s\nbase=%s\n' "$EVENT_PR" "$EVENT_SHA" "$EVENT_BASE" >> "$GITHUB_OUTPUT"
          else
            [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
            gh api "repos/$REPO/pulls/$INPUT_PR" --jq '"number=\(.number)\nsha=\(.head.sha)\nbase=\(.base.ref)"' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0 # the diff needs the base

      - name: Void reviews the lines this PR adds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.pr.outputs.base }}
          # ours, free, always: the owner key gets the closer read with no daily cap (functions/api/review.js); empty on forks
          VOID_REVIEW_KEY: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          deep=(); [ -n "$VOID_REVIEW_KEY" ] && deep=(--deep https://a-to-mind.com/api/review)
          node tools/review-pr.mjs --base "origin/$BASE" --head HEAD "${deep[@]}" > void-review.md || true
          cat void-review.md >> "$GITHUB_STEP_SUMMARY"
          body=$(jq -Rs '{body: .}' < void-review.md)
          id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- void-review -->")))][0].id // empty' | head -n1) || true
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null || true
          else
            echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null || true
          fi
          node tools/review-pr.mjs --base "origin/$BASE" --head HEAD --inline > void-inline.json || echo '[]' > void-inline.json
          node tools/review-post.mjs void-inline.json --repo "$REPO" --pr "$PR" --sha "$(git rev-parse HEAD)"

      - name: Gate on bugs and risks
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          node tools/review-pr.mjs --base "origin/$BASE" --head HEAD --gate > /dev/null || { echo "::error title=Void review::bugs or risks in the added lines (see Void's review comment); fix them or mark a line that is right as written with a void-review: ok comment"; exit 1; }

      # a PR that touches the skills must leave every skill file registered in skills/index.json (tools/skills-unlisted.mjs, run by skills-check):
      # a merge once dropped "services" from the index and nine pricing asks fell through. It blocks the merge here, not only the next local run.
      - name: Every skill file is still listed (only when the PR touches skills/)
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -q '^void-live-deploy/skills/'; then
            node tools/skills-check.mjs || { echo "::error title=Void review::a skill file is not listed in void-live-deploy/skills/index.json (or a skill collides): see the lines above; add it to the index, or to RETIRED in tools/skills-unlisted.mjs with a reason"; exit 1; }
          else
            echo "this PR does not touch void-live-deploy/skills/"
          fi
