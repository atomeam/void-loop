# Verse reviews every pull request first, in seconds: tools/review-pr.mjs runs the code checks a-to-mind.com runs when a
# visitor asks Verse to review code (void-live-deploy/lib/code-review.js) on the lines the PR adds. It keeps one PR comment
# (marked <!-- void-review -->) up to date, puts each bug or risk on its line with a one-click fix where a safe one exists
# (tools/review-post.mjs), and then is a merge gate: the "void-review" check fails while the added lines carry a bug or a
# risk. A line that is right as written says so with a "void-review: ok" comment. No npm install, no browser: the whole
# job is a checkout and one node script, so it reports long before the suite (test-and-deploy) does.
# It is the main review and the one check a PR waits on before it merges (automerge.yml); the suite runs on main after the
# deploy. Every other reviewer (CodeRabbit) is an extra: reported, never waited on, never blocking.
name: Verse review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR to review. automerge.yml dispatches this on a PR's branch after merging main into it, because a push made with the workflow's token starts no pull_request run.
        required: true
        type: string
      report_only:
        description: Only print the review in the log (no comment, no inline notes, no gate). For measuring the closer read on a merged PR (its diff is taken against the base it was merged on).
        type: boolean
        default: false

concurrency:
  group: void-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write # wake automerge after a review the bot dispatched (below)

jobs:
  void-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which PR (the event's, or the one dispatched by number)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.ref }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          # baseref: what the diff is taken against; origin/<base branch> for an open PR, the base commit the PR was merged on for a merged one
          if [ -n "$EVENT_PR" ]; then
            printf 'number=%s\nsha=%s\nbase=%s\nbaseref=origin/%s\n' "$EVENT_PR" "$EVENT_SHA" "$EVENT_BASE" "$EVENT_BASE" >> "$GITHUB_OUTPUT"
          else
            [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
            gh api "repos/$REPO/pulls/$INPUT_PR" --jq '"number=\(.number)\nsha=\(.head.sha)\nbase=\(.base.ref)\nbaseref=\(if .merged then .base.sha else "origin/" + .base.ref end)"' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0 # the diff needs the base

      - name: Verse reviews the lines this PR adds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          BASEREF: ${{ steps.pr.outputs.baseref }}
          REPORT_ONLY: ${{ inputs.report_only }}
          # ours, free, always: the owner key gets the closer read with no daily cap (functions/api/review.js); empty on forks
          VOID_REVIEW_KEY: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          deep=(); [ -n "$VOID_REVIEW_KEY" ] && deep=(--deep https://a-to-mind.com/api/review)
          # report only: main's tools review the PR's head, so the footer (quoted, dropped, parsed, echoes) is today's on a PR from any day
          TOOLS=tools
          if [ "$REPORT_ONLY" = "true" ]; then git fetch -q origin main && git worktree add -q "$RUNNER_TEMP/void-main" origin/main && TOOLS="$RUNNER_TEMP/void-main/tools"; fi
          node "$TOOLS/review-pr.mjs" --base "$BASEREF" --head HEAD "${deep[@]}" > void-review.md || true
          cat void-review.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPORT_ONLY" = "true" ]; then echo "report only: nothing posted"; cat void-review.md; exit 0; fi
          body=$(jq -Rs '{body: .}' < void-review.md)
          id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- void-review -->")))][0].id // empty' | head -n1) || true
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null || true
          else
            echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null || true
          fi
          node tools/review-pr.mjs --base "$BASEREF" --head HEAD --inline > void-inline.json || echo '[]' > void-inline.json
          node tools/review-post.mjs void-inline.json --repo "$REPO" --pr "$PR" --sha "$(git rev-parse HEAD)"

      - name: Gate on bugs and risks
        if: ${{ inputs.report_only != true }}
        env:
          BASEREF: ${{ steps.pr.outputs.baseref }}
        run: |
          node tools/review-pr.mjs --base "$BASEREF" --head HEAD --gate > /dev/null || { echo "::error title=Verse review::bugs or risks in the added lines (see Verse's review comment); fix them or mark a line that is right as written with a void-review: ok comment"; exit 1; }

      # no real key in any added line, in any file type (tools/secret-scan.mjs; the review above skips docs and data, where a pasted key
      # in a log or a note is likeliest). It prints the file, the line and the kind, never the value, and blocks the merge.
      - name: No secrets in the added lines
        if: ${{ inputs.report_only != true }}
        env:
          BASEREF: ${{ steps.pr.outputs.baseref }}
        run: |
          node tools/secret-scan.mjs --base "$BASEREF" || { echo "::error title=Secret in the added lines::remove it and rotate it (anything that reached GitHub is public); a made-up test key gets a secret-scan: ok comment"; exit 1; }

      # no personal data (emails, phones, IPs, card numbers, tokens) in the files this PR adds or changes under domains/,
      # logs and fixtures (tools/privacy-scan.mjs, kind and line only), and nothing secret in what the site ships, owner checks
      # that read env, /api rate limited (tools/runtime-guard.mjs)
      - name: No personal data, nothing secret in the built site
        if: ${{ inputs.report_only != true }}
        env:
          BASEREF: ${{ steps.pr.outputs.baseref }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$(git merge-base "$BASEREF" HEAD)" HEAD)
          if [ ${#changed[@]} -gt 0 ]; then node tools/privacy-scan.mjs "${changed[@]}" || { echo "::error title=Personal data::use a placeholder ([email], [phone], [ip]) or a paraphrase; a placeholder on purpose gets privacy:ok"; exit 1; }; fi
          node tools/runtime-guard.mjs

      # a PR that touches the skills must leave every skill file registered in skills/index.json (tools/skills-unlisted.mjs, run by skills-check):
      # a merge once dropped "services" from the index and nine pricing asks fell through. It blocks the merge here, not only the next local run.
      - name: Every skill file is still listed (only when the PR touches skills/)
        if: ${{ inputs.report_only != true }}
        env:
          BASEREF: ${{ steps.pr.outputs.baseref }}
        run: |
          if git diff --name-only "$BASEREF...HEAD" | grep -q '^void-live-deploy/skills/'; then
            node tools/skills-check.mjs || { echo "::error title=Verse review::a skill file is not listed in void-live-deploy/skills/index.json (or a skill collides): see the lines above; add it to the index, or to RETIRED in tools/skills-unlisted.mjs with a reason"; exit 1; }
          else
            echo "this PR does not touch void-live-deploy/skills/"
          fi

      # every module the shared tool-page chain loads (lib/toolkit.js and its imports) stays named in the browser suite's shared list
      # (tools/shared-chain.test.mjs): #1663 added one, the list did not name it, and shard 1 went red on main after the merge. Seconds, no browser.
      - name: The shared tool-page chain matches the browser suite's list
        if: ${{ inputs.report_only != true }}
        run: node --test tools/shared-chain.test.mjs || { echo "::error title=Shared tool-page chain::a module the toolkit chain loads is not in SHARED_TOOL_FILES (tools/test_void.mjs); see the test output above"; exit 1; }

      # void.html is the page and void-live-deploy/index.html and void-live-deploy/void.html are its two deploy copies (checks.mjs 'copies').
      # #1748 changed void.html and index.html but not void.html's second copy, and the copies check went red on main after the merge
      # (2026-10-30, repaired by 2ea27ede). The same compare runs here, so a PR with a stale copy does not merge. Seconds, no browser.
      - name: The page and its two deploy copies match
        if: ${{ inputs.report_only != true }}
        run: |
          node -e "const fs=require('fs'),r=(f)=>fs.readFileSync(f,'utf8').replace(/\r\n/g,'\n'),src=r('void.html'),stale=['void-live-deploy/index.html','void-live-deploy/void.html'].filter((f)=>r(f)!==src);if(stale.length){console.log('::error title=Page copies::'+stale.join(' and ')+' differ from void.html: cp void.html void-live-deploy/index.html && cp void.html void-live-deploy/void.html');process.exit(1)}console.log('void.html and both deploy copies match')"

      # A review the automerge bot dispatched (after merging main into the PR) was started with the workflow's token, so its end
      # fires no workflow_run and automerge never hears it passed; the hourly schedule rarely fires, so #598 sat green for hours
      # (2026-10-13). Wake automerge here, pass or fail: it reads the check itself and only merges a clean head.
      - name: Wake automerge (only after a dispatched review)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.report_only != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run automerge.yml --repo "$REPO" --ref main
