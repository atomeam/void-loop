# Void reviews its own pull requests: tools/review-pr.mjs runs the same code checks a-to-mind.com runs when a visitor
# asks Void to review code (void-live-deploy/lib/code-review.js), on the lines each PR adds, and keeps one PR comment
# (marked <!-- void-review -->) up to date. Pattern checks only: no model call, no secrets, nothing that costs money.
# The comment informs; it never fails the PR (CI and the bench decide that).
name: Void review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: void-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post or update Void's one review comment

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review the lines this PR adds
        run: node tools/review-pr.mjs --base "origin/${{ github.event.pull_request.base.ref }}" --head HEAD > void-review.md
      - name: Post or update the review comment
        # a PR from a fork gets a read-only token: the review still runs and shows in the job summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          cat void-review.md >> "$GITHUB_STEP_SUMMARY"
          body=$(jq -Rs '{body: .}' < void-review.md)
          id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- void-review -->")))][0].id // empty' | head -n1)
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null
          else
            echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi
