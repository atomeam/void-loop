# Verse's Shorts: every kind of video, about what people watch today. tools/trends.mjs reads three free trend sources (Google Trends,
# Wikipedia's most-read, Hacker News), tools/topic-gate.mjs refuses small everyday sums, harm, adult topics and any topic made in the
# last 30 days, and tools/shorts-loop.mjs plans three films in three formats (news parody, trailer, explainer, POV skit, countdown,
# nature documentary, product review, lyric video), the least recently made first, the best-scoring kept in. tools/film-studio.mjs films
# each at 1080x1920 with a Piper voice, then tools/video-gate.mjs measures it (no bars, legible captions, footage, loudness, hook,
# topic). Only a pass goes on /films/ (listed) and, when the repo variable YT_UPLOAD is 1, to Verse's channel. tools/film-cleanup.mjs
# takes off the list any listed film whose words are a refused topic, and counts every film stored. A dry run posts nothing.
name: Verse shorts

on:
  schedule:
    - cron: '23 15 * * *' # daily, about 10 AM ET (GitHub drops many schedule events here; the conductor starts it once 15:00 UTC has passed with no run today: tools/conductor-core.mjs DAILY)
  workflow_dispatch:
    inputs:
      dry:
        description: 'Film and gate only: post nothing, unlist nothing, keep no log'
        type: boolean
        default: false

permissions:
  contents: write # the loop log domains/shorts.loop.json, pushed to main
  actions: write # to start the deploy after that push (a push with the Actions token starts no workflow)

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium, ffmpeg and fonts
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          echo "CHROME=$(node -e "import('playwright-core').then(m=>console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - name: Piper voice
        run: |
          timeout 300 pip install --quiet piper-tts || echo "::warning title=No Piper::the films get espeak-ng or music only"
          sudo apt-get install -y -qq espeak-ng >/dev/null || true
      - name: Cache the voice
        id: voice
        uses: actions/cache@v4
        with:
          path: ~/piper-voices
          key: piper-voices-lessac-ryan-medium-v1
      - name: Download the voice
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/piper-voices && cd ~/piper-voices
          for v in lessac ryan; do for ext in onnx onnx.json; do
            curl -fsSL -o "en_US-$v-medium.$ext" "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/$v/medium/en_US-$v-medium.$ext" || true
          done; done
      - name: What people watch today (tools/trends.mjs)
        run: |
          node tools/trends.mjs > trends.json
          jq -r '"trend topics: \(.topics|length), failed: \(.failed|join("; "))"' trends.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge the last films, plan three new ones (tools/shorts-loop.mjs)
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          node tools/shorts-loop.mjs judge | tee -a "$GITHUB_STEP_SUMMARY"
          s=0; node tools/shorts-loop.mjs plan --trends trends.json > trial.json 2> plan.txt || s=$?; cat plan.txt | tee -a "$GITHUB_STEP_SUMMARY"; exit $s
      - name: Film, render and gate the three films (tools/film-studio.mjs)
        continue-on-error: true
        env:
          PIPER: python -m piper
          PIPER_VOICE: /home/runner/piper-voices/en_US-lessac-medium.onnx
        run: |
          [ -f "$PIPER_VOICE" ] || unset PIPER_VOICE
          for i in 0 1 2; do
            node tools/film-studio.mjs render --trial trial.json --i "$i" --out media/shorts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for m in media/shorts/*.json; do node tools/shorts-loop.mjs record "$m"; done
      - name: Put each passed film on /films/
        if: ${{ !inputs.dry }}
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          set -o pipefail
          for m in media/shorts/*.json; do
            [ "$(jq -r '.gate.pass' "$m")" = "true" ] || { echo "not posted (gate failed): $m"; continue; }
            id="$(jq -r .filmId "$m")"
            node tools/film-post.mjs "${m%.json}.mp4" "$m" --id "$id" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Take refused topics off the list, count every film (tools/film-cleanup.mjs)
        continue-on-error: true
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: node tools/film-cleanup.mjs ${{ inputs.dry && '--dry' || '' }} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload passed Shorts to Verse's YouTube channel
        if: vars.YT_UPLOAD == '1' && !inputs.dry
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        # tools/youtube.mjs refuses any film whose meta has not passed the gate
        run: set -o pipefail; for m in media/shorts/*.json; do node tools/youtube.mjs "$m" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verse-shorts
          path: media/shorts/
          retention-days: 14
      - name: A film was made (a crash is red, not a quiet green)
        # 2026-11-04 and 11-05: render() crashed before filming (no media/shorts) and the run still showed green, so no film was made
        # for two days and nobody saw it. A gate fail is fine (kept as the artifact); no film at all is a failure.
        run: |
          n=$(ls media/shorts/*.mp4 2>/dev/null | wc -l)
          echo "films made today: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" -gt 0 ] || { echo "::error title=No film made::all three films failed before a film existed (see the Film step)"; exit 1; }
      # 2026-11-06: the log went to helper/shorts-loop-<day> with the Actions token, which starts no workflow, so no pull request was
      # ever opened and domains/shorts.loop.json on main stayed empty since #2138. Each day planned the same first trial from an empty
      # log and judged nothing, so the films could not improve. A second run on the same day was refused outright (the branch existed)
      # and printed "no change". The log now goes straight to main (only this job writes it, one run at a time), and the deploy is
      # started so /films/ and /progress/ read it.
      - name: Keep the loop log on main
        if: always() && !inputs.dry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add domains/shorts.loop.json
          git diff --cached --quiet && { echo "the loop log did not change"; exit 0; }
          git config user.name "Verse"; git config user.email "verse@a-to-mind.com"
          git commit -q -m "Shorts loop: today's trial and verdicts"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:main; then
              gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f after_merge=true || echo "::warning title=Not deployed::the deploy did not start; the next merge carries it"
              exit 0
            fi
            sleep $((2 ** i)); git pull -q --rebase --autostash origin main
          done
          echo "::error title=Loop log not kept::main refused the loop log four times"; exit 1
