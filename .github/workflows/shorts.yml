# Verse's Shorts, remade (owner, 2026-11-03: "verses videos are bad, its not framed properly the music is bad and they are meaningless
# to most people even me"). tools/shorts.mjs films the live a-to-mind.com answering an everyday question at full 1080x1920, then
# tools/video-gate.mjs measures it (no bars, legible captions, real footage, loudness, hook). Only a pass goes on /films/ (listed)
# and, when the repo variable YT_UPLOAD is 1, to Verse's channel. A fail is kept as the run's artifact and posted nowhere.
name: Verse shorts

on:
  schedule:
    - cron: '23 15 * * *' # daily, about 10 AM ET (GitHub drops many schedule events here; the conductor starts it once 15:00 UTC has passed with no run today: tools/conductor-core.mjs DAILY)
  workflow_dispatch:

permissions:
  contents: write # the loop log domains/shorts.loop.json, pushed on a helper/* branch (automerges)

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium, ffmpeg and fonts
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          echo "CHROME=$(node -e "import('playwright-core').then(m=>console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - name: Judge yesterday's trials, plan today's (tools/shorts-loop.mjs)
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: node tools/shorts-loop.mjs judge | tee -a "$GITHUB_STEP_SUMMARY"; node tools/shorts-loop.mjs plan > trial.json; cat trial.json >> "$GITHUB_STEP_SUMMARY"
      - name: Film, render and gate the champion and the challenger
        continue-on-error: true
        run: |
          for side in champion challenger; do
            node -e "const t=require('./trial.json')[process.argv[1]];import('./tools/shorts.mjs').then(async m=>{const s=m.SCENES.find(x=>x.id===t.scene);const r=await m.render(s,'media/shorts',{voice:false,variant:t,filmId:t.film});console.log((r.gate.pass?'GATE PASS ':'GATE FAIL ')+t.film)})" $side | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for m in media/shorts/*.json; do node tools/shorts-loop.mjs record "$m"; done
      - name: Put each passed Short on /films/
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          set -o pipefail
          for m in media/shorts/*.json; do
            [ "$(jq -r '.gate.pass' "$m")" = "true" ] || { echo "not posted (gate failed): $m"; continue; }
            id="$(jq -r .filmId "$m")"
            node tools/film-post.mjs "${m%.json}.mp4" "$m" --id "$id" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload passed Shorts to Verse's YouTube channel
        if: vars.YT_UPLOAD == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        # tools/youtube.mjs refuses any film whose meta has not passed the gate
        run: set -o pipefail; for m in media/shorts/*.json; do node tools/youtube.mjs "$m" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verse-shorts
          path: media/shorts/
          retention-days: 14
      - name: A film was made (a crash is red, not a quiet green)
        # 2026-11-04 and 11-05: render() crashed before filming (no media/shorts) and the run still showed green, so no film was made
        # for two days and nobody saw it. A gate fail is fine (kept as the artifact); no film at all is a failure.
        run: |
          n=$(ls media/shorts/*.mp4 2>/dev/null | wc -l)
          echo "films made today: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" -gt 0 ] || { echo "::error title=No film made::the champion and the challenger both failed before a film existed (see the Film step)"; exit 1; }
      - name: Keep the loop log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Verse"; git config user.email "verse@a-to-mind.com"
          b="helper/shorts-loop-$(date -u +%Y%m%d)"; git checkout -b "$b"; git add domains/shorts.loop.json
          git commit -m "Shorts loop: today's trial and verdicts" && git push origin "$b" || echo "no change"
