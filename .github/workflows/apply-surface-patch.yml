name: Apply surface a11y patch
on:
  push:
    branches: [helper/surface-a11y-2]
    paths:
      - patches/surface-a11y.patch
      - .github/workflows/apply-surface-patch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helper/surface-a11y-2
      - name: Apply patch and sync deploy copies
        run: |
          if grep -q 'void-stars-far' void.html; then
            echo "already applied"
            exit 0
          fi
          patch -p1 < patches/surface-a11y.patch
          cp void.html void-live-deploy/void.html
          cp void.html void-live-deploy/index.html
      - name: Commit if changed
        run: |
          git config user.name "void-helper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void.html void-live-deploy/void.html void-live-deploy/index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Apply surface a11y/focus/safe-area/stars patch"
          git push
