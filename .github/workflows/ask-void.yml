# Ask live Verse one question from GitHub's network (tools/ask-void.mjs --print), for builders whose own machine can't reach
# a-to-mind.com: its answer, word for word, goes to the run summary and the log. Manual only; nothing is written to the repo.
name: Ask Verse

on:
  workflow_dispatch:
    inputs:
      question:
        description: What to ask Verse
        required: true
        type: string

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask Verse
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          set -o pipefail
          { echo '### Asked Verse'; echo; echo "> $QUESTION"; echo; echo '### Its answer'; echo; node tools/ask-void.mjs --print --ask "$QUESTION"; } | tee -a "$GITHUB_STEP_SUMMARY"
