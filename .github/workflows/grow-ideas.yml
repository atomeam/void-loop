# Growth ideas. Several new asks land in the inbox each run.
# No one-row claim, no building lock, no pull request. Shipped rows stay.
name: Void grow ideas

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ideas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add ideas
        id: grow
        run: |
          node --test tools/grow-ideas.test.mjs
          out=$(node tools/grow-ideas.mjs)
          echo "$out"
          if [ "$out" = "none" ]; then
            echo "added=false" >> "$GITHUB_OUTPUT"
          else
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit new ideas
        if: steps.grow.outputs.added == 'true'
        run: |
          git config user.name "void-grow[bot]"
          git config user.email "void-grow@users.noreply.github.com"
          git add domains/growth-inbox.md
          git diff --cached --quiet && exit 0
          git commit -m "Growth: add new ideas"
          git push
