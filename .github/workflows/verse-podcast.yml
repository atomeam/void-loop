# Verse Out Loud, Verse's own podcast (owner, 2026-10-21: "Verse should make its own podcast"; 2026-11-06: "where is my daily verse
# podcast"). Every day (13:17 UTC, about 8 AM ET; tools/due.mjs starts it when GitHub drops the schedule) and on demand (Run workflow;
# "force" makes one even if the last is under 20 hours old), tools/podcast.mjs reads the day from the public record (main's commit
# history, growth ledger, proven asks, Verse's daily readout, incident log), voices it with Piper (open-source TTS, MIT, runs here:
# no account, no API, no cost; two voices, Verse and the Critic) and ffmpeg, and commits the mp3 (~1 MB), transcript, episodes.json and
# podcast/rss.xml to main; the deploy puts them on a-to-mind.com/podcast/. About 3 Actions minutes a day. No secrets needed.
name: Verse Out Loud (podcast)

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Make an episode even if the last one is under 20 hours old'
        type: boolean
        default: false

concurrency:
  group: verse-podcast
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to start the deploy after the push (a push with the Actions token starts no workflow)

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the episode reads main's commit history for the day
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-11-06: apt-get install ffmpeg hung for 20 minutes on one runner (pip had finished in 11 s) and the job limit cancelled the
      # episode. Each apt try is cut off at 2.5 minutes, the index is refreshed between tries, and if apt still gives nothing a static
      # ffmpeg and ffprobe build is fetched instead, so the episode is made whatever the runner's package mirror does.
      - name: Piper and ffmpeg
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 300 pip install --quiet kokoro-onnx soundfile
          for i in 1 2 3; do
            command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && break
            timeout 150 sudo -E apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null || echo "apt try $i gave no ffmpeg"
            command -v ffmpeg >/dev/null || timeout 120 sudo -E apt-get update -qq || true
          done
          if ! command -v ffprobe >/dev/null; then
            echo "apt gave no ffmpeg: a static build instead"
            mkdir -p ~/ffmpeg-static && cd ~/ffmpeg-static
            timeout 180 curl -fsSL -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf ff.tar.xz --strip-components=1
            echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          fi
      - name: The two voices (cached)
        id: voices
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1-onnx-v1
      - name: Download the voices
        if: steps.voices.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro && cd ~/kokoro
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Make the episode
        env:
          KOKORO_DIR: /home/runner/kokoro
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "The judged episode stays. A new one is written by tools/show-make.mjs with Kokoro (af_sky for Verse, bm_george for Critic) and is published only when the judge passes." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Put it on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add void-live-deploy/podcast void-live-deploy/studio/scores.json
          git diff --cached --quiet && { echo "no new episode"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verse Out Loud: today's episode, read from the day's record"
          # 2026-11-06: episode 3 reached main but not the site, because a push with the Actions token starts no deploy
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f after_merge=true || echo "::warning title=Not deployed::the deploy did not start; the next merge carries it"
              exit 0
            fi
            sleep $((2 ** i)); git pull --rebase --autostash origin main
          done
          exit 1
