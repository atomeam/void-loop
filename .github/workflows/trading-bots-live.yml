# The trading bots and the arbitrage scanner on the live site (tools/trading-bots-live.mjs): pages, price history, the free scan and an unpaid
# call to each paid service (402 to the catalog's wallet). Started by hand, or after a data commit's deploy. Read only: no payment, no write.
name: Trading bots live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages, data, the free scan and the paid calls
        run: |
          set +e
          node tools/trading-bots-live.mjs > /tmp/tb.txt 2>&1
          code=$?
          { echo '## Trading bots live'; echo; echo '```'; cat /tmp/tb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tb.txt
          exit $code
