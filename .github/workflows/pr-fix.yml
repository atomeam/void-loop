name: Verse fixes a pull request
run-name: pr-fix ${{ inputs.mode }} ${{ inputs.pr }} ${{ inputs.why }}
on:
  workflow_dispatch:
    inputs:
      pr:
        required: false
        default: ""
      mode:
        required: true
        default: main
      why:
        required: false
        default: ""
concurrency:
  group: verse-pr-fix-${{ inputs.pr || 'main' }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.VERSE_LOOP_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          GH_TOKEN: ${{ secrets.VERSE_LOOP_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          MODE: ${{ inputs.mode }}
          WHY: ${{ inputs.why }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node tools/pr-fix.mjs
