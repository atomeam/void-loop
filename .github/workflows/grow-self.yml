# Verse hardens itself (owner, 2026-10-19: "make it so Verse can open its own PRs and push them through and review all after thinking it up
# based on what it lacks most"). propose-fix.yml and build-miss.yml only start from asks a visitor missed; with no misses they run and do
# nothing. This is the lane that thinks the work up from Verse's own files: tools/lacks.mjs ranks the skills by how little is proven about
# them (no benchmark ask, a weak evidence tier, failed runs that name them), takes the example asks the top few already claim, and the
# real page decides: tools/bench.mjs --probe types each into the page and only the asks that routed to the claiming skill become benchmark
# rows (tools/append.mjs). The ones that did not are listed in the report as routing gaps for a builder. No model, no secret, no
# network in the build job; the write job holds the token and only moves the patch's bytes onto main, after checking it touches
# nothing but the benchmark, the art floors, the cycle, the gate's state, the log and the ledger. One preview is in flight at a time
# (owner, 2026-10-20: "close out before next preview starts"): tools/grow-gate.mjs keeps the last preview's ask in
# tools/grow-self.state.json, the next run types that ask into the live site and closes it only when it answers, and a run that cannot
# close it stops with exit 0 instead of stacking another preview.
name: Verse hardens itself

on:
  # no schedule (owner, 2026-10-24: "there should be no self hardening, it needs to say exactly what upgrades not just hardening that means
  # fucking nothing"): kept for a run by hand, never on a timer (docs/SALVAGE.md)
  workflow_dispatch:
    inputs:
      n:
        description: "how many of the most lacking skills to try (1 to 12)"
        type: string
        default: '6'
      dry:
        description: "plan, probe and settle, but open no pull request"
        type: boolean
        default: false

concurrency:
  group: void-grow-self
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the one-preview-at-a-time gate reads the labels of open pull requests
    outputs:
      open: ${{ steps.open.outputs.open }}
      passed: ${{ steps.settle.outputs.passed }}
      added: ${{ steps.settle.outputs.added }}
      skills: ${{ steps.settle.outputs.skills }}
      title: ${{ steps.settle.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checks (no dependencies needed)
        run: node --test tools/lacks.test.mjs tools/grow-gate.test.mjs tools/grow-self.test.mjs

      # Never pile up (owner, 2026-10-20: "close out before next preview starts"). The old guard read a "verse hardens"
      # label that nothing ever creates, so it passed on every run while the loop pushed preview after preview. This one
      # reads the labels that are actually used, and it ends the job here: while a preview of Verse's own is open, this
      # run stops with exit 0 and nothing later in it can generate another. A pull request list that cannot be read is
      # treated the same way, so a failed call never lets the loop through. The open preview on the site is closed
      # (verified live) further down, before anything new is probed; if it cannot be closed, that step also stops with
      # exit 0 and says it is waiting.
      - name: One preview at a time (open pull requests)
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "open=1" >> "$GITHUB_OUTPUT"
          # a state that cannot be read is not "closed": the run waits for it (exit 0) instead of failing, and nothing starts
          if ! state=$(node tools/grow-gate.mjs status); then
            echo "::notice title=Waiting::the gate's state could not be read, so nothing new starts this cycle"
            exit 0
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = "closed" ] || echo "::notice title=Closing first::the last preview is still open; this run verifies it live before it starts another"
          if ! prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number,labels --jq '[.[] | select(any(.labels[]; .name == "made by Verse" or .name == "verse hardens"))] | length'); then
            echo "::notice title=Waiting::this repository's open pull requests could not be read, so nothing new starts this cycle"
            exit 0
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          [ "$prs" = "0" ] || { echo "::notice title=Nothing started::$prs of Verse's own pull request(s) are still open; close or merge them before the next preview"; exit 0; }
          echo "open=0" >> "$GITHUB_OUTPUT"

      - name: Think it up (what Verse lacks most)
        id: plan
        if: steps.open.outputs.open == '0'
        env:
          N: ${{ inputs.n || '6' }}
        run: |
          mkdir -p "$RUNNER_TEMP/grow"
          echo "planned=0" >> "$GITHUB_OUTPUT"
          n=$(node -e 'const n = parseInt(process.argv[1], 10); console.log(n >= 1 && n <= 12 ? n : 6)' "$N")
          code=0; node tools/lacks.mjs plan --cycle --out "$RUNNER_TEMP/grow/cand.json" --n "$n" || code=$?
          # the card cycle: every card gets a turn (tools/card-cycle.mjs). Show the next cards here; the cursor moves only in
          # the settle step, once this run has a patch. A run that stops (or cannot close the last preview) consumes no turn.
          node tools/card-cycle.mjs --n "$n" | tee -a "$GITHUB_STEP_SUMMARY" || true
          case $code in
            0) echo "planned=1" >> "$GITHUB_OUTPUT"; node tools/lacks.mjs --n "$n" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::notice title=Nothing lacking::every skill already has what it needs" ;;
            *) echo "::warning title=The plan did not run::see the lines above" ;;
          esac

      - name: npm ci
        if: steps.plan.outputs.planned == '1'
        run: npm ci --no-audit --no-fund
      - name: Playwright version
        if: steps.plan.outputs.planned == '1'
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        if: steps.plan.outputs.planned == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (+ system deps)
        if: steps.plan.outputs.planned == '1'
        run: |
          npx playwright-core install --with-deps chromium
          echo "VOID_TEST_BROWSER=$(node -e "import('playwright-core').then(m=>console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      # Close out before the next preview starts (owner, 2026-10-20). The last run's preview is typed into the live site;
      # only when it answers is it marked closed. If it does not answer, nothing new is probed and this job stops with
      # exit 0: the next run waits instead of stacking another preview on top of the last one.
      - name: Close out the previous preview
        id: closeout
        if: steps.plan.outputs.planned == '1'
        run: |
          echo "blocked=0" >> "$GITHUB_OUTPUT"
          if [ "$(node tools/grow-gate.mjs status)" != "open" ]; then echo "no preview is waiting"; exit 0; fi
          # auto-close a preview older than 12 hours so the loop cannot stay stuck (owner, 2026-10-21)
          age=$(node -p "const s = JSON.parse(require('fs').readFileSync('tools/grow-self.state.json','utf8')); Date.now() - Date.parse(s.at || 0)" 2>/dev/null || echo 0)
          if [ "$age" -gt 43200000 ]; then
            node tools/grow-gate.mjs close --proof "auto-closed after 12h so growth can resume"
            echo "auto-closed stale preview"
            exit 0
          fi
          ask=$(node tools/grow-gate.mjs try)
          if [ -z "$ask" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Waiting::the open preview names no ask, so it cannot be verified; close it by hand (node tools/grow-gate.mjs close --proof \"...\")"
            exit 0
          fi
          echo "previous preview: $ask"
          regex=$(node -e 'const s = process.argv[1]; console.log(s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))' "$ask")
          if VOID_SITE=https://a-to-mind.com VOID_CLAIMS_ONLY="^${regex}$" node tools/claims-verify.mjs --live --check; then
            node tools/grow-gate.mjs close --proof "answered live on a-to-mind.com"
            echo "closed: $ask answered live"
          else
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Waiting::the previous preview ('$ask') did not answer live; nothing new starts until it is closed (node tools/grow-gate.mjs close --proof \"...\")"
          fi

      - name: Sync void.html copies (what the probe serves)
        if: steps.plan.outputs.planned == '1' && steps.closeout.outputs.blocked != '1'
        run: |
          cp void.html void-live-deploy/index.html
          cp void.html void-live-deploy/void.html

      # the real page decides: each candidate typed in, outside services blocked, who answered read from the page's own log
      - name: Probe the candidates in the page
        if: steps.plan.outputs.planned == '1' && steps.closeout.outputs.blocked != '1'
        run: node tools/bench.mjs --probe "$RUNNER_TEMP/grow/cand.json" | tee "$RUNNER_TEMP/grow/probe.log"

      - name: Settle and write the patch
        id: settle
        if: steps.plan.outputs.planned == '1' && steps.closeout.outputs.blocked != '1'
        env:
          N: ${{ inputs.n || '6' }}
        run: |
          echo "passed=0" >> "$GITHUB_OUTPUT"
          g="$RUNNER_TEMP/grow"
          # a probe that answered nothing at all is a broken run (no browser, no page), never "every ask failed": it opens nothing
          grep -qE '^[0-9]+ of [0-9]+ answered' "$g/probe.log" || { echo "::error title=The probe did not finish::no result line in the probe log"; exit 1; }
          node tools/lacks.mjs settle "$g/cand.json" "$g/probe.log" --out "$g/passing.json" --failed "$g/failed.json" --report "$g/report.md"
          # record which skills' examples missed so the next plan deprioritizes them
          node -e "import('./tools/grow-lessons.mjs').then(m => m.record(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')), undefined, JSON.parse(require('fs').readFileSync(process.argv[2],'utf8'))))" "$g/failed.json" "$g/passing.json" || true
          cat "$g/report.md" >> "$GITHUB_STEP_SUMMARY"
          count=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).length" "$g/passing.json")
          # the card art: the weakest properties go in the summary, and each floor rises when the art got better (it never lowers: a drop fails checks.mjs)
          { echo; echo '#### Card art'; node tools/art-score.mjs; node tools/art-pixels.mjs; } | tee -a "$GITHUB_STEP_SUMMARY"
          node tools/art-score.mjs --write; node tools/art-pixels.mjs --write
          art=$(git diff --name-only -- tools/art-floor.json | wc -l)
          if [ "$count" -lt 1 ] && [ "$art" -lt 1 ]; then
            # nothing added is not growth (owner, 2026-10-24, on six "found nothing to add" lines in What's new: "why is this even happening"): no
            # ledger line, no log line, no PR; what was tried stays in this job's summary (report.md above) and in grow-lessons for the next plan
            echo "added=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to add::none of the asks routed to their skill and the art floors did not move; the report above lists them; nothing is opened"
            exit 0
          fi
          skills=""; title=""
          if [ "$count" -ge 1 ]; then
            node tools/append.mjs bench --skip --file "$g/passing.json"
            skills=$(node -p "[...new Set(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).map((c) => c.want.replace('skill:', '')))].join(', ')" "$g/passing.json")
            title="$count benchmark ask(s) for $skills"
          fi
          if [ "$art" -ge 1 ]; then
            now=$(node -p "const f = JSON.parse(require('fs').readFileSync('tools/art-floor.json', 'utf8')); f.composite + ' and ' + (f.pixels ? f.pixels.composite : 'n/a')")
            title="${title:+$title, and }the card art floors rise to $now"
          fi
          # richer ledger line: why these skills (from the plan) and the actual asks that were added (owner, 2026-10-21: "needs to say more than hardened itself and benchmark ask")
          detail=""
          if [ -s "$g/cand.json.plan" ]; then
            reasons=$(node -p "const p = JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); (p.picks||[]).map(x => x.name + ' (' + (x.reasons||[]).join(', ') + ')').join('; ')" "$g/cand.json.plan" 2>/dev/null || true)
            if [ -n "$reasons" ]; then detail="$detail Why these: $reasons."; fi
          fi
          if [ -s "$g/passing.json" ]; then
            asks=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).map(c => '\u201c' + c.ask + '\u201d now opens ' + c.want.replace('skill:', '')).join('; ')" "$g/passing.json" 2>/dev/null || true)
            if [ -n "$asks" ]; then detail="$detail New phrases: $asks."; fi
          fi
          if [ -s "$g/failed.json" ]; then
            fails=$(node -p "const f = JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); f.slice(0,4).map(x => x.ask).join('; ')" "$g/failed.json" 2>/dev/null || true)
            if [ -n "$fails" ]; then detail="$detail Did not route: $fails."; fi
          fi
          what="Verse hardened itself: $title.${detail:+ $detail}"
          printf '%s | verse | grow | %s (tools/lacks.mjs, tools/art-score.mjs, tools/art-pixels.mjs, grow-self.yml)\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$what" >> domains/void.agents.log.md
          # a line on the growth ledger too, with one of the asks it proved, so "look what I made" shows what Verse built by itself (owner, 2026-10-19:
          # "bring back the I made this for upgrades"; Verse's own builds never reached the ledger, so they never popped up)
          try=$(node -p "const c = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); (c[0] && c[0].ask) || ''" "$g/passing.json" 2>/dev/null || true)
          node tools/grow.mjs grow "$what" --by verse ${try:+--try "$try"}
          # the line carries its phrases as data too, so every card and preview lists them (owner, 2026-10-21; tools/backfill-hardened.mjs)
          [ -s "$g/passing.json" ] && node tools/backfill-hardened.mjs --last "$g/passing.json" || true
          node tools/loop-refine.mjs --write || true # Self-Refine: rewrite the newest ledger lines until the critic is quiet (docs/LOOP-GAPS.md)
          # the card cycle moves only now that this run has a patch: a run that stopped earlier consumed no turn
          n=$(node -e 'const n = parseInt(process.argv[1], 10); console.log(n >= 1 && n <= 12 ? n : 6)' "$N")
          node tools/card-cycle.mjs --n "$n" --advance >> "$GITHUB_STEP_SUMMARY" || true
          # one preview in flight: the next run must verify this ask live and close it before it starts anything
          if [ -n "$try" ]; then node tools/grow-gate.mjs open --run "${{ github.run_id }}" --try "$try" --what "$what"; fi
          git diff -- tools/bench.json tools/art-floor.json tools/card-cycle.json tools/grow-self.state.json domains/void.agents.log.md void-live-deploy/void.growth.json > "$g/grow.patch"
          # only the benchmark, the art floors, the cycle, the gate, the log and the ledger may change; anything else means a tool misbehaved and nothing is opened
          git diff --name-only | grep -vE '^(tools/bench\.json|tools/art-floor\.json|tools/card-cycle\.json|tools/grow-self\.state\.json|domains/void\.agents\.log\.md|void-live-deploy/void.growth.json|tools/grow-lessons\.json)$' && { echo "::error title=Unexpected change::only the benchmark, the art floors, the cycle, the gate, the logs and the ledger may change"; exit 1; } || true
          node -e 'JSON.parse(require("fs").readFileSync("tools/bench.json", "utf8")); JSON.parse(require("fs").readFileSync("tools/art-floor.json", "utf8")); JSON.parse(require("fs").readFileSync("tools/grow-self.state.json", "utf8"))'
          # the pull request says what got better and the phrases it now answers, as the stage does (owner, 2026-10-24: "there should be no self
          # hardening, it needs to say exactly what upgrades not just hardening that means fucking nothing"); skills/showcase.js hardenedLine
          title=$(node --input-type=module -e "import { hardenedLine } from './void-live-deploy/skills/showcase.js'; const l = hardenedLine(process.argv[1]) || process.argv[2]; console.log(l.replace(/\\b1 more ways\\b/, '1 more way').replace(/\\s+/g, ' ').slice(0, 240))" "$what" "$title")
          echo "passed=1" >> "$GITHUB_OUTPUT"; echo "added=$count" >> "$GITHUB_OUTPUT"; echo "skills=$skills" >> "$GITHUB_OUTPUT"; echo "title=$title" >> "$GITHUB_OUTPUT"

      # the patch (when anything routed) and the asks that did not: both leave this job, nothing else does
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.planned == '1' && steps.closeout.outputs.blocked != '1' && !inputs.dry && always()
        with:
          name: verse-hardens
          path: |
            ${{ runner.temp }}/grow/grow.patch
            ${{ runner.temp }}/grow/report.md
            ${{ runner.temp }}/grow/failed.json
          if-no-files-found: ignore
          retention-days: 7

  # the asks a skill claims and the page did not route to it become `probe:` jobs, which propose-fix.yml turns into a fix pull request: Verse's own
  # misses go down the same lane as the ones it finds itself. This job holds the owner token and nothing else: no write token, no model, and it
  # runs one script from main that only reads a list of plain asks (each is checked again for shape before it is queued).
  queue-gaps:
    needs: build
    if: always() && needs.build.result == 'success' && needs.build.outputs.open == '0' && !inputs.dry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verse-hardens
          path: ${{ runner.temp }}/grow
      - name: Queue the routing gaps for propose-fix
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          f="$RUNNER_TEMP/grow/failed.json"
          [ -s "$f" ] || { echo "no routing gaps this time"; exit 0; }
          [ -n "$VOID_OWNER_TOKEN" ] || { echo "::warning title=Gaps not queued::Repo secret VOID_OWNER_TOKEN is not set"; exit 0; }
          node tools/lacks.mjs queue "$f" | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning title=Gaps not queued::the queue could not be reached; they are in the report"

  # the passing patch goes onto a branch and opens a PR labelled "made by Verse", "verse hardens", "automerge".
  # automerge.yml merges it when Verse's review is clean; verify.yml runs the suite on main after the merge and reverts if red.
  pull-request:
    needs: build
    if: needs.build.outputs.passed == '1' && !inputs.dry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verse-hardens
          path: ${{ runner.temp }}/grow
      - name: Check for existing preview PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --state open --author "@me" --json number --jq 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "An automated preview PR is already open. Halting loop to prevent stacking."
            exit 0
          fi

      - name: Create branch and open PR
        shell: bash
        env:
          WHAT: ${{ needs.build.outputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          patch="$RUNNER_TEMP/grow/grow.patch"
          # the patch touches exactly the benchmark, the art floors, the cycle's place, the gate's state, the log and the ledger
          git apply --numstat "$patch" | awk '{print $3}' | grep -vE '^(tools/bench\.json|tools/art-floor\.json|tools/card-cycle\.json|tools/grow-self\.state\.json|domains/void\.agents\.log\.md|void-live-deploy/void\.growth\.json|tools/grow-lessons\.json)$' && { echo "::error title=Not committed::the patch touches more than the benchmark, the art floors, the cycle, the gate, the log and the ledger"; exit 1; } || true
          git apply "$patch"
          [ -n "$(git status --porcelain)" ] || { echo "nothing to add"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="verse/harden-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -- tools/bench.json tools/art-floor.json tools/card-cycle.json tools/grow-self.state.json domains/void.agents.log.md void-live-deploy/void.growth.json tools/grow-lessons.json
          git commit -q -m "$WHAT" -m "Verse found its least proven skills in its own files (tools/lacks.mjs, tools/card-cycle.mjs), tried the asks each already claims in the real page, and kept the ones that routed to the skill that claims them (.github/workflows/grow-self.yml)."
          git push -q origin "$branch"
          gh pr create --repo "${{ github.repository }}" --base main --head "$branch" --title "$WHAT" --body "Verse found its least proven skills in its own files, tried the asks each already claims in the real page, and kept the ones that routed to the skill that claims them." --label "made by Verse" --label "verse hardens" --label "automerge"
          echo "### $WHAT (PR opened)" >> "$GITHUB_STEP_SUMMARY"
