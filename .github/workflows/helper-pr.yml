# A helper's push to helper/<what> gets its PR (docs/RULES.md: helpers push to helper/<what> and open a PR into main). The helpers
# often pushed and never opened one, so the work sat on the branch and never merged (2026-10-29: 17 helper branches with work and no PR).
# This opens it: ready, not a draft, labelled automerge, so Verse automerge (automerge.yml) merges it once Verse's review is clean.
# A PR opened with this run's token starts no pull_request workflows, so it then starts the automerge run, which starts the review
# on the head (as it does for a head the bot pushed). A branch with an open PR, or with nothing that main lacks, is left alone.
# A branch behind main is rebased onto main and pushed with --force-with-lease (that helper branch only).
# A skill check or a rebase that fails still opens the PR and files a heal job (tools/helper-pr.mjs), so the idea is
# repaired by the conductor instead of being left with no pull request (2026-10-30). A Growth inbox item block in the
# commits or the pull request body becomes a build job. A private block does not.
name: Verse helper PR

on:
  push:
    branches: ["helper/**"]

concurrency:
  group: helper-pr-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # rebase a helper branch that is behind main, and push that branch only
  pull-requests: write # open the PR and label it
  actions: write # start Verse automerge on the new PR

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # room to wait out a rate limit (below)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # count what the branch has that main lacks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the PR if the branch has none
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          # The repository's GITHUB_TOKEN quota is shared by every workflow (2026-11-04: it ran out and this job failed on every push
          # with "API rate limit exceeded for installation"). A rate limit here is a wait, not a failure: wait for the reset (read from
          # GET /rate_limit, which costs nothing) and try again, up to 15 minutes. Any other error fails as before.
          ghr() {
            for try in 1 2 3 4 5 6; do
              if out=$(gh "$@" 2>&1); then printf '%s\n' "$out"; return 0; fi
              if ! printf '%s' "$out" | grep -qiE 'rate limit exceeded|secondary rate limit'; then printf '%s\n' "$out" >&2; return 1; fi
              reset=$(gh api rate_limit --jq .resources.core.reset 2>/dev/null || echo 0); now=$(date +%s)
              wait=$(( reset > now ? reset - now + 5 : 30 * try )); [ "$wait" -gt 150 ] && wait=150
              echo "::notice::rate-limited (try $try); waiting ${wait}s for the quota"; sleep "$wait"
            done
            printf '%s\n' "$out" >&2; return 1
          }
          git fetch -q origin main
          git config user.name "Verse helper"
          git config user.email "helper@users.noreply.github.com"
          behind=$(git rev-list --count "HEAD..origin/main")
          FAIL=""
          if [ "$behind" -gt 0 ]; then
            if git rebase origin/main; then
              git push --force-with-lease origin "HEAD:$BRANCH"
            else
              git rebase --abort || true
              FAIL="rebase onto main conflicted"
              echo "rebase of $BRANCH onto main conflicted; a heal job will repair it" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          ahead=$(git rev-list --count "origin/main..HEAD")
          open=$(ghr api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq 'length')
          git checkout -q --detach "origin/$BRANCH"
          if git diff --name-only origin/main...HEAD | grep -q '^void-live-deploy/skills/'; then
            # check the branch as it would land, merged with main: a skill or tool page main gained since the branch started counts (2026-10-30:
            # helper/stopwatch passed alone, then failed once merged, as main opens /stopwatch/ and the branch listed stopwatch twice in skills/order)
            G="-c user.name=helper-gate -c user.email=helper-gate@users.noreply.github.com"
            cp void-live-deploy/skills/index.json "$RUNNER_TEMP/branch-index.json"
            if ! git $G merge -q --no-edit origin/main >/dev/null 2>&1; then
              if git diff --name-only --diff-filter=U | grep -qE '^void-live-deploy/skills/[^/]+\.js$'; then
                git merge --abort # a skill both sides changed: check the branch alone, as before
              else
                git diff --name-only --diff-filter=U | xargs -r git checkout -q --theirs -- && git add -A && git $G commit -q --no-edit
              fi
            fi
            # main's index plus the names the branch adds, then a skill listed by hand gets its order file and the index is rebuilt from skills/order
            node -e 'const fs = require("fs"), p = "void-live-deploy/skills/index.json", a = JSON.parse(fs.readFileSync(p, "utf8")); for (const n of JSON.parse(fs.readFileSync(process.argv[1], "utf8"))) if (!a.includes(n)) a.push(n); fs.writeFileSync(p, JSON.stringify(a))' "$RUNNER_TEMP/branch-index.json"
            node tools/skills-index.mjs --adopt >/dev/null 2>&1 || true
            if ! node tools/skills-index.mjs --write > skills-check.txt 2>&1 || ! node tools/skills-check.mjs >> skills-check.txt 2>&1; then
              FAIL="${FAIL:+$FAIL; }skills check failed"
              { echo "### $BRANCH: the skill check failed. The pull request still opens and a heal job repairs it."; echo '```'; tail -20 skills-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              cat skills-check.txt
            fi
          fi
          plan=$(node tools/helper-pr.mjs --plan --branch "$BRANCH" --ahead "$ahead" --behind "$behind" --pr "$([ "$open" -gt 0 ] && echo 1 || echo 0)" --fail "$FAIL")
          echo "$plan"
          open_it=$(printf '%s' "$plan" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s); process.stdout.write(p.open?"1":"0")})')
          num=""
          if [ "$open_it" = 1 ]; then
            title=$(git log -1 --format=%s "origin/$BRANCH")
            body="A helper pushed $BRANCH ($ahead commits that main lacks) and opened no PR, so Verse helper PR opened it (.github/workflows/helper-pr.yml). It merges by itself once Verse's review is clean."
            url=$(ghr pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body" --label automerge)
            num="${url##*/}"
            echo "### PR #$num opened for $BRANCH with automerge" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$BRANCH kept: $(printf '%s' "$plan" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).skip||"no new pull request"))')"
            num=$(ghr api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
          fi
          # A pull request this workflow opened leaves its checks approval-required. Automerge starts them
          # (tools/loop-checks.mjs), including on a later push that repairs a failed review.
          wake=$(printf '%s' "$plan" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const p=JSON.parse(s); process.stdout.write(p.wake?"1":"0")})')
          if [ "$wake" = 1 ] && [ -n "$num" ]; then
            ghr workflow run automerge.yml --repo "$REPO" --ref main -f pr="$num"
          fi
          # #2315 carries the suite click fix and the branch the suite is started from. Start that suite from
          # this token. Drop these lines once the run is queued.
          ghr workflow run suite-gate.yml --repo "$REPO" --ref main -f pr=2315 || true
          file_job() {
            if [ -z "$VOID_OWNER_TOKEN" ]; then echo "job listed, not filed (no VOID_OWNER_TOKEN): $1"; return 0; fi
            code=$(curl -sS -m 20 -o /tmp/helper-job.json -w '%{http_code}' -X POST -H "authorization: Bearer $VOID_OWNER_TOKEN" -H 'content-type: application/json' --data "$1" https://a-to-mind.com/api/queue || echo 000)
            echo "queue $code $1"
          }
          heal=$(printf '%s' "$plan" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const h=JSON.parse(s).heal; if(h) process.stdout.write(JSON.stringify(h))})')
          if [ -n "$heal" ]; then file_job "$heal"; fi
          note=$(git diff origin/main...HEAD; git log origin/main..HEAD --format=%B)
          if [ -n "$num" ]; then note="$note"$'\n'"$(ghr pr view "$num" --repo "$REPO" --json body --jq .body)"; fi
          printf '%s' "$note" | node tools/helper-pr.mjs --inbox | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{for (const j of JSON.parse(s||"[]")) console.log(JSON.stringify(j))})' | while read -r job; do file_job "$job"; done
