# How good is Verse's code review? tools/review-bench.mjs scores it on bugs that really reached main (each "Main green" fix,
# git blame back to the commit that broke it, reviewed as a PR). The quick checks run offline in checks.mjs; this job adds the
# closer read (the model, through https://a-to-mind.com/api/review with the owner key, as void-review.yml does), weekly and on
# demand, and writes the score to the job summary. Nothing is committed, posted or deployed. The closer read uses the site's
# Workers AI budget: six reviews a run.
name: Review bench

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git blame walks back to the commit that broke each case
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Score Verse's review (quick checks, then with the closer read)
        env:
          VOID_REVIEW_KEY: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          set -o pipefail
          { echo '### Quick checks'; echo '```'; node tools/review-bench.mjs; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$VOID_REVIEW_KEY" ]; then
            { echo '### With the closer read'; echo '```'; node tools/review-bench.mjs --deep https://a-to-mind.com/api/review; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'No VOID_OWNER_TOKEN secret: the closer read was not scored.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
