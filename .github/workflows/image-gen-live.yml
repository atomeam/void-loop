# The /image/ painter against the live site (tools/image-gen-live.mjs): once a day, from GitHub's network, do what a visitor does on
# a-to-mind.com/image/: read GET /api/image, the page and its script, paint one fixed picture, shrink it to the page's edit size with the
# runner's ImageMagick (installed by the job; ubuntu-latest has none), change it with one fixed line ("Change it"), and ask the same change again, which must come from the cache.
# Cost: at most 2 Workers AI pictures a day of the page's own share (the paint and the change); the repeat is free. Keep what each answer said
# as an artifact (findings/image-gen/<date>T<hhmm>.json, attempt "live", the occasion number; no picture bytes) and write one `finding` line to the
# growth ledger pointing at it. Both files are committed to main by the bot, as video-gen-live.yml does. No key is used and nothing a person typed is sent.
name: Image-gen live

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: image-gen-live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ImageMagick for the edit copy
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends imagemagick && convert -version | head -1
      - name: Paint and change one picture on the live site and write the finding
        id: check
        run: |
          set +e
          node tools/image-gen-live.mjs > image-gen-live.out; code=$?
          set -e
          cat image-gen-live.out
          sed -n '/^### image-gen, live/,$p' image-gen-live.out >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit the artifact and the ledger line to main
        if: always()
        run: |
          if [ -z "$(git status --porcelain findings/image-gen void-live-deploy/void.growth.json)" ]; then echo "nothing was written (the site could not be reached)"; exit 1; fi
          node tools/grow.mjs --check
          mkdir -p /tmp/image-gen && cp -r findings/image-gen/. /tmp/image-gen/ && cp void-live-deploy/void.growth.json /tmp/image-gen-ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -f -B main origin/main
            # the ledger line goes on top of whatever main has now: the newest entry from this run, appended again
            line=$(node -e 'const l=require("/tmp/image-gen-ledger.json"); console.log(JSON.stringify(l[l.length-1]))')
            mkdir -p findings/image-gen && cp -n /tmp/image-gen/*.json findings/image-gen/
            node --input-type=module -e 'import fs from "node:fs"; import { appendTo, LEDGER } from "./tools/grow.mjs"; const e = JSON.parse(process.argv[1]), s = fs.readFileSync(LEDGER, "utf8"); if (!s.includes(JSON.stringify(e))) fs.writeFileSync(LEDGER, appendTo(s, e));' "$line"
            node tools/grow.mjs --check
            git add findings/image-gen void-live-deploy/void.growth.json
            git commit -q -m "Finding: image-gen checked against the live site (findings/image-gen)" || { echo "nothing new to commit"; exit 0; }
            if git push -q origin main; then echo "pushed the finding to main"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error title=Finding not recorded::could not push the image-gen finding to main"; exit 1
      - name: Red when the live check found a problem
        if: steps.check.outputs.code != '0'
        run: |
          echo "::error title=Image check failed::the live image route, page or change did not pass (exit ${{ steps.check.outputs.code }}); the finding records why"
          exit 1
