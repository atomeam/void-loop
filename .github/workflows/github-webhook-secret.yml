# Give the live site GitHub's webhook secret (functions/api/github-events.js). Until GITHUB_WEBHOOK_SECRET is a
# Pages secret, POST /api/github-events answers 503. After it is set, a delivery without a matching signature answers 401.
# The value is the repo secret VERSE_GITHUB_WEBHOOK_SECRET, never written into the repo. A Pages secret reaches
# a-to-mind.com with the next site deploy (the next merge to main); this workflow deploys no site.
# Modelled on modal-sing.yml: the same Cloudflare token and the same pinned wrangler.
name: GitHub webhook secret
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: github-webhook-secret
jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSE_GITHUB_WEBHOOK_SECRET: ${{ secrets.VERSE_GITHUB_WEBHOOK_SECRET }}
      WRANGLER: npx --yes wrangler@3.114.17
      PROJECT: a-to-mind
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put GITHUB_WEBHOOK_SECRET on the Pages project
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set"; exit 1
          fi
          if [ -z "$VERSE_GITHUB_WEBHOOK_SECRET" ]; then
            echo "::error::VERSE_GITHUB_WEBHOOK_SECRET is not set"; exit 1
          fi
          printf '%s' "$VERSE_GITHUB_WEBHOOK_SECRET" | $WRANGLER pages secret put GITHUB_WEBHOOK_SECRET --project-name="$PROJECT"
          {
            echo "### GITHUB_WEBHOOK_SECRET is on the Pages project"
            echo "It reaches a-to-mind.com with the next site deploy. A POST without a valid signature then answers 401."
          } >> "$GITHUB_STEP_SUMMARY"
