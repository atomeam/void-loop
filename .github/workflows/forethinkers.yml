# The Forethinkers cycle (domains/forethinkers/brief.md). One shared part or blocked Void stage per cycle, fanned into
# the active tracks it touches, then one convergence pass that keeps only what changed the map or unblocked a stage.
#
# First live cycle: run it by hand (Actions > Forethinkers cycle > Run workflow) with active_tracks = printing:
# one worker + the convergence pass, 2 model calls. Needs the ANTHROPIC_API_KEY secret.
# The schedule fires at :03 every hour; it does nothing unless the repo variable FORETHINKERS_SCHEDULE is "on", and the
# gate keeps even ET hours only. Full fan-out is 5 calls a cycle, about 60 a day: watched, not left on.
# Silence is the default: a cycle that changed nothing writes nothing. A cycle that changed the map opens a PR.
# The webhook stays off until FORETHINKERS_WEBHOOK_ON is "on" (after a run has written a real finding with a source),
# and then carries breakthrough notes only.
name: Forethinkers cycle

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      active_tracks:
        description: 'Tracks to fan into (comma list of printing, figures, longevity, restoration)'
        default: printing
      max_searches:
        description: 'Web searches per worker (1-10)'
        default: '3'
      unit:
        description: 'Force one map row id (blank = next in rotation)'
        default: ''
      dry_run:
        description: 'Only print the plan (no model calls)'
        type: boolean
        default: false

concurrency:
  group: forethinkers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.FORETHINKERS_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE_TRACKS: ${{ inputs.active_tracks || vars.FORETHINKERS_ACTIVE_TRACKS || 'printing' }}
      MAX_SEARCHES: ${{ inputs.max_searches || vars.FORETHINKERS_MAX_SEARCHES || '3' }}
      UNIT: ${{ inputs.unit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate (schedule only; even ET hours run)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python tools/forethinkers.py gate; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the map
        if: steps.gate.outputs.run == 'true'
        run: python tools/forethinkers.py check
      - name: Plan
        if: steps.gate.outputs.run == 'true'
        run: python tools/forethinkers.py plan | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cycle
        id: cycle
        if: steps.gate.outputs.run == 'true' && !inputs.dry_run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY is not set; nothing ran" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          pip install --quiet anthropic
          python tools/forethinkers.py cycle | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open a PR with what changed
        if: steps.cycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.cycle.outputs.summary }}
        run: |
          branch="forethinkers/run-$(date -u +%Y%m%d-%H%M)"
          git config user.name "forethinkers[bot]"
          git config user.email "forethinkers@users.noreply.github.com"
          git checkout -b "$branch"
          git add domains/forethinkers/convergence.md domains/forethinkers/findings.json
          git commit -m "$SUMMARY"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$SUMMARY" \
            --body "Forethinkers cycle ${{ github.run_id }}. Rows and findings changed by this cycle; \`python tools/forethinkers.py check\` passed before the push."
      - name: Breakthrough note
        if: steps.cycle.outputs.breakthrough == 'true' && vars.FORETHINKERS_WEBHOOK_ON == 'on'
        env:
          WEBHOOK: ${{ secrets.FORETHINKERS_WEBHOOK }}
          NOTE: ${{ steps.cycle.outputs.note }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          python -c 'import json,os; print(json.dumps({"text": "Forethinkers: " + os.environ["NOTE"]}))' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
