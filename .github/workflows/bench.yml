# The everyday benchmark (tools/bench.json, 3,200+ asks on the real page, about 50 min on a hosted runner). It is the
# biggest CI cost, so it does not run on every PR: the routines run it locally before they open a PR (tools/checks.mjs,
# tools/test_void.mjs), the watchdog runs it on main every Sunday, and here it runs on a PR only when the benchmark
# harness itself changes. Run it on any branch by hand: gh workflow run bench.yml --ref <branch>
# It also runs on main once a day, when main has moved since the last good run here (a quiet day costs seconds), and after a
# clean run on main it raises the floor (tools/bench.best.json) by itself: tools/bench-floor.mjs, never lowering it. A drop
# below the floor fails the run, and that is a fix PR, never a wait.
name: Verse bench

on:
  pull_request:
    branches: [main]
    paths:
      - tools/bench.mjs
      - .github/workflows/bench.yml
      - .github/actions/void-test/**
  schedule:
    - cron: '47 9 * * *' # 5:47 AM New York (EDT), when main has moved
  workflow_dispatch:

concurrency:
  group: void-bench-${{ github.event.pull_request.number || github.ref }}
  # a newer push to a pull request supersedes its older run; a run on main never cancels another on main. The daily run on main is what refreshes
  # tools/bench.misses.json and the floor (the self card's "failing" list reads it): on 2026-10-18 it was cancelled, and the card kept showing the
  # failures of 2026-10-17 for two days. Runs on main queue instead (GitHub keeps one waiting, which is the newest).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # 2026-10-17: 2,368 asks took 36 minutes. By 2026-10-20 the benchmark had outgrown 40 minutes, and every daily run on main was cut at
    # the limit (cancelled, 10 days in a row), so tools/bench.misses.json and the growth card's failing list stayed at 2026-10-17 (issue #1695).
    # 3,250+ asks need about 50 minutes, and twice that when a first run is inconclusive and runs once more.
    timeout-minutes: 120
    permissions:
      contents: write # the floor file on main, after a clean run there
      actions: read # to find the last good run
    steps:
      - name: Main moved since the last good run?
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/bench.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### main is still ${{ github.sha }}, which the last benchmark here passed: nothing to re-run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.moved.outputs.run != 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Everyday benchmark
        if: steps.moved.outputs.run != 'false'
        uses: ./.github/actions/void-test
        with:
          bench: only
      - name: Raise the floor and tighten the latency baseline if this clean run on main earns it (never lowers either; an inconclusive run changes nothing)
        if: steps.moved.outputs.run != 'false' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            # decide again on the newest main each time: a floor raised meanwhile (a PR, another run) is never overwritten with less
            git fetch -q origin main && git reset -q --hard origin/main
            node tools/bench-floor.mjs bench-score.json --write | tee -a "$GITHUB_STEP_SUMMARY"
            node tools/families.mjs > /dev/null # the misses are each skill's failing asks there: the growth card's friction line
            git diff --quiet tools/bench.best.json tools/bench.misses.json void-live-deploy/skills/families.json && exit 0
            git add tools/bench.best.json tools/bench.misses.json void-live-deploy/skills/families.json
            git commit -q -m "Bench floor, latency baseline or misses moved by a clean run on main (tools/bench-floor.mjs)"
            git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
