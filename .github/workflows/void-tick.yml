# The clock for Void's own automations (lib/automations.js, functions/api/automations/tick.js): every 15 minutes it asks
# a-to-mind.com to run the scheduled rules that are due. Void decides what is due; this only knocks. A Cloudflare cron
# Worker is the long-term home for the knock (no GitHub in the loop); the route stays the same, so that swap only changes
# who calls it. Needs the repo secret VOID_OWNER_TOKEN (the Pages READ_TOKEN); without it every run is a quiet no-op.
# About 1 Actions minute an hour (GitHub may run a scheduled job late or skip one when busy; a rule is due 3 minutes early).
name: Void's clock

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: void-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the scheduled automations that are due
        env:
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          if [ -z "$VOID_OWNER_TOKEN" ]; then
            echo "::notice title=Clock not running::Repo secret VOID_OWNER_TOKEN (the Pages READ_TOKEN) is not set, so no scheduled automation runs."
            exit 0
          fi
          code=$(curl -sS -o tick.json -w '%{http_code}' -X POST -H "authorization: Bearer $VOID_OWNER_TOKEN" https://a-to-mind.com/api/automations/tick) || code=000
          if [ "$code" != "200" ]; then echo "::warning title=Tick refused::a-to-mind.com answered $code"; head -c 300 tick.json 2>/dev/null; echo; exit 0; fi
          node -e "const t=require('./tick.json'); console.log(t.at + ': ' + t.checked + ' rule(s) on, ' + t.ran.length + ' ran'); for (const r of t.ran) console.log((r.ok ? 'ok ' : 'failed ') + r.id + (r.skipped ? ' (' + r.skipped + ')' : ''))" | tee -a "$GITHUB_STEP_SUMMARY"
