# Verse learns its games by playing itself (frontier #5, the learning half; tools/arena.mjs --learn), daily: replay the rating
# ladders (Connect Four by look-ahead depth, Othello by player), then one more day of self-play tuning at depth 2 that starts
# from the champion the earlier days kept (arena.json's champion) and keeps a challenger only when it clearly beats it; the
# champion is rated against the card's own weights. Commits void-live-deploy/arena.json and arena-othello.json to main, so
# "how good are you at connect four" answers from the newest record. The card keeps playing its own weights until a
# reviewed change adopts the champion. A rerun the same day changes nothing. No secret.
name: Arena

on:
  schedule:
    - cron: '53 6 * * *'
  workflow_dispatch:

concurrency:
  group: arena
  cancel-in-progress: false

permissions:
  contents: write # the arena records on main

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play, tune one more day, write the records
        run: |
          node tools/arena.mjs --learn | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --quiet -- void-live-deploy/arena.json void-live-deploy/arena-othello.json && { echo "nothing changed"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void-live-deploy/arena.json void-live-deploy/arena-othello.json
          git commit -m "Arena: Verse played itself again; the records and the self-play champion"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
