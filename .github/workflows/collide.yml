# Which other open PRs touch this PR's files (tools/collide.mjs): written to the run summary in seconds, read-only, never a gate.
name: Collide

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number. The loop starts this when a workflow-token pull request leaves the pull_request run unstarted.
        required: true
        type: string

concurrency:
  group: collide-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  collide:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr }}"
          case "$PR" in ''|*[!0-9]*) echo "::error::no pull request number"; exit 1 ;; esac
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[].filename' | paste -sd, -)
          node tools/collide.mjs --files "$files" | grep -v "^COLLIDES #${PR} \|^shared   #${PR} " | tee -a "$GITHUB_STEP_SUMMARY"
