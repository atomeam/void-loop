# Verse's clock and conductor (owner, 2026-10-19: "make it grow every ten minutes ... I want Verse to actually evolve noticeably quickly";
# 2026-10-26: "look at Verse autonomy and fix it so it definitly will work on its own without either of us and make it impeccibly
# effeciently productive", "get Verse automated like its very life depends on it").
# Every 10 minutes one tick of the conductor (tools/conductor.mjs, decisions in tools/conductor-core.mjs): it reads the whole build queue
# and the newest runs of every loop, puts back jobs a dead run left, sets aside jobs tried three times, queues a heal: job for a loop that
# failed three runs in a row, starts the most valuable job on each idle executor (propose-fix, build-miss, store-gap, the coding agent),
# and starts probe-asks when Verse should write new probe asks. Before this the clock only alternated probe-asks and propose-fix, and every
# other queued job waited for a person. Its record of the last 24 hours is on the conductor-state branch every tick, and on main every 3 hours
# (domains/conductor.json).
#
# One run used to sleep on the runner for 33 ticks (about five and a half hours). That held a runner the whole time, the next scheduled run
# sat pending behind it, and a git fetch with no timeout could sit there until the 345-minute job limit. A tick is one short job. The state
# between ticks is the conductor-state branch, not a sleeping runner, so a push to main does not follow every tick.
# The chain (2026-11-06): GitHub fired the '*/10' schedule twice between 09:00 and 15:00 UTC, and a dispatched tick's next run started at
# once, found the tick fresh and ended the chain, so the conductor (and the crew clock, the will, the film and the podcast it starts) went
# quiet for hours: the owner saw Verse's crew all idle. Now every run that ticked waits until 9 minutes after its tick landed and then
# starts the next run, whatever started it. A run that finds a fresh tick does nothing and starts nothing, so two chains never run side by
# side (the concurrency group keeps one run going and one waiting). The schedule and will.yml restart the chain if a start ever fails.
name: Verse grows

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7 * * * *' # the hourly restart if the 10-minute schedule is late
  workflow_dispatch:
    inputs:
      dry:
        description: "plan each tick but change nothing (no claims, no starts, no commits)"
        type: boolean
        default: false
      ticks:
        description: "kept so a hand run can still ask; a run does one tick either way"
        type: string
        default: '1'

concurrency:
  group: grow-clock
  cancel-in-progress: false

permissions:
  actions: write   # start the executors and the next clock run (a workflow_dispatch is the one start a GITHUB_TOKEN run can make)
  contents: write  # the conductor-state branch every tick, and domains/conductor.json on main every 3 hours
  issues: read     # the coder's back-off issue ('Verse loop paused'): while it holds, no job is claimed for the coder

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A conductor tick every 10 minutes
        id: clock
        env:
          GH_TOKEN: ${{ github.token }}
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: |
          set +e
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          timeout 90 git fetch -q origin main || echo "::warning title=Conductor::git fetch of main did not finish in 90s"
          timeout 30 git reset -q --hard origin/main || echo "::warning title=Conductor::could not reset to main"
          state="$RUNNER_TEMP/conductor.json"
          timeout 60 git fetch -q origin conductor-state || true
          git show origin/conductor-state:domains/conductor.json > "$state" 2>/dev/null || cp domains/conductor.json "$state" 2>/dev/null || echo '{}' > "$state"
          if [ -z "$DRY" ]; then
            node --input-type=module -e "import fs from 'node:fs'; const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const age=Date.now()-Date.parse(j.updated||0); if (Number.isFinite(age) && age < 8*60*1000) process.exit(2)" "$state"
            if [ "$?" -eq 2 ]; then echo "chain=no" >> "$GITHUB_OUTPUT"; echo "a tick landed in the last 8 minutes"; exit 0; fi
          fi
          timeout 900 node tools/conductor.mjs tick $DRY --state "$state" || echo "::warning title=Conductor::tick ended badly; the clock goes on"
          if [ -n "$DRY" ]; then echo "chain=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          dir="$RUNNER_TEMP/conductor-publish"
          git worktree remove --force "$dir" >/dev/null 2>&1 || true
          rm -rf "$dir"
          if timeout 60 git fetch -q origin conductor-state && git rev-parse --verify origin/conductor-state >/dev/null 2>&1; then
            git worktree add --detach "$dir" origin/conductor-state
          else
            git worktree add --detach "$dir" HEAD
            git -C "$dir" checkout --orphan conductor-state
            git -C "$dir" reset -q
            find "$dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$dir/domains"
          cp "$state" "$dir/domains/conductor.json"
          git -C "$dir" add domains/conductor.json
          if ! git -C "$dir" diff --cached --quiet; then
            git -C "$dir" commit -q -m "Conductor: this tick"
            timeout 90 git -C "$dir" push -q origin HEAD:conductor-state || echo "::warning title=Conductor::the tick record did not push; the next tick retries"
          fi
          # the public record on main, every 3 hours, the same pace as the old in-runner clock
          node --input-type=module -e "import fs from 'node:fs'; let age=1e12; try { age=Date.now()-Date.parse(JSON.parse(fs.readFileSync('domains/conductor.json','utf8')).updated||0) } catch {} if (!(age>3*3600*1000)) process.exit(2)" 
          if [ "$?" -ne 2 ]; then
            cp "$state" domains/conductor.json
            git add domains/conductor.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Conductor: the last 24 hours of Verse running itself"
              timeout 90 git push -q origin HEAD:main || echo "::warning title=Conductor::the main record did not push; the next tick retries"
            fi
          fi
          echo "chain=yes" >> "$GITHUB_OUTPUT"
      # The merge sweep twice an hour, on the clock that does keep time (2026-11-06): GitHub fired automerge.yml's hourly '17 * * * *'
      # schedule 9 times in 48 hours, and 2 of those were cancelled, so a ready pull request with no new event waited for a person.
      # A tick in minutes 0-9 or 30-39 of the hour starts one full sweep (no pr input), which reads every open pull request.
      - name: The merge sweep twice an hour
        if: always() && !inputs.dry && steps.clock.outputs.chain == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$((10#$(date -u +%M)))
          if [ $((m / 10 % 3)) -eq 0 ]; then gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "full merge sweep started (minute $m)"; else echo "no sweep this tick (minute $m)"; fi
      # every run that ticked starts the next one 9 minutes after its tick landed (the fresh check is 8 minutes, so that run ticks too).
      # The wait holds this runner about 9 minutes of every 10; the repository is public, so Actions minutes are not metered.
      - name: Start the next clock run
        if: always() && !inputs.dry && steps.clock.outputs.chain == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$RUNNER_TEMP/conductor.json"
          wait=$(node --input-type=module -e "import fs from 'node:fs'; let u=Date.now(); try { u=Date.parse(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).updated)||u } catch {} console.log(Math.max(0, Math.min(540, Math.ceil((u + 540000 - Date.now()) / 1000))))" "$state" 2>/dev/null || echo 540)
          echo "the next tick starts in ${wait}s"
          sleep "$wait"
          for t in 1 2 3; do gh workflow run grow-clock.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0; sleep $((t * 10)); done
          echo "::warning title=Clock chain broke::the next run did not start; the 10-minute schedule and will.yml restart it"
