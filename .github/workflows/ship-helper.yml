# "Push a branch and Void ships it", from CI instead of the laptop (STANDING.md, helper rule):
# a push to helper/<what> is rebased onto main (merge if the rebase conflicts), the full suite
# runs on the result, and if it passes the result is fast-forwarded onto main, deployed to
# a-to-mind.com, and the helper branch is deleted. Nothing merges unless the tests pass.
# Until the CLOUDFLARE_API_TOKEN secret exists it only tests (so main never gets ahead of the
# live site) and the laptop builder keeps shipping as before.
name: Void ship helper

on:
  push:
    branches: ['helper/**']
  workflow_dispatch:
    inputs:
      branch:
        description: helper/<what> branch to ship
        required: true

concurrency:
  group: void-ship
  cancel-in-progress: false

permissions:
  contents: write
  checks: read # deploy.yml (called below) asks for checks: read; a called workflow gets only what the caller grants, so this keeps startup clean
  actions: write # deploy.yml requests actions: write; without it the called workflow fails at startup

jobs:
  test-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      branch: ${{ steps.base.outputs.branch }}
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Which branch
        id: base
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          b="${INPUT_BRANCH:-${GITHUB_REF#refs/heads/}}"
          case "$b" in helper/*) ;; *) echo "::error::only helper/* branches ship"; exit 1;; esac
          echo "branch=$b" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.branch }}
          fetch-depth: 0

      - name: Rebase onto main (merge if the rebase conflicts)
        id: rebase
        run: |
          git config user.name "void-ship[bot]"
          git config user.email "void-ship@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "already in main, nothing to ship"; echo "noop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rebase origin/main; then
            echo "rebased onto main"
          else
            git rebase --abort
            git merge --no-edit origin/main -m "Merge origin/main into ${{ steps.base.outputs.branch }}" || { echo "::error::conflicts with main; resolve on the branch and push again"; exit 1; }
          fi
          git log --oneline origin/main..HEAD

      - name: Test (full suite, on the result)
        if: steps.rebase.outputs.noop != 'true'
        uses: ./.github/actions/void-test

      - name: Fast-forward main
        id: push
        if: steps.rebase.outputs.noop != 'true'
        run: |
          if [ "$CF_READY" != "true" ]; then
            echo "::warning title=Tested, not shipped::Tests pass on main + ${{ steps.base.outputs.branch }}, but CLOUDFLARE_API_TOKEN is not set, so CI does not merge or deploy (the laptop builder still does)."
            echo "### Tests pass; not shipped (no CLOUDFLARE_API_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin HEAD:refs/heads/main   # fast-forward only; fails if main moved meanwhile
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.base.outputs.branch }} is on main at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: test-merged
    if: needs.test-merged.outputs.sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.test-merged.outputs.sha }}
    secrets: inherit

  cleanup:
    needs: [test-merged, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the shipped helper branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.test-merged.outputs.branch }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || echo "branch already gone"
