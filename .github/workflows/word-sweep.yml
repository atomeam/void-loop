# The word sweep (owner, 2026-10-19: "put a random word generator to cycle every possible card"). Every day it types random words into the live
# site the way a person does (half from the words on Verse's own cards, half random Wikipedia titles) and reads each card that comes back
# (tools/word-sweep.mjs): letters dropped, a false or loose "closest match", a take that is the model's working or a loop, no answer, a page
# error, a slow card. The report is the run's summary and an artifact; it reads what any visitor can read and writes nothing.
name: Verse word sweep

on:
  schedule:
    - cron: '17 15 * * *' # 11:17 AM New York (EDT)
  workflow_dispatch:
    inputs:
      n:
        description: "how many words (2 to 60)"
        type: string
        default: '20'
      words:
        description: "or these words, comma separated"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: word-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (+ system deps)
        run: |
          npx playwright-core install --with-deps chromium
          echo "VOID_TEST_BROWSER=$(node -e "import('playwright-core').then(m=>console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - name: Sweep
        env:
          N: ${{ inputs.n || '20' }}
          WORDS: ${{ inputs.words || '' }}
        run: |
          args=(--n "$N" --out sweep.json)
          [ -n "$WORDS" ] && args+=(--words "$WORDS")
          node tools/word-sweep.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-sweep
          path: sweep.json
          if-no-files-found: ignore
