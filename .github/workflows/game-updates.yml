name: Game updates
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}
concurrency:
  group: verse-coder
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read
jobs:
  lap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.VERSE_LOOP_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: |
          git config user.name "verse-loop"
          git config user.email "verse-loop@users.noreply.github.com"
      - run: |
          npx playwright-core install --with-deps chromium
          echo "VOID_TEST_BROWSER=$(node -e "import('playwright-core').then(m=>console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/verse-loop
          key: verse-loop-state-${{ github.run_id }}
          restore-keys: verse-loop-state-
      - env:
          VERSE_LOOP_STATE: ${{ runner.temp }}/verse-loop/state.json
          VERSE_LOOP_AGENT: verse
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
          GH_TOKEN: ${{ secrets.VERSE_LOOP_TOKEN || github.token }}
          VERSE_LOOP_DISPATCH_CHECKS: ${{ secrets.VERSE_LOOP_TOKEN == '' && '1' || '0' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GAME_PLAY_DIR: ${{ runner.temp }}/game-play
          GAME_PLAY_MS: '75000'
        run: node tools/verse-loop.mjs --once --lane games --checks tools/game-updates.checks.json | tee "$RUNNER_TEMP/lap.txt"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/verse-loop
          key: verse-loop-state-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-play
          path: ${{ runner.temp }}/game-play
          if-no-files-found: ignore
          retention-days: 14
