# Frontier #6 (Verse inside every other AI): a real MCP client against the live site. After every main deploy (deploy.yml starts it),
# after a deploy a person or an agent's own token starts, and by hand, the official MCP SDK client (tools/mcp-probe.mjs) connects to https://a-to-mind.com/api/mcp, initializes,
# lists the tools and calls each one with an input whose answer is known. Red means an agent can no longer use Verse.
# The SDK is installed in this job only (pinned); the repo does not depend on it. Read-only: the tools write nothing and need
# no key or secret. A passing run is kept once a UTC day as a finding (tools/mcp-finding.mjs): findings/mcp/<date>T<hhmm>.json with
# each request and response, and one `finding` line in the growth ledger, committed to main (owner, 2026-10-30).
name: MCP live

on:
  workflow_run:
    workflows: [Verse deploy]
    types: [completed]
    branches: [main]
  # no hourly re-check (owner, 2026-10-15: "cloudflare is not unlimited ... not so much on testing old thing"): deploy.yml starts
  # this run after every main deploy (a workflow_dispatch, which a GITHUB_TOKEN run can make), and nothing changes in between
  workflow_dispatch:
    inputs:
      url:
        description: The MCP endpoint to probe
        default: 'https://a-to-mind.com/api/mcp'
        type: string
      force:
        description: Keep a finding even if one is already kept today
        default: false
        type: boolean

permissions:
  contents: write # only to commit the finding and its ledger line to main

concurrency:
  group: mcp-live
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The MCP SDK, for this job only
        run: mkdir -p /tmp/probe && cp tools/mcp-probe.mjs /tmp/probe/ && cd /tmp/probe && npm init -y >/dev/null && npm i --no-audit --no-fund @modelcontextprotocol/sdk@1.32.1
      - name: An MCP client lists and calls Verse's tools
        env:
          URL_IN: ${{ inputs.url }}
          MCP_RECORD: /tmp/mcp-record.json
        run: |
          set -o pipefail
          sleep 45 # the Pages deploy is live a few seconds after the job ends; give the edge a moment
          cd /tmp/probe && node mcp-probe.mjs "${URL_IN:-https://a-to-mind.com/api/mcp}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the run as a finding (the request and the response of each call)
        # only the live site counts, not another endpoint a person typed in
        if: success() && (inputs.url == '' || inputs.url == 'https://a-to-mind.com/api/mcp')
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          node tools/mcp-finding.mjs /tmp/mcp-record.json $FORCE | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain findings/mcp void-live-deploy/void.growth.json)" ]; then echo "no new finding to commit"; exit 0; fi
          node tools/grow.mjs --check
          mkdir -p /tmp/mcp && cp -r findings/mcp/. /tmp/mcp/ && cp void-live-deploy/void.growth.json /tmp/mcp-ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -f -B main origin/main
            # the ledger line goes on top of whatever main has now: the newest entry from this run, appended again
            line=$(node -e 'const l=require("/tmp/mcp-ledger.json"); console.log(JSON.stringify(l[l.length-1]))')
            mkdir -p findings/mcp && cp -n /tmp/mcp/*.json findings/mcp/
            node --input-type=module -e 'import fs from "node:fs"; import { appendTo, LEDGER } from "./tools/grow.mjs"; const e = JSON.parse(process.argv[1]), s = fs.readFileSync(LEDGER, "utf8"); if (!s.includes(JSON.stringify(e))) fs.writeFileSync(LEDGER, appendTo(s, e));' "$line"
            node tools/grow.mjs --check
            git add findings/mcp void-live-deploy/void.growth.json
            git commit -q -m "Finding: a real MCP client called Verse's live tools (findings/mcp)" || { echo "nothing new to commit"; exit 0; }
            if git push -q origin main; then echo "pushed the finding to main"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error title=Finding not recorded::could not push the MCP finding to main"; exit 1
