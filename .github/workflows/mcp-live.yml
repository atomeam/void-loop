# Frontier #6 (Verse inside every other AI): a real MCP client against the live site. After every main deploy (deploy.yml starts it),
# after a deploy a person or an agent's own token starts, and by hand, the official MCP SDK client (tools/mcp-probe.mjs) connects to https://a-to-mind.com/api/mcp, initializes,
# lists the tools and calls each one with an input whose answer is known. Red means an agent can no longer use Verse.
# The SDK is installed in this job only (pinned); the repo does not depend on it. Read-only: the tools write nothing and need
# no key or secret.
name: MCP live

on:
  workflow_run:
    workflows: [Verse deploy]
    types: [completed]
    branches: [main]
  # no hourly re-check (owner, 2026-10-15: "cloudflare is not unlimited ... not so much on testing old thing"): deploy.yml starts
  # this run after every main deploy (a workflow_dispatch, which a GITHUB_TOKEN run can make), and nothing changes in between
  workflow_dispatch:
    inputs:
      url:
        description: The MCP endpoint to probe
        default: 'https://a-to-mind.com/api/mcp'
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-live
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The MCP SDK, for this job only
        run: mkdir -p /tmp/probe && cp tools/mcp-probe.mjs /tmp/probe/ && cd /tmp/probe && npm init -y >/dev/null && npm i --no-audit --no-fund @modelcontextprotocol/sdk@1.32.1
      - name: An MCP client lists and calls Verse's tools
        env:
          URL_IN: ${{ inputs.url }}
        run: |
          sleep 45 # the Pages deploy is live a few seconds after the job ends; give the edge a moment
          cd /tmp/probe && node mcp-probe.mjs "${URL_IN:-https://a-to-mind.com/api/mcp}" | tee -a "$GITHUB_STEP_SUMMARY"
