# The Forethinkers backstop (domains/forethinkers/THINK-TANK-BRIEF.md). A talking cycle doesn't wait for this.
# Hourly trigger; the job runs only on an even America/New_York hour (2:03, 4:03, ...), so the two-hour rhythm holds
# across the November clock change (tools/forethinkers.py selftest checks both sides).
# One cycle: one model call that sees every track and the whole map, web searches capped. Without ANTHROPIC_API_KEY it
# lists the tracks and stops. Off switch: repo variable FORETHINKERS_SCHEDULE = off. Model: repo variable MODEL.
# Silence is the default: a cycle that changed nothing writes nothing; one that changed the map opens a PR.
# Webhook (NOTIFY_WEBHOOK) only when FORETHINKERS_WEBHOOK_ON is "on", and only for a sourced breakthrough.
name: Forethinkers

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      max_searches:
        description: 'Web searches in the cycle (1-20)'
        default: '5'

concurrency:
  group: forethinkers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.FORETHINKERS_SCHEDULE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_SEARCHES: ${{ inputs.max_searches || vars.FORETHINKERS_MAX_SEARCHES || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Even New York hour, or a manual run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python tools/forethinkers.py gate; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the map
        if: steps.gate.outputs.run == 'true'
        run: python tools/forethinkers.py check
      - name: One cycle, every track
        id: cycle
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python tools/forethinkers.py cycle | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open a PR with what changed
        if: steps.cycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.cycle.outputs.summary }}
        run: |
          branch="forethinkers/run-$(date -u +%Y%m%d-%H%M)"
          git config user.name "forethinkers[bot]"
          git config user.email "forethinkers@users.noreply.github.com"
          git checkout -b "$branch"
          git add domains/forethinkers domains/void.growth.md
          git commit -m "$SUMMARY"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$SUMMARY" \
            --body "Forethinkers cycle ${{ github.run_id }}. Map rows, findings and the run log changed by this cycle; \`python tools/forethinkers.py check\` passed before the push."
      - name: Breakthrough note
        if: steps.cycle.outputs.breakthrough == 'true' && vars.FORETHINKERS_WEBHOOK_ON == 'on'
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTE: ${{ steps.cycle.outputs.note }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          python -c 'import json,os; print(json.dumps({"text": "Forethinkers: " + os.environ["NOTE"]}))' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
