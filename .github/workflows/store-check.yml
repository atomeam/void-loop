# Verse's store checks its own downloads (tools/store-publish.mjs check; docs/store.md "Self-publishing"). Daily at about 7 AM ET
# every live free product gets a fresh signed link from https://a-to-mind.com/api/store/free and its first bytes are fetched.
# A product whose download fails is unpublished: status "unpublished" in domains/store.products.json, a public changelog row,
# and a pull request (automerge picks it up on green). Nothing else is written; no secrets are needed.
name: Store download check

on:
  schedule:
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: store-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every live download
        id: check
        run: |
          set +e
          node tools/store-publish.mjs check | tee -a "$GITHUB_STEP_SUMMARY"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Unpublish what failed (pull request)
        if: steps.check.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/store-unpublish-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add domains/store.products.json void-live-deploy/lib/store-products.js void-live-deploy/store/changelog.json docs/store-changelog.md
          git commit -m "store: unpublish products whose download check failed"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --label automerge --title "Store: unpublish failed downloads" --body "tools/store-publish.mjs check found broken downloads. Details in docs/store-changelog.md." || gh pr create --base main --head "$branch" --title "Store: unpublish failed downloads" --body "tools/store-publish.mjs check found broken downloads."
