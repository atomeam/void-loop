# Is V01D getting better? Once a day tools/better.mjs measures five parts from the repo's own evidence (lib/better.js), appends
# the row to void-live-deploy/void.better.json and commits it to main; the growth card shows the number and its trend and
# tools/will.py weighs wants toward the weakest part. Counts only, no network, no secret.
name: Better

on:
  schedule:
    - cron: '51 6 * * *'
  workflow_dispatch:

concurrency:
  group: better
  cancel-in-progress: false

permissions:
  contents: write # the row on main

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure and write today's row
        run: |
          node tools/better.mjs --write | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --quiet void-live-deploy/void.better.json && { echo "row unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void-live-deploy/void.better.json
          git commit -m "Better: today's measure (counts only)"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
