# Test every change; ship main to Cloudflare Pages (a-to-mind) without the laptop.
# Same steps as tools/deploy.ps1: sync the void.html copies, run node tools/test_void.mjs (stop on any failure), deploy.
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a token limited to "Account > Cloudflare Pages > Edit" on Atom's account
#   CLOUDFLARE_ACCOUNT_ID - the account id (Cloudflare dashboard, right column of the account home)
# Until both exist, main is still tested and the deploy step says it is waiting for them (the run stays green).
name: test and deploy Void

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: void-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the intake checks read the git history of the input records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: sync the void.html copies (as deploy.ps1 does)
        run: |
          cp void.html void-live-deploy/index.html
          cp void.html void-live-deploy/void.html
      - name: node tools/test_void.mjs
        env:
          VOID_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/test_void.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: void-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sync the void.html copies
        run: |
          cp void.html void-live-deploy/index.html
          cp void.html void-live-deploy/void.html
      - name: check for the Cloudflare key
        id: key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets. Tests passed."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: wrangler pages deploy
        if: steps.key.outputs.ok == 'true'
        working-directory: void-live-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name=a-to-mind --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s | head -c 300)" --commit-dirty=true
      - name: confirm the live page (STANDING.md list)
        if: steps.key.outputs.ok == 'true'
        run: |
          for i in $(seq 1 12); do
            curl -fsS -o live.html "https://a-to-mind.com/?v=$GITHUB_SHA" || true
            missing=""
            for m in mountClock mountSticky mountNotepad mountLink mountImage mountList mountCalc mountTimer mountCounter mountShape; do
              grep -q "$m" live.html 2>/dev/null || missing="$missing $m"
            done
            if [ -z "$missing" ] && cmp -s live.html void.html; then echo "live: a-to-mind.com serves this commit's void.html"; exit 0; fi
            sleep 10
          done
          echo "::error::a-to-mind.com is not serving this commit's void.html (missing mounts:${missing:- none})"; exit 1
