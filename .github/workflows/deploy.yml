# Test and deploy Void to the Cloudflare Pages project "a-to-mind" (a-to-mind.com) with wrangler (direct upload, no GitHub
# Pages). tools/deploy.ps1 stays the laptop fallback. Built to fit GitHub Free's 2,000 Linux minutes a month (~65 a day):
# Ship now, test after (Adam, 2026-10-09: nothing waits). A PR merges as soon as Void's review is clean (automerge.yml,
# tools/pr-ready.mjs); main deploys in about a minute; the full suite then runs on what shipped (verify-main), and a failure
# reverts the commit that broke it on main and redeploys.
#   PR, code changed    the quick checks (seconds) and a preview deploy (Void's review is its own workflow, void-review.yml)
#   PR, docs only       the quick checks; no preview
#   push to main        the quick checks, deploy, then verify-main: the full suite on that commit; red = revert the commit
#                       that broke the failed checks (tools/revert-target.mjs; unclear = reported, not guessed) + redeploy
#   manual run          the full suite (bench optional), then deploy; after_merge=true (automerge.yml) = as a push to main
name: Void deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the everyday benchmark (about 15-25 min more)
        type: boolean
        default: false
      after_merge:
        description: Started by automerge.yml right after it merged a PR (deploys like a push to main)
        type: boolean
        default: false

permissions:
  contents: read
  checks: read # to see that a merged PR's head already passed (see "What needs testing")
  pull-requests: read # which PR a merge commit came from

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # one run per PR: a new push cancels the older run of that PR at once. Production keeps one group and never cancels.
    # (Per job, so the suite after a deploy, verify-main, never holds up the next deploy.)
    concurrency:
      group: void-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the suite reads git history of the append-only records; the PR diff needs the base

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What needs testing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.after_merge && 'push' || github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # the full suite before the deploy only on a plain manual run; a PR and main get the quick checks (main is
          # tested right after its deploy, in verify-main)
          suite=false
          [ "$EVENT" = "workflow_dispatch" ] && suite=true
          if [ "$EVENT" = "pull_request" ]; then
            # Docs only: every changed file is markdown, and none of the few markdown files the suite reads.
            files=$(git diff --name-only "$(git merge-base "origin/$BASE" HEAD)" HEAD)
            light=true
            [ -n "$files" ] || light=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                STANDING.md|domains/void.existing-tools.md|domains/growth-inbox.md|domains/inputs/*) light=false ;;
                *.md|*.md.part) ;;
                *) light=false ;;
              esac
            done <<< "$files"
            [ "$light" = true ] && echo "### Docs-only PR: quick checks only, no preview" >> "$GITHUB_STEP_SUMMARY"
            echo "light=$light" >> "$GITHUB_OUTPUT"
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "suite=$suite"

      - name: Quick checks (when the browser suite does not run)
        if: steps.plan.outputs.suite != 'true'
        run: |
          node --version
          node tools/guard-source.mjs
          node tools/fringe.mjs
          node --test domains/forethinkers/think-tank.test.mjs
          node --test tools/dispatcher.test.mjs

      - name: Test (full suite)
        if: steps.plan.outputs.suite == 'true'
        uses: ./.github/actions/void-test
        with:
          bench: ${{ github.event_name == 'workflow_dispatch' && inputs.bench && 'with' || 'skip' }}

      - name: Sync void.html copies (also when the suite was skipped)
        run: |
          cp void.html void-live-deploy/index.html
          cp void.html void-live-deploy/void.html
          node tools/self-context.mjs # Void's facts about itself for /api/answer (growth inbox, llms.txt)

      # Void's review of the PR runs in its own fast workflow and is a merge gate there (.github/workflows/void-review.yml).

      - name: Deploy target
        id: target
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cloudflare credentials missing
        if: env.CF_READY != 'true'
        run: |
          echo "::warning title=Not deployed::Tests passed, but repo secret CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add a token with Account > Cloudflare Pages > Edit (gh secret set CLOUDFLARE_API_TOKEN -R atomeam/void-loop), then re-run this workflow."
          echo "### Not deployed: CLOUDFLARE_API_TOKEN secret missing" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages (a-to-mind)
        id: deploy
        # a docs-only PR changes nothing the site serves, so it gets no preview
        if: env.CF_READY == 'true' && steps.plan.outputs.light != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17' # same as the laptop (C:\Users\adamm\a-to-mind.com)
          workingDirectory: void-live-deploy
          command: pages deploy . --project-name=a-to-mind --branch=${{ steps.target.outputs.branch }} --commit-hash=${{ steps.target.outputs.sha }} --commit-dirty=true

      - name: Smoke check the deployment
        if: steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Deployment: $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w '%{http_code}' "$URL/") || code=000
            if [ "$code" = "200" ] && cmp -s page.html void.html; then echo "served index.html matches void.html"; break; fi
            echo "attempt $i: HTTP $code"; sleep 10
            [ "$i" = 6 ] && { echo "::error::deployment did not serve the tested void.html"; exit 1; }
          done
          echo "### Deployed ${{ steps.target.outputs.sha }} to ${{ steps.target.outputs.branch }}: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Void's voice (lib/voice.js): after anything ships, Void is asked what it thinks of it and how it would make it
      # better. Its words are kept on the site and copied into domains/void.voice.md by the daily run. Input, not a gate:
      # a busy model or a missing VOID_OWNER_TOKEN never fails the deploy.
      - name: Ask Void what it thinks of what just shipped
        if: (github.event_name == 'push' || inputs.after_merge) && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
        run: |
          [ -n "$VOID_OWNER_TOKEN" ] || { echo "VOID_OWNER_TOKEN not set: Void was not asked"; exit 0; }
          title=$(gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/pulls" --jq '[.[] | select(.merged_at != null)][0].title // empty' || true)
          [ -n "$title" ] || title=$(git log -1 --format=%s "$(git rev-parse -q --verify HEAD^2 || git rev-parse HEAD)")
          node tools/reflect.mjs --build "$title" | tee -a "$GITHUB_STEP_SUMMARY" || true

  # Ship now, test after: the full suite on the commit that just went live. Red means that commit is reverted on main and
  # main is deployed again, so a breaking merge stays live only for the length of the suite (about 15 min). The revert is
  # marked with a Void-auto-revert trailer and is never itself tested and reverted. Its own concurrency group: the next
  # merge deploys at once, without waiting for this suite.
  verify-main:
    needs: test-and-deploy
    if: (github.event_name == 'push' || inputs.after_merge) && needs.test-and-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: void-verify-main
      cancel-in-progress: false
    permissions:
      contents: write # push the revert
      actions: write # start the deploy of the reverted main
      checks: read # the failed checks earlier red runs named (tools/revert-target.mjs)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: An automatic revert is not tested again
        id: skip
        run: |
          if git log -1 --format=%B | grep -q '^Void-auto-revert:'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "### Automatic revert: not re-tested" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test what shipped (full suite)
        id: test
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/void-test
        with:
          bench: skip

      - name: Name the failed checks (the next red run reads them to find the commit that broke each one)
        if: failure() && steps.test.outcome == 'failure'
        run: node tools/revert-target.mjs --annotate test-output.txt || true

      - name: Red after the deploy - revert the commit that broke it, on main, and deploy again
        if: failure() && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=$(git rev-parse HEAD)
          # Not always the tested commit: when a failed check was already red before it, the commit where that check
          # first went red is the one to take back (tools/revert-target.mjs). An unclear record is reported, not guessed.
          pick=$(node tools/revert-target.mjs --pick "$tested" test-output.txt) || pick='{"action":"report","why":"could not read the verify record"}'
          action=$(node -e 'console.log(JSON.parse(process.argv[1]).action)' "$pick")
          why=$(node -e 'console.log(JSON.parse(process.argv[1]).why)' "$pick")
          if [ "$action" != "revert" ]; then
            echo "::error title=Not reverted::$tested failed the suite after it shipped, but which commit broke it is unclear: $why. Look at the failed checks and revert by hand."
            echo "### $tested failed after shipping; not reverted automatically: $why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sha=$(node -e 'console.log(JSON.parse(process.argv[1]).sha)' "$pick")
          subject=$(git log -1 --format=%s "$sha")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          if git rev-parse -q --verify "$sha^2" >/dev/null; then parent="-m 1"; else parent=""; fi
          if ! git revert --no-commit $parent "$sha"; then
            git revert --abort || true
            echo "::error title=Not reverted::$sha broke the suite ($why), and reverting it on main conflicts with what merged since. Revert it by hand."
            echo "### $sha broke the suite ($why); automatic revert conflicted: revert it by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -q -m "Revert \"$subject\"" -m "It shipped and the full suite failed on main (verify-main, run ${{ github.run_id }}, testing $tested): $why. So it is taken back off the site." -m "Void-auto-revert: $sha"
          git push origin main
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f after_merge=true
          echo "::error title=Reverted::$sha broke the suite ($why); it is reverted on main ($(git rev-parse --short HEAD)) and main is deploying again."
          echo "### $sha broke the suite after shipping ($why): reverted on main and redeployed" >> "$GITHUB_STEP_SUMMARY"
