# Test and deploy Void to the Cloudflare Pages project "a-to-mind" (a-to-mind.com) with wrangler (direct upload, no GitHub
# Pages). tools/deploy.ps1 stays the laptop fallback. Built to fit GitHub Free's 2,000 Linux minutes a month (~65 a day):
#   PR, code changed    the full suite (no benchmark: see bench.yml and the weekly watchdog), Void's review comment, a preview deploy
#   PR, docs only       the quick checks (seconds), Void's review comment; no browser suite, no preview
#   push to main        deploy. The full suite runs again only when the commit is not a merged PR whose head passed
#                       test-and-deploy (a direct push, or a PR merged without a green check); the daily watchdog re-tests main
#   manual run          the full suite (bench optional), then deploy
# test-and-deploy is the merge gate and always reports, on every PR.
name: Void deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the everyday benchmark (about 15-25 min more)
        type: boolean
        default: false

concurrency:
  # one run per PR: a new push cancels the older run of that PR at once. Production keeps one group and never cancels.
  group: void-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read # to see that a merged PR's head already passed (see "What needs testing")
  pull-requests: write # Void's one review comment on the PR

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the suite reads git history of the append-only records; the PR diff needs the base

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What needs testing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          suite=true
          if [ "$EVENT" = "pull_request" ]; then
            # Docs only: every changed file is markdown, and none of the few markdown files the suite reads.
            files=$(git diff --name-only "$(git merge-base "origin/$BASE" HEAD)" HEAD)
            light=true
            [ -n "$files" ] || light=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                STANDING.md|domains/void.existing-tools.md|domains/growth-inbox.md|domains/inputs/*) light=false ;;
                *.md|*.md.part) ;;
                *) light=false ;;
              esac
            done <<< "$files"
            if [ "$light" = true ]; then
              suite=false
              echo "### Docs-only PR: quick checks only, no browser suite" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "light=$light" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            # A merge commit's second parent, or the PR a squash merge came from: when that head passed test-and-deploy,
            # main is not tested twice (the quick checks still run, and the daily watchdog runs the full suite on main).
            head=$(git rev-parse HEAD)
            pr_head=$(git rev-parse -q --verify HEAD^2 || true)
            if [ -z "$pr_head" ]; then
              pr_head=$(gh api "repos/${{ github.repository }}/commits/$head/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty' || true)
            fi
            if [ -n "$pr_head" ]; then
              ok=$(gh api "repos/${{ github.repository }}/commits/$pr_head/check-runs?check_name=test-and-deploy" \
                --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.id) | last | .conclusion // ""' || true)
              if [ "$ok" = "success" ]; then
                suite=false
                echo "### Not re-tested: merged PR head $pr_head passed test-and-deploy" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "suite=$suite"

      - name: Quick checks (when the browser suite does not run)
        if: steps.plan.outputs.suite != 'true'
        run: |
          node --version
          node tools/guard-source.mjs
          node tools/fringe.mjs
          node --test domains/forethinkers/think-tank.test.mjs
          node --test tools/dispatcher.test.mjs

      - name: Test (full suite)
        if: steps.plan.outputs.suite == 'true'
        uses: ./.github/actions/void-test
        with:
          bench: ${{ github.event_name == 'workflow_dispatch' && inputs.bench && 'with' || 'skip' }}

      - name: Sync void.html copies (also when the suite was skipped)
        run: |
          cp void.html void-live-deploy/index.html
          cp void.html void-live-deploy/void.html
          node tools/self-context.mjs # Void's facts about itself for /api/answer (growth inbox, llms.txt)

      # Void reviews its own pull requests: tools/review-pr.mjs runs the code checks a-to-mind.com runs when a visitor asks
      # Void to review code (void-live-deploy/lib/code-review.js) on the lines the PR adds, and keeps one PR comment
      # (marked <!-- void-review -->) up to date. It informs; it never fails the PR.
      - name: Void's review of the lines this PR adds
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          node tools/review-pr.mjs --base "origin/$BASE" --head HEAD > void-review.md
          cat void-review.md >> "$GITHUB_STEP_SUMMARY"
          body=$(jq -Rs '{body: .}' < void-review.md)
          id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- void-review -->")))][0].id // empty' | head -n1)
          if [ -n "$id" ]; then
            echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - > /dev/null
          else
            echo "$body" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi

      - name: Deploy target
        id: target
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cloudflare credentials missing
        if: env.CF_READY != 'true'
        run: |
          echo "::warning title=Not deployed::Tests passed, but repo secret CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add a token with Account > Cloudflare Pages > Edit (gh secret set CLOUDFLARE_API_TOKEN -R atomeam/void-loop), then re-run this workflow."
          echo "### Not deployed: CLOUDFLARE_API_TOKEN secret missing" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages (a-to-mind)
        id: deploy
        # a docs-only PR changes nothing the site serves, so it gets no preview
        if: env.CF_READY == 'true' && steps.plan.outputs.light != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17' # same as the laptop (C:\Users\adamm\a-to-mind.com)
          workingDirectory: void-live-deploy
          command: pages deploy . --project-name=a-to-mind --branch=${{ steps.target.outputs.branch }} --commit-hash=${{ steps.target.outputs.sha }} --commit-dirty=true

      - name: Smoke check the deployment
        if: steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Deployment: $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w '%{http_code}' "$URL/") || code=000
            if [ "$code" = "200" ] && cmp -s page.html void.html; then echo "served index.html matches void.html"; break; fi
            echo "attempt $i: HTTP $code"; sleep 10
            [ "$i" = 6 ] && { echo "::error::deployment did not serve the tested void.html"; exit 1; }
          done
          echo "### Deployed ${{ steps.target.outputs.sha }} to ${{ steps.target.outputs.branch }}: $URL" >> "$GITHUB_STEP_SUMMARY"
