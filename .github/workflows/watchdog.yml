# Verse watchdog: the loop checks itself. Once a day (and on demand) it runs the full suite on main; on Sundays the everyday
# benchmark and the grown replay too. A daily run is skipped when main has not moved since the last green watchdog run, so a
# quiet day costs about a minute. If anything fails it opens one issue (or comments on the open one) with the failing run,
# so the next agent fixes it first; when main is green again it closes that issue. No secrets needed.
# (Once a day rather than every six hours: GitHub Free gives a private repo 2,000 Actions minutes a month.)
name: Verse watchdog

on:
  schedule:
    - cron: '17 10 * * 1-6' # 6:17 AM New York (EDT), Monday to Saturday: full suite
    - cron: '17 10 * * 0'   # Sunday: full suite and the everyday benchmark
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the everyday benchmark
        type: boolean
        default: true
      stats:
        description: Also write the reviewer's weekly stats (review-stats.json)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read # to find the last green watchdog run

jobs:
  # The full suite no longer fits one runner's 28-minute budget (the 2026-10-28 run stopped at 397/409 with "suite budget"), so the
  # watchdog runs it the way verify.yml does: the fast tests once, the browser suite in four shards (tools/shard.mjs), the
  # benchmark on its own on Sundays, and one job that opens, updates or closes the issue from all of their results.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.moved.outputs.run }}
    steps:
      - name: Main moved since the last green run?
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/watchdog.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 10 * * 0" ] && [ "$last" = "${{ github.sha }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### main is still ${{ github.sha }}, which the last watchdog run passed: nothing to re-test" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fast:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The fast tests (Python tools, node unit tests, extension, glyphs, calendar, growth suites)
        uses: ./.github/actions/void-test
        with:
          bench: skip
          part: fast

  suite:
    needs: moved
    if: needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Browser suite (shard ${{ matrix.shard }} of 4 of the full suite)
        uses: ./.github/actions/void-test
        with:
          bench: skip
          part: suite
          shard: ${{ matrix.shard }}/4

  bench:
    needs: moved
    if: needs.moved.outputs.run == 'true' && (github.event.schedule == '17 10 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.bench))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The everyday benchmark (not below tools/bench.best.json)
        uses: ./.github/actions/void-test
        with:
          bench: only

  check:
    needs: [moved, fast, suite, bench]
    if: always() && needs.moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open, update or close the watchdog issue
        uses: actions/github-script@v7
        env:
          # green only when the fast tests and every shard passed, and the benchmark passed or was not due
          OUTCOME: ${{ (needs.fast.result == 'success' && needs.suite.result == 'success' && (needs.bench.result == 'success' || needs.bench.result == 'skipped')) && 'success' || 'failure' }}
        with:
          script: |
            const title = 'Verse watchdog: main is failing';
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'watchdog' });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.OUTCOME === 'success') {
              for (const i of open) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: 'Green again on ' + context.sha.slice(0, 7) + ' (' + run + '). Closing.' });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const body = 'The check failed on main ' + context.sha.slice(0, 7) + ': ' + run + '\n\nFix this before new work: read the run log, find the failing check, fix it, merge on green. This issue closes itself when main is green.';
            if (open.length) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['watchdog'] });
            core.setFailed('main failed the check');

  # The reviewer's own scoreboard, once a week (frontier #1): tools/review-learn.mjs reads Verse's closer read on the PRs merged in the
  # last 30 days, counts the findings its rules had already flagged and the false claims it filtered, and writes the numbers to
  # void-live-deploy/review-stats.json; /code-review/ shows them ("this month Verse's rules caught N of M findings its closer read
  # made; K rules learned"). The commit goes straight to main like Verse's voice does (void-voice.yml); main's deploy carries it.
  review-stats:
    if: github.event.schedule == '17 10 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.stats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the stats file on main
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count the month (the closer read's findings against the rules)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/review-learn.mjs --since 30d --stats void-live-deploy/review-stats.json | tee stats.txt
          tail -3 stats.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Write the numbers to main
        run: |
          git diff --quiet void-live-deploy/review-stats.json && { echo "stats unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void-live-deploy/review-stats.json
          git commit -m "Review stats: this month's closer-read findings against the rules (tools/review-learn.mjs)"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
