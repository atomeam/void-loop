# Verse watchdog: the loop checks itself, without running the suite a second time (docs/systems.md, duplicates). verify.yml already runs
# the full suite on every head of main and reverts a red one. The watchdog reads verify's newest finished verdict on main (a cancelled or
# skipped run is not a verdict) and keeps one issue: it opens it (or comments on the open one) and starts pr-fix.yml when main is red, and
# closes it when main is green. Once a day, and every 3 hours while the issue is open; each run is one API read, about a minute.
# Before 2026-11-20 it ran the fast tests and the browser suite again in 8 shards (and the benchmark on Sundays, which bench.yml runs daily):
# the same checks on the same commits, competing with verify for runners. The weekly reviewer stats are unchanged. No secrets needed.
name: Verse watchdog

on:
  schedule:
    - cron: '17 10 * * 1-6' # 6:17 AM New York (EDT), Monday to Saturday: read main's verdict
    - cron: '17 10 * * 0'   # Sunday: the verdict and the reviewer's weekly stats
    - cron: '23 */3 * * *'  # while the watchdog issue is open: read it again, so it closes within hours of main going green
  workflow_dispatch:
    inputs:
      stats:
        description: Also write the reviewer's weekly stats (review-stats.json)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write # read verify's runs, and start pr-fix.yml when main is failing

concurrency:
  group: verse-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read verify's verdict on main, and open, update or close the watchdog issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'watchdog' });
            if (context.eventName === 'schedule' && context.payload.schedule === '23 */3 * * *' && !open.length) { core.info('no open watchdog issue: nothing to recheck'); return; }
            const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'verify.yml', branch: 'main', status: 'completed', per_page: 30 });
            const verdict = data.workflow_runs.find((r) => r.conclusion === 'success' || r.conclusion === 'failure');
            if (!verdict) { core.warning('verify.yml has no finished verdict on main in its last 30 runs'); return; }
            const sha = verdict.head_sha.slice(0, 7), run = verdict.html_url;
            await core.summary.addRaw('### verify.yml on main ' + sha + ': ' + verdict.conclusion + ' (' + run + ')').write();
            const title = 'Verse watchdog: main is failing';
            if (verdict.conclusion === 'success') {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Green again on ' + sha + ' (' + run + '). Closing.' });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const body = 'The full suite failed on main ' + sha + ': ' + run + '\n\nFix this before new work: read the run log, find the failing check, fix it, merge on green. This issue closes itself when main is green.';
            if (open.length) await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ owner, repo, title, body, labels: ['watchdog'] });
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pr-fix.yml', ref: 'main', inputs: { pr: '', mode: 'main', why: 'watchdog main ' + sha + ' is failing' } });
            } catch (e) { core.warning('main fix was not started: ' + String(e).slice(0, 180)); }
            core.setFailed('main failed the check');

  # The reviewer's own scoreboard, once a week (frontier #1): tools/review-learn.mjs reads Verse's closer read on the PRs merged in the
  # last 30 days, counts the findings its rules had already flagged and the false claims it filtered, and writes the numbers to
  # void-live-deploy/review-stats.json; /code-review/ shows them ("this month Verse's rules caught N of M findings its closer read
  # made; K rules learned"). The commit goes straight to main like Verse's voice does (void-voice.yml); main's deploy carries it.
  review-stats:
    if: github.event.schedule == '17 10 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.stats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the stats file on main
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count the month (the closer read's findings against the rules)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/review-learn.mjs --since 30d --stats void-live-deploy/review-stats.json | tee stats.txt
          tail -3 stats.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Write the numbers to main
        run: |
          git diff --quiet void-live-deploy/review-stats.json && { echo "stats unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void-live-deploy/review-stats.json
          git commit -m "Review stats: this month's closer-read findings against the rules (tools/review-learn.mjs)"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
