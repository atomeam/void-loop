# The rides family against a live service (tools/rides-live.mjs): once a day, from GitHub's network, ask the public OSRM demo router
# (no key, no account) for the drive from SFO to Union Square, keep the response as an artifact (findings/rides/<date>T<hhmm>.json,
# attempt "live", the occasion number) and write one `finding` line to the growth ledger pointing at it. Both files are committed
# to main by the bot, the way verify.yml records an incident. Success is the call answering with a route AND the finding landing on
# main; the job is red otherwise. Nothing a person typed is sent, nothing secret is used.
name: Rides live

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: rides-live
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask the live router once and write the finding
        id: call
        run: |
          set +e
          node tools/rides-live.mjs > rides-live.out; code=$?
          set -e
          cat rides-live.out
          sed -n '/^### rides, live/,$p' rides-live.out >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit the artifact and the ledger line to main
        if: always()
        run: |
          if [ -z "$(git status --porcelain findings/rides void-live-deploy/void.growth.json)" ]; then echo "nothing was written (the service could not be reached)"; exit 1; fi
          node tools/grow.mjs --check
          mkdir -p /tmp/rides && cp -r findings/rides/. /tmp/rides/ && cp void-live-deploy/void.growth.json /tmp/rides-ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -f -B main origin/main
            # the ledger line goes on top of whatever main has now: the newest entry from this run, appended again
            line=$(node -e 'const l=require("/tmp/rides-ledger.json"); console.log(JSON.stringify(l[l.length-1]))')
            mkdir -p findings/rides && cp -n /tmp/rides/*.json findings/rides/
            node --input-type=module -e 'import fs from "node:fs"; import { appendTo, LEDGER } from "./tools/grow.mjs"; const e = JSON.parse(process.argv[1]), s = fs.readFileSync(LEDGER, "utf8"); if (!s.includes(JSON.stringify(e))) fs.writeFileSync(LEDGER, appendTo(s, e));' "$line"
            node tools/grow.mjs --check
            git add findings/rides void-live-deploy/void.growth.json
            git commit -q -m "Finding: rides asked a live routing service (findings/rides)" || { echo "nothing new to commit"; exit 0; }
            if git push -q origin main; then echo "pushed the finding to main"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error title=Finding not recorded::could not push the rides finding to main"; exit 1
      - name: Red when the live call did not answer with a route
        if: steps.call.outputs.code != '0'
        run: |
          echo "::error title=No route::the live router did not answer with a route (exit ${{ steps.call.outputs.code }}); the finding records why"
          exit 1
