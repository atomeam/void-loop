# Weekly visual regression of the live site (tools/visual.mjs): the homepage, a typed ask and two answers at desktop and phone
# size, compared with last week's screenshots (the previous run's artifact). A page that changed by more than 2% of its pixels
# is a warning with both pictures attached; it never fails anything, since a redesign changes pixels on purpose.
name: Verse visual diff

on:
  schedule:
    - cron: '41 9 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Last week's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -w "Verse visual diff" -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
          [ -n "$id" ] && gh run download "$id" -n visual -D prev || echo "no earlier run"
      - name: Screenshots and diff
        run: node tools/visual.mjs --out shots --prev prev/shots
      - uses: actions/upload-artifact@v4
        with: { name: visual, path: shots, retention-days: 30 }
